# only the launchers differ. For a contributor with Anthropic credentials and
# nothing else, and for the days GPT credits are out.
# ---------------------------------------------------------------------------
[[orchestrations]]
name = "anthropic"
extends = "mixed"

[[orchestrations.roles]]
name = "orchestrator"
command = "devbox run agent-orchestrator"

[[orchestrations.roles]]
name = "coder"
command = "devbox run agent-coder"

[[orchestrations.roles]]
name = "reviewer"
command = "devbox run agent-reviewer"

[[orchestrations.roles]]
name = "auditor"
command = "devbox run agent-auditor"

[[orchestrations.roles]]
name = "tester"
command = "devbox run agent-tester"

[[orchestrations.roles]]
name = "release"
command = "devbox run agent-release"

# ---------------------------------------------------------------------------
# OpenCode on GPT models everywhere. The mirror image of `anthropic`.
#
# Launchers: `agent-orchestrator-oc`, `agent-coder-oc` and `agent-tester-oc` are
# NEW devbox scripts rather than three more references to the existing `oc-big`,
# because `oc-big` is already `mixed`'s auditor command — pointing GPT's roles at
# it would mean a GPT-only model bump silently re-models `mixed` too. Where reuse
# carries no such coupling it is reused: `agent-reviewer-oc` / `agent-auditor-oc`
# (gpt-5.5, deliberately a different model from the implementers, mirroring how
# `mixed` runs its review roles on a different harness) and `oc-release`
# (gpt-5.4-mini, mirroring `mixed`'s cheaper Sonnet release role).
# ---------------------------------------------------------------------------
[[orchestrations]]
name = "GPT"
extends = "mixed"

[[orchestrations.roles]]
