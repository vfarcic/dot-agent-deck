# Fixture for PRD #311's `tabs/orchestration/006`: a 3-role orchestration
# (orchestrator + two workers) where every role prints a unique sentinel on
# start, and the non-start `beta` role additionally self-posts real
# `SessionStart` / `PreToolUse` hook events (via `dot-agent-deck hook
# claude-code`, resolved through PATH) so its sidebar status card transitions
# Idle -> Working while it is NOT the focused/expanded role pane — proving a
# non-focused role keeps running and its status keeps updating even though its
# pane is not drawn (or, pre-fix, collapsed to a titled 1-row frame).
[[orchestrations]]
name = "focus-lifecycle"

[[orchestrations.roles]]
name = "orchestrator"
command = "printf 'ORCH_ROLE_SENTINEL\\n'; sleep 600"
start = true

# Issue #318: `alpha` is the role `e2e_orchestration_focus.rs` drives with
# synthetic status events, and the daemon now refuses a token-less event naming
# a pane it manages. So the pane publishes the capability token injected into it
# and the test reads it back — see `common::token_publishing_command`, which is
# the same line for panes whose command a test supplies directly.
[[orchestrations.roles]]
name = "alpha"
command = 'printf %s "$DOT_AGENT_DECK_AGENT_TOKEN" > "$HOME/.dad-agent-token.$DOT_AGENT_DECK_PANE_ID.part" && mv "$HOME/.dad-agent-token.$DOT_AGENT_DECK_PANE_ID.part" "$HOME/.dad-agent-token.$DOT_AGENT_DECK_PANE_ID"; printf "ALPHA_ROLE_SENTINEL\\n"; sleep 600'

[[orchestrations.roles]]
name = "beta"
command = "./beta-agent.sh"
