# Distinct start-role output identifies which orchestration tab survives.
[[orchestrations]]
name = "alpha"

[[orchestrations.roles]]
name = "orchestrator"
command = "printf 'ALPHA_TAB_SENTINEL\\n'; sleep 600"
start = true

[[orchestrations.roles]]
name = "worker"
command = "cat"

[[orchestrations]]
name = "beta"

[[orchestrations.roles]]
name = "orchestrator"
command = "printf 'BETA_TAB_SENTINEL\\n'; sleep 600"
start = true

[[orchestrations.roles]]
name = "worker"
command = "cat"
