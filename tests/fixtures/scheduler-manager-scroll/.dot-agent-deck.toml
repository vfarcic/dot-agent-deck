# The start role fills its pane with deterministic scrollback behind Schedules.
[[orchestrations]]
name = "scroll"

[[orchestrations.roles]]
name = "orchestrator"
command = "i=1; while [ \"$i\" -le 120 ]; do printf 'SIDE_SCROLL_LINE_%03d\\n' \"$i\"; i=$((i + 1)); done; sleep 600"
start = true

[[orchestrations.roles]]
name = "worker"
command = "cat"
