# Fixture for the live compaction re-assert (orchestration/remit/012,
# tests/e2e_orchestration_remit_live.rs, PRD #82 M2). The orchestrator is a
# REAL interactive Claude Code on Haiku; its role text makes every read of its
# role file observable as one line appended to a sentinel file, so the test can
# tell the startup read from the read the post-compaction re-assert causes. The
# worker is a `cat` stub: nothing is delegated and no tokens are spent on it.
[[orchestrations]]
name = "remit-compaction-live"

[[orchestrations.roles]]
name = "orchestrator"
command = "claude --model claude-haiku-4-5-20251001 --allowedTools Bash Read Write"
start = true
prompt_template = "This orchestration keeps a read log for the deck while it checks that coordinators keep their role, and that log is all the work there is, so there is nothing to delegate and no work-done to send. Each time you read this role file, including when the deck asks you to read it again later, record the read by running this command once with Bash: echo REMIT-READ >> remit_reads_82_5c1e.txt and then reply REMIT-ACK- followed immediately by 82-5c1e with no space, and wait. Create or edit no other file."

[[orchestrations.roles]]
name = "worker"
command = "cat"
