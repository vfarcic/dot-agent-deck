[package]
name = "dot-agent-deck-test-harness"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

# Issue #2083: the shared integration-test harness, as a library crate the
# root package's test binaries take as a dev-dependency. It used to be
# `mod common;` in every one of them, which compiled these ~23,000 lines once
# per test binary (191 times under the clippy gate) and made `cargo fmt`
# format them once per binary too. As a crate it is compiled once per build
# and formatted once.
#
# It stays under `tests/` on purpose: linkage-check rules 8, 10 and 11 scan
# `tests/`, and the harness is code those rules were written to cover.
#
# A test binary links it with `dot_agent_deck_test_harness::link!();` at its
# root, never with a bare `use`: the macro also defines the harness's pre-main
# constructors inside that binary. `lib.rs` says why a constructor left in
# this library would not be enough.

[lib]
path = "lib.rs"

[features]
# Mirrors the root package's `e2e` feature, which enables this one: parts of
# the harness exist only in an e2e build, and they call library items that
# are themselves gated on the root's `e2e`.
e2e = ["dot-agent-deck/e2e"]

[dependencies]
dot-agent-deck = { path = "../.." }
chrono = { version = "0.4", features = ["serde"] }
ctor = { version = "1.0", default-features = false }
# EXACT pin, matching the root package's: the harness drives the deck through
# the same `portable-pty`, and the root `Cargo.toml` says why it is held at
# 0.8.1 (0.9.0's Windows pseudoconsole stalls every pane). Move the two
# together; cargo would otherwise resolve them to one version anyway.
portable-pty = "=0.8.1"
ratatui = "0.30"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
vt100 = "0.18"
# PRD #77 Decision 30 / M4: the recording dump regenerates the paired .md.
xtask-docs = { path = "../../xtask/docs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
