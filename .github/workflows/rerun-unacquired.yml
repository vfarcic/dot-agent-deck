name: Rerun unacquired runners

# Reruns a CI run whose only failure is that GitHub never gave a job a runner.
#
# On 2026-11-16 GitHub's hosted macOS arm64 pool ran short. In four `ci.yml`
# runs, `build-macos-*` jobs sat queued for 15 minutes and were then cancelled
# with "The job was not acquired by Runner of type hosted even after multiple
# attempts". `build-macos` went red on code nobody had tested, `main` read red,
# and a dispatched run's red check kept the agent reviewer off a pull request.
# Each run went green on `gh run rerun --failed` once runners were free, which
# until now somebody had to notice and type.
#
# `scripts/ci-unacquired-runners.sh` decides; it answers UNACQUIRED_ONLY only
# when every failed job is one that never got a runner (or an aggregate of
# them), so a test failure, a timeout or a job cancelled after it started is
# never rerun here. Those stay red for a person, as CLAUDE.md rule 6 wants.
#
# `notify-main-red` holds its alert for attempt 1 when it reads the same
# answer, and says so with a `main-red alert held` annotation. When this job
# then does not rerun a `main` push (the attempt failed further after that job
# ran, a read failed, or the rerun request did), it sends the held alert.
#
# Bounded to ONE rerun: only attempt 1 is rerun, and attempt 2 is left as it
# ends. A single rerun turned every affected run green on 2026-11-16. The bound
# is one rather than two for a second reason: a rerun this job requests uses
# GITHUB_TOKEN, and whether the completion of an attempt started that way
# fires `workflow_run` again is not something this file can rely on. With one
# rerun nothing depends on it. `notify-main-red` in ci.yml holds its alert for
# attempt 1 only, so the two must agree (`run_attempt == 1` in both).
#
# `main` pushes and dispatched runs only: those are the runs that run
# `build-macos` (pull requests do not), and neither can come from a fork.
#
# Because `workflow_run` runs the default branch's copy, a change to THIS file
# or to the script takes effect only after it merges.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: rerun-unacquired-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the script
      actions: write   # read the run's jobs and rerun its failed ones
      checks: read     # read the jobs' annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rerun when no job got a runner and nothing else failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # GitHub runs this under `bash -e`; every command whose failure is
          # an answer rather than an error is guarded below.
          set -uo pipefail
          rc=0
          verdict="$(scripts/ci-unacquired-runners.sh "$RUN_ID" "$ATTEMPT")" || rc=$?
          echo "attempt $ATTEMPT: $verdict"
          if [ "$rc" -eq 0 ]; then
            if gh run rerun "$RUN_ID" --failed -R "$GITHUB_REPOSITORY"; then
              printf '### Rerun requested\n\nattempt %s: %s\n%s\n' "$ATTEMPT" "$verdict" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=rerun failed::could not rerun $RUN_URL"
            why="no runner, and the automatic rerun failed"
          else
            # OTHER (1) or unreadable (2): no rerun.
            printf '### Not rerun\n\nattempt %s: %s\n' "$ATTEMPT" "$verdict" >> "$GITHUB_STEP_SUMMARY"
            why="not rerun: $verdict"
          fi
          [ "$RUN_EVENT" = push ] && [ "$HEAD_BRANCH" = main ] || exit 0
          # notify-main-red may have held its alert for this attempt expecting
          # a rerun that is not coming: the rerun failed, the attempt failed
          # further after it ran (it does not wait for `cross-version`), or
          # this job could not read the run. Exit 1 (not held) is the only
          # answer that skips the alert; an unreadable one sends it.
          hrc=0
          held="$(scripts/ci-unacquired-runners.sh --alert-held "$RUN_ID" "$ATTEMPT")" || hrc=$?
          echo "notify-main-red: $held"
          if [ "$hrc" -ne 1 ]; then
            scripts/notify.sh "$(printf 'dot-agent-deck CI — main is RED (%s)\n%s\n' "$why" "$RUN_URL")"
          fi
          [ "$rc" -eq 0 ] && exit 1
          exit 0
