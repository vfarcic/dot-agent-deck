name: Docs Publish

# Builds the docs site and deploys it to Netlify production
# (agent-deck.devopstoolkit.ai). Reached two ways: release.yml's `docs` job via
# `uses:` on every release, and `workflow_dispatch` (the `/publish-docs` skill)
# to publish `main` between releases.
#
# It pushes nothing to the repository and nothing to a registry. Until #514 it
# also built a docs image for GHCR and committed a Helm chart bump straight to
# `main` under the admin RELEASE_TOKEN; nothing deployed either once the site
# moved to Netlify, so both went, and with them this workflow's only reason to
# hold that token.
on:
  workflow_call:
    inputs:
      version_label:
        description: 'Label for the Netlify deploy message (e.g. v0.26.0). The manual path uses main-<short sha>.'
        required: true
        type: string
    # Declared, rather than received through the caller's `secrets: inherit`,
    # so the release path hands this workflow these two and nothing else. A
    # caller whose `secrets:` map leaves one out is refused before any job
    # runs. `required` checks that the caller passes the secret, not that it
    # holds a value: an unset repository secret still arrives empty.
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  # The site is generated HERE, in a job with a read-only token and no secret,
  # and handed to the deploy as an artifact. Running `cargo xtask site` in the
  # job that holds the Netlify token would hand that token to every build
  # script in the crates it compiles. The deploy job runs no code from the
  # dependency tree at all.
  site-build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      # The commit the deploy publishes: it checks this out for
      # site/netlify.toml, so `main` moving mid-run cannot mix two commits.
      - name: Record the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0

      - name: Build site
        run: cargo xtask site site/build/public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/build
          if-no-files-found: error
          retention-days: 1

  # Netlify production deploy of the `site-build` artifact. It is the only job
  # holding the Netlify token, and it runs no code from the site's build.
  netlify-deploy:
    needs: site-build
    runs-on: ubuntu-latest
    steps:
      # For devbox.json (netlify-cli's pin) and site/netlify.toml, at the same
      # commit the site was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.site-build.outputs.sha }}
          persist-credentials: false

      # The release passes its version; a manual run has no inputs, so it is
      # labelled by the commit it publishes.
      - name: Resolve deploy label
        id: label
        env:
          INPUT_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_LABEL}" ]; then
            LABEL="${INPUT_LABEL}"
          else
            LABEL="main-$(git rev-parse --short=7 HEAD)"
          fi
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site/build

      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      # `--cwd site` is load-bearing. `devbox run` always executes from the repo
      # root, and from there netlify-cli never finds site/netlify.toml: the
      # deploy still succeeds, just without what it configures. `--dir` is
      # then relative to site/. `--no-build` because the CLI otherwise runs a build of its own.
      #
      # No spaces or `#` in any argument: some devbox versions flatten
      # `devbox run`'s args into one string and re-parse it through a shell
      # (see the `devbox` job in ci.yml), which would split a spaced --message.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          URL=$(devbox run -- netlify deploy --cwd site --prod --no-build --dir=build/public \
            --message "docs-${LABEL}" --json | jq -r '.url // .deploy_url')
          echo "Netlify production: ${URL}"
          echo "## Netlify production: ${URL} (\`docs-${LABEL}\`)" >> "$GITHUB_STEP_SUMMARY"
