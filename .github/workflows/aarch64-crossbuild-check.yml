# WHY THIS EXISTS
#
# `release.yml` cross-compiles `aarch64-unknown-linux-gnu` with `cross`, and that
# leg runs ONLY on a tag. So a change that breaks it is invisible until the
# release is already going out, and the failure lands at the worst moment.
#
# That is not hypothetical. reqwest 0.13 moved the TLS backend from ring to
# aws-lc-rs, which means the aarch64 build must now compile `aws-lc-sys` — a
# cmake/C library — inside the cross container. Nothing exercised it, so the
# first proof would have been a failed release. This job proved it works
# (`ELF ... ARM aarch64` plus `libaws_lc_0_43_0_crypto.a`) before the tag.
#
# It reproduces exactly the aarch64 leg of `release.yml`'s build matrix — same
# runner, same toolchain action, same version-pinned `cargo install cross`, same
# `cross build --release` — and nothing else: no tag, no publish, no artifacts.
# The cross version is part of what is mirrored (issue #323): if it drifts from
# `release.yml`'s, this job stops predicting the leg it exists to predict.
#
# KEPT DELIBERATELY, not temporary. It runs for PRs that touch the build inputs
# listed under `paths:` below (the root manifest, the lockfile, the vendored
# crates, the cargo configuration, a toolchain file, this file), so it costs
# nothing on PRs that touch none of them. A change to the dependency graph — the
# thing that can break a C-library cross-build — normally moves the lockfile;
# many changes to those paths move no graph at all (a vendored crate's docs,
# this file), and the check runs for them too. It is the only pre-tag coverage
# of that leg.
#
# It cannot be replaced by a local check: a devbox/Nix toolchain makes `cross`
# derive an invalid rustup toolchain name from `rustc --print sysroot`, a failure
# mode CI does not have. Verified separately that the cross image ships cmake
# 3.23.1, cc, aarch64-linux-gnu-gcc, make and perl.
#
# The final step asserts the ARTIFACT rather than the exit status, because a
# host-arch fallback would otherwise read as success — and because a pipeline
# during this work reported exit 0 for a build that had in fact failed.
name: aarch64 cross-build check

on:
  # `workflow_dispatch` alone is not enough to run this before it reaches the
  # default branch: GitHub only exposes dispatchable workflows that already exist
  # there ("not found on the default branch"). The `pull_request` trigger is what
  # lets the check actually run on this branch's PR — which is the only moment it
  # is needed, since the point is to prove the aarch64 leg BEFORE tagging.
  #
  # Scoped to PRs that touch the manifest, the lockfile, the crates under
  # `vendor/` (they are compiled into the binary), the cargo configuration (its
  # host-target `linker` also links the build scripts the cross build compiles), a
  # toolchain file (it would override the toolchain this job installs) or this
  # file, so it does not add ~10 minutes of cross-compilation to every unrelated
  # PR. `scripts/ci-changes.sh`'s `cargo` case is the same list for RWX.
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/workflows/aarch64-crossbuild-check.yml"

permissions:
  contents: read

jobs:
  # `.github/ci-backend` moves a pull request's Linux jobs to RWX
  # (docs/develop/rwx.md); `.rwx/ci.yml` runs this check there under the same
  # path filter. A dispatch always runs here.
  backend:
    runs-on: ubuntu-latest
    outputs:
      linux_backend: ${{ steps.backend.outputs.linux_backend }}
    steps:
      - id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The PR's HEAD, not `github.sha` (the merge commit): RWX reads the
          # file at the head, and both sides must make the same choice. Read
          # at the merge commit, a PR cut before `main` switched to `rwx`
          # would make GHA skip its Linux jobs while RWX, reading `gha` at
          # the head, skipped its own, and nothing would run.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          backend=gha
          if [ "$EVENT" = pull_request ]; then
            file=$(gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$REPO/contents/.github/ci-backend?ref=$SHA" 2>/dev/null \
              | tr -d '[:space:]' || true)
            [ "$file" = rwx ] && backend=rwx
          fi
          echo "linux_backend=$backend" | tee -a "$GITHUB_OUTPUT"

  aarch64-crossbuild:
    needs: backend
    if: needs.backend.outputs.linux_backend != 'rwx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: aarch64-unknown-linux-gnu
      - name: Install cross
        # Keep this version in lockstep with `release.yml`'s cross install — see
        # the WHY block at the top of this file. Issue #323.
        run: cargo install cross --locked --version 0.2.5
      - name: Build (this is the step that must not fail at tag time)
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Prove aws-lc-sys actually built for aarch64
        run: |
          set -euo pipefail
          # The binary must exist AND be ARM64 — a silent host-arch fallback
          # would otherwise look like success.
          bin=target/aarch64-unknown-linux-gnu/release/dot-agent-deck
          test -f "$bin"
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64'
          # aws-lc-sys compiles to a static archive under its build dir; its
          # presence is what distinguishes "linked fine" from "never needed".
          find target/aarch64-unknown-linux-gnu -name 'libaws_lc_*.a' -o -name '*aws-lc-sys*' \
            | head -20
          echo "OK: aarch64 binary produced with the aws-lc-rs TLS backend"
