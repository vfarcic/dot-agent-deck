name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
      skip_desktop:
        description: 'Skip the desktop GUI alpha bundles (use when the bundler is known-broken)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      # Fail here, not 20 steps later at the push. This job commits the
      # changelog straight to `main`, which only an admin identity may do:
      # `main` is ruleset-protected and `github-actions[bot]` is deliberately
      # NOT a bypass actor (GITHUB_TOKEN cannot be one on a user-owned repo).
      # RELEASE_TOKEN is the admin PAT that bypasses it.
      #
      # This step replaces a `|| github.token` fallback that was correct when
      # written and is now a trap. Its stated purpose was to keep the workflow
      # "behaving exactly as it does today while the secret is unset, so this
      # change is safe to merge before `main` is protected" — both conditions
      # have since flipped (`main` protected 2026-08-08, secret set the same
      # day). All the fallback can do now is turn an unset or empty secret into
      # a silent downgrade to an identity that cannot push, surfacing as the
      # v0.35.6 `GH006` failure after the release is already half-done.
      #
      # What this guard does NOT cover: it tests emptiness, so a token that is
      # present but expired, revoked or under-scoped passes it and still fails
      # later at the push, with the tag cut and the changelog written. Probing
      # the token would cost an API call and add a failure mode of its own on
      # the release path, so the cheap check is deliberate. The old fallback did
      # not cover that case either -- GitHub's `||` returns the left operand
      # whenever it is non-empty, so an expired PAT went straight through.
      - name: Verify RELEASE_TOKEN is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is unset or empty. This job pushes the changelog commit to the protected \`main\` branch and needs the admin PAT to bypass the ruleset; GITHUB_TOKEN cannot. Set the RELEASE_TOKEN secret and re-run. See CLAUDE.md rule 8."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Extract version
        id: version
        # Every GitHub-context value a `run:` script in this workflow consumes
        # is bound through `env:` and referenced as a quoted shell variable. A
        # `${{ … }}` expression is substituted as *raw text* before bash parses
        # the line, so a crafted `workflow_dispatch` input — or a tag name,
        # which may legally contain quotes, `;` and `$(…)` — would otherwise
        # execute as shell code in a pipeline that holds `contents`/`packages`
        # write and, downstream, the Homebrew/Scoop publishing tokens. Bound
        # through `env:` the value is only ever data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Pin the collation for the whole step: the SemVer gate below matches
          # with bash's `=~`, whose bracket expressions are resolved against the
          # active locale rather than against ASCII (see the note at the pattern).
          # Pinned here rather than at the pattern so nothing added to this step
          # later can reintroduce a locale-dependent comparison.
          export LC_ALL=C
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Validate BEFORE writing to GITHUB_OUTPUT so a malformed or hostile
          # value fails fast in `prepare` instead of fanning out to every
          # consumer — the changelog script, the changelog commit message, the
          # release tag, the `task` publish steps and the docs workflow all read
          # this one output.
          #
          # SemVer 2.0.0 transcribed into POSIX ERE (bash's `=~` has no
          # non-capturing groups), assembled from named pieces because the
          # character classes have to be spelled out and the one-line form would
          # be unreadable.
          #
          # WHY THE CLASSES ARE ENUMERATED AND NOT RANGES: a bracket *range* in
          # an ERE is interpreted through the active locale's collation, so
          # `[0-9]` and `[a-zA-Z]` are not ASCII-only. Under `en_US.UTF-8` this
          # step accepted `1.2.3-é` and the full-width `１.２.３` and wrote them
          # to GITHUB_OUTPUT, while the identical step under `C` rejected them —
          # a gate whose verdict depended on the runner's locale. Such values are
          # shell-inert, but `semver::Version::parse` in `build.rs` rejects them,
          # so `DAD_VERSION` would have been silently ignored and the version
          # fallen back to an older git tag or the `0.1.0` placeholder while the
          # artifact was published under the requested tag: precisely the issue
          # #250 bug this gate exists to prevent. Belt and braces — `LC_ALL=C`
          # above already fixes the collation, and these enumerations mean the
          # same thing in any locale — so neither defence alone is load-bearing
          # and a reader does not have to guess which one is.
          d='[0123456789]'
          nz='[123456789]'
          # `-` last inside a bracket expression is a literal, never a range end.
          alpha='[abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-]'
          alnum='[0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-]'
          # The `{0,18}` bound on the three core fields keeps this gate at least
          # as strict as `build.rs`, whose `semver::Version::parse` stores each
          # field in a `u64`: an unbounded digit run would accept a 20-digit core
          # that the build script then rejects, silently falling `DAD_VERSION`
          # back to git so the artifact misreports its own version.
          core="(0|${nz}${d}{0,18})"
          ident="(0|${nz}${d}*|${d}*${alpha}${alnum}*)"
          # `[.]`/`[+]` rather than `\.`/`\+`: a single-character bracket
          # expression carries no range semantics and no backslash to survive
          # quoting. The pattern is anchored and built only from
          # digit/letter/`.`/`-`/`+` characters, so a value carrying a newline or
          # any control character cannot match — which is also what keeps the
          # single-line `version=` output well-formed.
          semver_re="^${core}[.]${core}[.]${core}(-${ident}([.]${ident})*)?([+]${alnum}+([.]${alnum}+)*)?"'$'
          if [[ ! "$VERSION" =~ $semver_re ]]; then
            # `%q` escapes the rejected value, so it cannot start a line with
            # `::` and forge a workflow command, nor span multiple lines.
            printf 'Rejected version (escaped): %q\n' "$VERSION" >&2
            echo "::error::Refusing to release: version is not valid SemVer. Expected X.Y.Z with no leading 'v', optionally -prerelease and +build. The escaped value is in this step's log."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify the flake version matches the release
        # flake.nix pins the released version in a let-binding and hands it to
        # the build as DAD_VERSION, because a `nix run github:...` build gets a
        # source tarball with no `.git` for `build.rs` to describe and would
        # otherwise fall back to the `0.1.0` placeholder. A release that bumps
        # the tag without bumping the flake ships a source build reporting the
        # wrong version, which is the same class of bug the DAD_VERSION seam
        # (#250) was added to prevent, and the `Build` job below already uses
        # that seam for the same reason. Fail the release loudly here rather
        # than publish the mismatch.
        #
        # WHAT THIS STEP NOW PROTECTS IS NARROWER THAN IT WAS (issue #1089). The
        # pin used to be a hand-maintained line, bumped by a maintainer in a
        # separate commit from the tag, so this step guarded against the obvious
        # human error of moving one and not the other. Since #1089
        # `tag-release.yml` derives both from a single dispatch input, asserts
        # the pin it just wrote, and creates the tag from that same commit — so
        # on that path this step is checking the output of one workflow against
        # another output of the same workflow. Keep it: it is nearly free, and it
        # still catches a bug in `tag-release.yml`, an out-of-band edit to
        # `flake.nix`, and a `workflow_dispatch` of THIS workflow with a version
        # that does not match the tree (a path #1089 did not touch). But do not
        # read it as the guard against a forgotten manual bump any more; nothing
        # is bumped manually on the blessed path.
        #
        # Bound through `env:` for the reason spelled out on the step above: a
        # `${{ }}` expression is substituted as raw text before bash parses the
        # line, so nothing from the GitHub context is ever shell code.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # `export` does not cross into another `run:` block, so the `LC_ALL=C`
          # pinned in the step above is not in scope here. Nothing below is
          # locale-sensitive today; pinned for the same reason it is pinned
          # there, so nothing added to this step later can introduce a
          # locale-dependent match.
          export LC_ALL=C
          # A grep/sed over flake.nix, not `nix eval --raw
          # .#packages.x86_64-linux.default.version`. The eval is the robust read
          # but it needs Nix on the runner, and `prepare` is a short metadata job
          # with no Nix: installing it and evaluating the flake would put minutes
          # on the critical path of every release to read one string literal. The
          # `nix` job in ci.yml already proves the flake evaluates and builds; all
          # this step has to do is compare a version.
          #
          # The cheap read is only worth it if it cannot silently match nothing,
          # or match the wrong line, and pass. So the pattern is anchored to a
          # whole line and the match count is asserted to be exactly 1: an empty
          # or ambiguous extraction is a hard failure, not a pass.
          matches=$(grep -cE '^[[:space:]]*version = "[^"]+";[[:space:]]*$' flake.nix || true)
          if [ "${matches:-0}" -ne 1 ]; then
            echo "::error::Refusing to release: expected exactly one anchored 'version = \"...\";' line in flake.nix, found ${matches:-0}. The extraction pattern in this step no longer fits the file, so the version pin cannot be checked."
            exit 1
          fi
          # Same pattern as the guard, character for character: a `[^"]*`
          # extractor would be a strict superset of a `[^"]+` guard, so it could
          # also print a `version = "";` line the guard did not count and the
          # captured value would carry a leading newline.
          FLAKE_VERSION=$(sed -nE 's/^[[:space:]]*version = "([^"]+)";[[:space:]]*$/\1/p' flake.nix)
          if [ -z "$FLAKE_VERSION" ]; then
            echo "::error::Refusing to release: the pinned version in flake.nix extracted as an empty string."
            exit 1
          fi
          if [ "$FLAKE_VERSION" != "$VERSION" ]; then
            # Both values are safe to interpolate into the message: VERSION
            # passed the SemVer gate above, and FLAKE_VERSION was extracted with
            # the same pattern the guard counted, so "exactly one line matched"
            # and "exactly one clean extraction" are the same statement, and
            # `[^"]+` excludes quotes and newlines alike. Neither value can
            # start a line with `::` and forge a workflow command.
            echo "::error::Refusing to release: flake.nix pins version '$FLAKE_VERSION' but the release is '$VERSION'. Bump the version let-binding in flake.nix so the Nix build reports the release it actually is."
            exit 1
          fi
          # A matching pin is necessary but not sufficient. `version` is only a
          # let-binding, and everything above still passes if the derivation has
          # stopped handing it to the build: `DAD_VERSION = "0.1.0";` next to
          # `version = "0.35.7";` agrees with the tag and ships a binary
          # reporting the placeholder, which is precisely the bug this step
          # exists to catch. So assert the wire too, under the same anchoring
          # discipline as the pin: exactly one whole-line `DAD_VERSION =
          # version;`, with zero or several a hard failure rather than a pass.
          wired=$(grep -cE '^[[:space:]]*DAD_VERSION = version;[[:space:]]*$' flake.nix || true)
          if [ "${wired:-0}" -ne 1 ]; then
            echo "::error::Refusing to release: expected exactly one anchored 'DAD_VERSION = version;' line in flake.nix, found ${wired:-0}. The pinned version is no longer wired to the build, so the Nix build reports whatever that env value now says rather than the release it claims to be."
            exit 1
          fi
          echo "flake.nix pins '$FLAKE_VERSION', which matches the release, and hands it to the build as DAD_VERSION."
      # The assembled notes travel to `finalize` as an ARTIFACT, not as a job
      # output, and the reason is a hard kernel limit rather than a preference.
      #
      # A job output reaches its consumer through `${{ }}` interpolation, and
      # `finalize` fed it to `body:`, which GitHub Actions turns into a single
      # environment variable. Linux caps one argument-or-environment string at
      # MAX_ARG_STRLEN -- 32 pages, 131072 bytes -- which is NOT the 2MB ARG_MAX
      # that comes to mind first. v0.41.1's notes were 131,970 bytes, 900 over,
      # and the step failed with `Argument list too long` BEFORE the action ran:
      # tag pushed, changelog committed to `main`, all six build legs green, and
      # no GitHub Release at all. Binary-searched on this runner class, the
      # largest env var that will start a process is 131,069 bytes.
      #
      # Moving it to a `run:` step's own `env:` would have failed identically --
      # it is the same environment. A file is the only thing that does not go
      # through argv or the environment, and `finalize` reads it with
      # `body_path`. The `changelog` job output is kept, but nothing consumes
      # it any more: it costs nothing, sits well under the 1MB job-output cap,
      # and stays visible in the run for debugging. What must not come back is
      # a consumer that interpolates it into `env:` or `with:`.
      - name: Assemble changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/assemble-changelog.sh
          scripts/assemble-changelog.sh "$VERSION" > "${RUNNER_TEMP}/release-body.md"

          # RE-RUN PATH. `assemble-changelog.sh` CONSUMES `changelog.d/` and
          # commits the result to CHANGELOG.md, then exits 0 writing NOTHING
          # when there are no fragments left. So a second run of this workflow
          # for the same version -- which is exactly the sanctioned recovery
          # when the tag landed and `finalize` did not -- would assemble an
          # empty body and publish a Release with no notes at all, while the
          # real notes sat in CHANGELOG.md out of reach. Measured on v0.41.1:
          # `changelog.d/` held only `.gitkeep`, and the script exited 0 with
          # 0 bytes on stdout.
          #
          # So when the assembler yields nothing, recover the already-committed
          # section for THIS version out of CHANGELOG.md. `awk` between this
          # version's `## [x.y.z]` heading and the next `## ` heading, which is
          # the format `assemble-changelog.sh` itself writes. Failing to find
          # it is fatal: publishing empty notes is worse than not publishing.
          if [ ! -s "${RUNNER_TEMP}/release-body.md" ]; then
            echo "::notice::No fragments left; recovering the v$VERSION section from CHANGELOG.md (re-run path)."
            awk -v v="$VERSION" '
              $0 ~ ("^## \\[" v "\\]") { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "${RUNNER_TEMP}/release-body.md"
            if [ ! -s "${RUNNER_TEMP}/release-body.md" ]; then
              echo "::error::No fragments in changelog.d/ AND no '## [$VERSION]' section in CHANGELOG.md. Refusing to publish a Release with empty notes."
              exit 1
            fi
          fi

          # GitHub caps a release body at 125,000 CHARACTERS, and enforces it
          # in two different ways that both bit v0.41.1. `finalize` creating
          # the release SILENTLY TRUNCATED a 131,299-character body to exactly
          # 125,000, ending mid-sentence. Then `desktop-publish`, which appends
          # the unsigned-alpha note afterwards, was rejected outright with
          # `HTTP 422: body is too long (maximum is 125000 characters)` -- so
          # the .dmg and .deb shipped with no Gatekeeper instructions and no
          # `gh attestation verify` command at all.
          #
          # So clamp here, deliberately, rather than letting GitHub cut. Two
          # details matter. CHARACTERS, not bytes: this file is full of em
          # dashes and arrows, and v0.41.1 was 131,945 bytes but 131,299
          # characters. And the cut lands on a top-level entry boundary
          # ("- **"), never mid-sentence, with a pointer to the full text.
          #
          # RESERVE is headroom for the note `desktop-publish` appends later.
          # Without it the clamp passes and that step still fails, which is the
          # half of v0.41.1 that actually cost users something.
          #
          # Raised from 3000 to 3500 by issue #1152, which lengthened that note
          # by 282 characters and left only 135 of headroom by the (deliberately
          # overstating) measure `the_reserve_covers_the_note_desktop_publish_appends`
          # takes. The note is prose and gets edited; a margin that thin means
          # the next sentence added to it reopens the v0.41.1 failure. Clamping
          # 500 characters earlier costs a release nothing -- it only bites
          # bodies already over 121,500 characters, and then only by moving the
          # cut one entry sooner.
          #
          # Raised again, from 3500 to 4000, by PRD #757 M4: the note now has a
          # signed and an unsigned macOS paragraph, and that test's measure sums
          # every `printf` in the step -- both branches -- which put it at 3443
          # and left 57 characters of headroom. Only one macOS branch is ever
          # appended, so the real note is shorter than that measure; the
          # headroom is kept on the overstating side for the reason above.
          python3 - "${RUNNER_TEMP}/release-body.md" <<'CLAMP'
          import sys
          LIMIT, RESERVE = 125000, 4000
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          if len(src) <= LIMIT - RESERVE:
              print(f"release body: {len(src)} chars, under the cap")
              raise SystemExit
          pointer = ("\n\n---\n\n*These notes are truncated to fit GitHub's 125,000-character "
                     "limit on a release body. The complete entry is in "
                     "[CHANGELOG.md](https://github.com/vfarcic/dot-agent-deck/blob/main/CHANGELOG.md).*\n")
          budget = LIMIT - RESERVE - len(pointer)
          # ALWAYS an entry boundary when one exists, however early it falls.
          # This used to drop to `rfind("\n")` when the last `- **` sat in the
          # first half of the budget, on the theory that an early boundary
          # wastes room. That was wrong: an entry spans several physical lines,
          # so a line cut lands INSIDE one and publishes half an entry -- the
          # exact mid-sentence truncation this clamp exists to prevent, just
          # committed by us instead of by GitHub. Keeping less is the cheaper
          # error. The line fallback survives only for a body with no entry
          # markers at all, where there is nothing better to cut on.
          cut = src.rfind("\n- **", 0, budget)
          if cut == -1:
              cut = src.rfind("\n", 0, budget)
          # `rfind` returns -1 when it finds nothing, and `src[:-1]` is not a
          # clamp -- it drops ONE character and reports success. A 131,299-char
          # body comes back 131,311 (the pointer is longer than the character
          # removed), GitHub truncates it silently, and the clamp has caused
          # precisely the failure it exists to prevent while printing a
          # reassuring line. Needs a body with no newline at all in the first
          # ~122,000 characters, which `assemble-changelog.sh` does not produce
          # -- but the whole point of this step is that the cap is reached by
          # bodies nobody predicted, and a guard that fails silently is worse
          # than none. Cut on the character budget instead.
          if cut <= 0:
              cut = budget
          out = src[:cut].rstrip() + pointer
          open(p, "w", encoding="utf-8").write(out)
          print(f"release body: {len(src)} chars -> {len(out)} after clamping to the 125,000 cap")
          CLAMP

          {
            echo "changelog<<CHANGELOG_EOF"
            cat "${RUNNER_TEMP}/release-body.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the release body
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-body
          path: ${{ runner.temp }}/release-body.md
          retention-days: 1
      - name: Commit changelog updates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changelog.d/
          git stash
          git checkout main
          # Sync local main to remote before re-applying our changes so the
          # push at the end fast-forwards cleanly even if main advanced between
          # checkout and this step (e.g. a parallel push).
          git pull --rebase --autostash origin main
          git stash pop || true
          git add CHANGELOG.md changelog.d/
          git diff --cached --quiet || git commit -m "docs: update changelog for v$VERSION"
          git push origin main

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_suffix: linux-amd64
            use_cross: false
            binary_ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_suffix: linux-arm64
            use_cross: true
            binary_ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_suffix: darwin-amd64
            use_cross: false
            binary_ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_suffix: darwin-arm64
            use_cross: false
            binary_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        # Issue #323: `--locked` pins cross's own dependency GRAPH, not the
        # version of cross being installed, so without `--version` this resolved
        # whatever crates.io called newest. 0.2.5 is not an arbitrary choice —
        # it is the version the `CROSS_BUILD_ENV_PASSTHROUGH` measurement below
        # was taken on, and an unpinned install is what let that measurement
        # silently stop describing the binary actually running. The same pin is
        # in aarch64-crossbuild-check.yml, which exists to mirror this leg.
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        # Issue #250: bake the version being released into the binary rather than
        # letting `build.rs` re-derive it from the checkout.
        #
        # On a TAG PUSH this changes nothing: `prepare` computes
        # `${GITHUB_REF_NAME#v}`, which is exactly what
        # `git describe --tags --abbrev=0` already resolved to in the tagged
        # checkout, and `build.rs` strips the same `v` prefix. Same value, same
        # artifact.
        #
        # On `workflow_dispatch` the checkout is `main` and the new tag does not
        # exist yet, so `git describe` returns the *previous* release and the
        # binary published as vX.Y.Z claimed to be the version before it. The
        # injection is the only thing that can fix that, because the version is
        # only known to the `prepare` job.
        #
        # An empty value degrades safely: `build.rs` treats blank as "not
        # injected" and falls back to git, i.e. today's behavior.
        env:
          DAD_VERSION: ${{ needs.prepare.outputs.version }}
          # `cross` runs cargo inside a container and forwards only the
          # `CARGO_*` / `CROSS_*` host variables by default, so DAD_VERSION has
          # to be named explicitly. This env var is cross's equivalent of
          # `build.env.passthrough` in a `Cross.toml` (whitespace-separated
          # list) and is inert for the plain `cargo build` targets.
          #
          # MEASURED, not assumed (cross 0.2.5, now the version the install step
          # above pins explicitly): with this set, the build script inside
          # the aarch64 container observes DAD_VERSION and resolves
          # `source=INJECTED`; with it unset the variable is absent inside the
          # container and the script falls back to the checkout's git tag. That
          # fallback is exactly issue #250's failure — a `workflow_dispatch`
          # release would publish the ARM64 artifact under the new tag while the
          # binary reported the previous one.
          CROSS_BUILD_ENV_PASSTHROUGH: DAD_VERSION
          # Second, independent channel for the same value, because the line
          # above is the only thing standing between a dispatch release and a
          # mislabeled ARM64 binary — a cross release could rename or retire its
          # passthrough allowlist and this leg would go quiet rather than fail.
          # Since #323 the install is version-pinned, so such a change can now
          # only arrive with a visible bump to that pin rather than on its own;
          # this channel stays as the second, independent line of defense.
          # `CROSS_CONTAINER_OPTS` is appended to cross's `docker run` argv, so
          # `-e DAD_VERSION` forwards the host value through docker itself,
          # below cross's own config layer. Measured to be sufficient ON ITS OWN
          # with the passthrough allowlist removed, and to combine with it
          # without a duplicate-argument error. Both degrade safely: with
          # DAD_VERSION empty or unset, `docker run -e` sets nothing (or an
          # empty string, which `build.rs` treats as "not injected") and the
          # build falls back to git exactly as it does today.
          CROSS_CONTAINER_OPTS: -e DAD_VERSION
          # `matrix.*` values are static literals in this file, so these two are
          # defense in depth rather than a live hole — bound anyway so that every
          # `run:` script in this workflow is uniformly free of `${{ … }}` and a
          # future matrix entry cannot silently reintroduce the pattern.
          MATRIX_USE_CROSS: ${{ matrix.use_cross }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [ "$MATRIX_USE_CROSS" = "true" ]; then
            cross build --release --target "$MATRIX_TARGET"
          else
            cargo build --release --target "$MATRIX_TARGET"
          fi
      # Issue #250 is "an artifact published under one version while reporting
      # another", so the release path asserts that it did not just do that.
      #
      # WHY THIS EXISTS EVEN THOUGH THE TWO ENV CHANNELS ABOVE ARE BOTH MEASURED
      # TO WORK: both are *preventive*, and both live on the far side of the
      # container boundary — if forwarding ever breaks, whatever depended on
      # forwarding breaks with it, silently. A strictness flag baked into
      # `build.rs` would have exactly that defect: it would have to be forwarded
      # too. This check runs on the HOST, against the finished artifact, so it
      # cannot be defeated by the failure it is looking for.
      #
      # SCOPED TO THE CROSS LEG on purpose. The native legs get DAD_VERSION
      # straight from this job's `env:` block with no boundary to lose it at;
      # the container is the only place the value travels between environments.
      #
      # `build.rs` deliberately keeps falling back (env -> git -> placeholder)
      # rather than failing, and that stays: its audience is packagers, Nix,
      # `cargo install --git` and dev checkouts, where no version is injected
      # and a hard failure would break every such build. The release job is the
      # one caller that knows exactly which version it is publishing, so it is
      # the right place — and the only correct place — to turn a silent fallback
      # into a failed release.
      - name: Verify the released version is baked into the artifact
        if: matrix.use_cross
        env:
          DAD_VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          set -euo pipefail
          BIN="target/${MATRIX_TARGET}/release/dot-agent-deck${MATRIX_BINARY_EXT}"
          # An empty needle would make `grep -F` match anything, so the vacuous
          # pass is rejected explicitly rather than relying on `prepare`'s
          # SemVer gate to have made it impossible.
          if [ -z "$DAD_VERSION" ]; then
            echo "::error::Refusing to publish: the prepared release version is empty, so the artifact cannot be verified."
            exit 1
          fi
          # Checked separately so a build that produced no binary reports that,
          # rather than being blamed on the injection below.
          if [ ! -f "$BIN" ]; then
            echo "::error::Refusing to publish: expected ${MATRIX_TARGET} binary at ${BIN}, but it does not exist."
            exit 1
          fi
          # `env!("DAD_VERSION")` is a &'static str reached at runtime, so the
          # exact version is in the binary's rodata (measured: 6 occurrences in
          # a real aarch64 artifact). When injection is lost the value is a
          # different string entirely and the count is 0 — verified by building
          # this crate for aarch64 both ways.
          if ! grep -a -q -F -- "$DAD_VERSION" "$BIN"; then
            echo "::error::${MATRIX_TARGET} artifact does not contain the version being released (${DAD_VERSION}). The injected DAD_VERSION did not reach the build script inside the cross container, so this binary reports a different version than the tag it would be published under (issue #250). Refusing to publish it."
            exit 1
          fi
          echo "OK: ${MATRIX_TARGET} artifact reports ${DAD_VERSION}"
      - name: Package
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          MATRIX_BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          BINARY_NAME="dot-agent-deck-${MATRIX_ARTIFACT_SUFFIX}${MATRIX_BINARY_EXT}"
          cp "target/${MATRIX_TARGET}/release/dot-agent-deck${MATRIX_BINARY_EXT}" "$BINARY_NAME"
          echo "BINARY_NAME=$BINARY_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dot-agent-deck-${{ matrix.artifact_suffix }}
          path: ${{ env.BINARY_NAME }}

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
      # PRD #740: `pattern` is load-bearing, not tidiness. `merge-multiple`
      # flattens every artifact of the run into one directory, and the
      # `desktop-bundle` job uploads into the same run — so without a pattern,
      # whether a desktop bundle landed in `dist/` would depend on which job
      # finished first. It would then be swept into the release by the
      # `dist/dot-agent-deck-*` glob below and fed to `task checksums`, whose
      # `shasum -a 256 dot-agent-deck-*` cannot cope with the space in Tauri's
      # `Agent Deck_<version>_amd64.deb` output name. The desktop job therefore
      # names its artifacts `desktop-bundle-*`, which this pattern excludes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dot-agent-deck-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: task checksums
      - name: Detect channel
        id: channel
        # Pre-release versions carry a SemVer pre-release suffix (e.g.
        # `-alpha.0`, `-rc.1`). They route to a parallel `dot-agent-deck-beta`
        # formula / manifest so stable users on `brew upgrade dot-agent-deck`
        # never see them; opt-in via `brew install vfarcic/tap/dot-agent-deck-beta`.
        #
        # Read from prepare.outputs.version (not GITHUB_REF_NAME) so the
        # discriminator works for both tag-push and workflow_dispatch triggers:
        # on workflow_dispatch GITHUB_REF_NAME is the branch ('main'), which
        # would mask any pre-release input and wrongly publish to stable.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "${VERSION}" == *"-"* ]]; then
            echo "name=dot-agent-deck-beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=dot-agent-deck" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the release body
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-body
          path: ${{ runner.temp }}/release-body
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: ${{ runner.temp }}/release-body/release-body.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            dist/dot-agent-deck-*
            dist/checksums.txt
          fail_on_unmatched_files: true
      # Issue #1152: hand the CLI manifest to `attest`, which has no checkout
      # and can reach a file only as an artifact. Without this the manifest is
      # the one CLI asset provenance never covered -- and it is the file a user
      # leans on to validate all the others, so it is exactly the one worth
      # swapping.
      #
      # THE BYTES MATTER MORE THAN THE WIRING HERE. `attest` must not re-run
      # `shasum`: a second run in a different job would produce a file that is
      # very probably identical and provably nothing, and an attestation over
      # bytes the release does not carry is worse than no attestation at all.
      # So the published file itself travels, and this step sits immediately
      # after the release step that consumed it -- nothing between `task
      # checksums` above and here writes to `dist/`.
      #
      # AFTER the release step and BEFORE the four `task` steps below, both
      # deliberately: those write `dist/<name>.rb` and `dist/<name>.json` into
      # the same directory, so `path:` names the single file rather than the
      # directory, and the position keeps that true even if the glob is ever
      # widened.
      #
      # The artifact NAME stays outside `dot-agent-deck-*` for the same reason
      # `desktop-bundle`'s does: that is the pattern this job's own download
      # selects on, so a re-run of `finalize` alone would otherwise pull the
      # previous attempt's manifest into `dist/` and feed it straight back into
      # `task checksums`' `shasum -a 256 dot-agent-deck-*`.
      #
      # `overwrite: true` because RE-RUNNING `finalize` IS A REAL PATH and this
      # step sits in front of the part of it most likely to need one: artifacts
      # are scoped to the run rather than the attempt and upload-artifact v4+
      # refuses to replace an existing name, so without this a second attempt
      # would die here -- before `task homebrew-publish` and
      # `task scoop-publish`, the two steps that hold cross-repo tokens and that
      # a retry usually exists to get past (v0.35.6's `GH006`).
      #
      # This is DELIBERATELY not `ci.yml`'s `-attempt-${{ github.run_attempt }}`
      # convention, and the difference is what the artifact is for. Those are
      # per-attempt diagnostic records, deliberately kept side by side so a
      # failing attempt stays readable after its conclusion is gone. This is a
      # HAND-OFF to a consumer in the same run, where only the newest is ever
      # wanted and a stable name is what lets `attest` ask for it -- an
      # attempt-qualified name would break the moment `attest` alone were
      # re-run, since its `run_attempt` would no longer match the one
      # `finalize` uploaded under. Same reasoning as the `--clobber` already on
      # this workflow's `gh release upload`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error
          overwrite: true
      # These four steps are the ones that hold the publishing tokens, so they
      # are the highest-value sink for an injected value: bind both the version
      # and the channel name through `env:` and pass each `task` variable as a
      # single quoted argv element.
      - name: Generate Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL_NAME: ${{ steps.channel.outputs.name }}
        run: task homebrew-formula "VERSION=v$RELEASE_VERSION" "NAME=$CHANNEL_NAME"
      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL_NAME: ${{ steps.channel.outputs.name }}
        run: task homebrew-publish "VERSION=v$RELEASE_VERSION" "NAME=$CHANNEL_NAME"
      - name: Generate Scoop manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL_NAME: ${{ steps.channel.outputs.name }}
        run: task scoop-manifest "VERSION=v$RELEASE_VERSION" "NAME=$CHANNEL_NAME"
      - name: Publish Scoop manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL_NAME: ${{ steps.channel.outputs.name }}
        run: task scoop-publish "VERSION=v$RELEASE_VERSION" "NAME=$CHANNEL_NAME"

  # PRD #740: bundle the desktop GUI (`desktop/`) as an alpha artifact. The
  # Linux leg's `.deb` is the release asset; since PRD #757 M4 the macOS leg
  # produces an unsigned `.app` for `desktop-sign`, which builds the `.dmg`.
  # This job holds no signing credential.
  #
  # The topology is the design. This job hangs off `prepare`, NOT `build`, so it
  # runs concurrently with the CLI matrix and adds nothing to the critical path;
  # and `finalize` deliberately does not list it in `needs:`, so the GitHub
  # Release and its five CLI assets are created on exactly today's path whether
  # this job succeeds, fails, or is skipped. A broken bundler can therefore
  # neither slow a tag nor break one.
  #
  # A failure turns the run RED while leaving the release green and complete.
  # That is deliberate: `continue-on-error: true` would keep the run green and
  # make a silently missing artifact indistinguishable from a healthy release.
  #
  # Windows is deliberately absent. A Tauri bundle carries the daemon as a
  # sidecar; no Windows daemon binary is published (this matrix has no
  # `*-pc-windows-*` leg either); and a Windows GUI cannot reach a remote Linux
  # daemon instead, because the IPC transport is a named pipe on Windows and a
  # Unix socket everywhere else. See PRD #740 Decision 1, and issue #741.
  desktop-bundle:
    needs: prepare
    # `inputs` is empty on a tag push, so this is true and the default is to
    # bundle on every release. The input is an escape hatch for cutting a
    # release while the bundler is known-broken, not an opt-in.
    if: ${{ !inputs.skip_desktop }}
    strategy:
      # One platform's bundler breaking must not cancel the other's; a macOS
      # app is still worth signing and publishing when the Linux leg fails.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_suffix: macos-arm64
            # The `.app` only, NOT a `.dmg` (PRD #757 Decision 4). The disk
            # image is built by `desktop-sign`, after the app inside it has been
            # signed -- signing an app already sealed inside a `.dmg` would mean
            # unpacking and rebuilding it anyway. This leg holds no signing
            # credential and must not be given one: it compiles the desktop
            # crate's whole third-party dependency graph, and a cargo build
            # script is arbitrary code.
            bundles: app
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_suffix: linux-amd64
            # `.deb` only. AppImage was in the plan and was dropped on
            # evidence: it failed on the first real bundle attempt, and more
            # importantly its bundler downloads FIVE third-party artifacts at
            # build time -- two of them (`linuxdeploy-plugin-gtk.sh` and
            # `linuxdeploy-plugin-gstreamer.sh`) from a `master` ref, which is
            # mutable. Executing whatever sits on someone else's default branch
            # at tag time, while building an artifact users install, is not a
            # supply-chain property a release pipeline should have. Re-adding
            # it is one word here once it is pinned. See PRD #740 Decision 7.
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The first six are ci.yml's compile set, needed because this job builds
      # `dot-agent-deck-desktop` — five for Tauri and `libasound2-dev` for PRD
      # #802 M7's `cpal`, whose `alsa-sys` build script resolves `alsa` through
      # pkg-config on Linux. The rest are needed only by the bundlers:
      # producing a .deb and an AppImage shells out to them, and ci.yml has
      # never needed them because it only ever compiles the crate.
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev \
            patchelf fakeroot file desktop-file-utils
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      # pnpm and Node match ci.yml's `desktop-web` job, so what is tested is
      # what is shipped. pnpm is also the exact version devbox.json pins, and
      # `scripts/check-pin-lockstep.sh` fails if any of those sites disagree
      # (issue #1262). Node is a major here as in ci.yml, and not in that guard.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: desktop
        # The bundle config's `beforeBuildCommand` runs `npm run …` inside a
        # pnpm-installed tree, which works only because node_modules/.bin is
        # already populated. So this must happen before `tauri build`.
        run: pnpm install --frozen-lockfile
      - name: Build the bundle
        working-directory: desktop
        env:
          # The same seam the CLI release uses: build.rs prefers an injected
          # DAD_VERSION over `git describe`, so the sidecar daemon staged inside
          # the bundle reports the version actually being released.
          DAD_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_BUNDLES: ${{ matrix.bundles }}
        run: |
          set -eu
          # tauri.conf.json hardcodes version "0.1.0", and that value is not
          # cosmetic: it lands in Info.plist's CFBundleShortVersionString and in
          # the .deb version field. Merge the real version into the bundle
          # overlay at build time so no tracked file ever carries a version
          # number -- the same discipline as Cargo.toml's 0.1.0 placeholder.
          #
          # ONE merged --config rather than two stacked ones, so this does not
          # depend on the Tauri CLI accepting repeated --config arguments.
          jq --arg v "$RELEASE_VERSION" '. + {version: $v}' \
            src-tauri/tauri.bundle.conf.json > src-tauri/tauri.release.conf.json
          set -- \
            --target "$MATRIX_TARGET" \
            --config src-tauri/tauri.release.conf.json \
            --bundles "$MATRIX_BUNDLES"
          # PRD #757: `--no-sign` on macOS makes "this leg does not sign" a
          # property of the invocation rather than of which environment
          # variables happen to be absent. Tauri's bundler (tauri-cli 2.11.5,
          # the version desktop/pnpm-lock.yaml pins) signs the `.app` when its
          # environment holds APPLE_CERTIFICATE together with
          # APPLE_CERTIFICATE_PASSWORD, or when a signing identity is named by
          # APPLE_SIGNING_IDENTITY or `bundle.macOS.signingIdentity`; with none
          # of them it skips signing without an error. None is set here today,
          # and this flag keeps a future edit that adds one from silently
          # moving signing back onto this runner. The Linux invocation is left
          # exactly as it was.
          if [ "$RUNNER_OS" = "macOS" ]; then
            set -- "$@" --no-sign
          fi
          pnpm tauri build "$@"
      - name: Collect and rename the bundle assets
        if: runner.os == 'Linux'
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          BUNDLE_DIR="target/${MATRIX_TARGET}/release/bundle"
          mkdir -p dist-desktop
          # `bundle.active` is false in the base tauri.conf.json and only the
          # overlay flips it to true, so an invocation that lost its --config
          # produces NO bundle and still exits 0. Assert the output exists
          # rather than trusting the exit code.
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::no bundle directory at ${BUNDLE_DIR}. tauri build exited 0 but produced no bundle -- bundle.active is false unless the overlay config is passed."
            exit 1
          fi
          found=0
          versioned=0
          # -print0 because Tauri derives output names from productName, which
          # is "Agent Deck" -- with a space.
          # Via a file, not a pipe or a heredoc: a pipe would put the loop in a
          # subshell and lose the counters, and command substitution in a
          # heredoc strips the NUL bytes that -print0 exists to emit.
          find "$BUNDLE_DIR" -type f \
            \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) \
            -print0 > bundle-files.list
          while IFS= read -r -d "" src; do
            ext="${src##*.}"
            case "$src" in
              *"$RELEASE_VERSION"*) versioned=1 ;;
            esac
            dest="dist-desktop/dot-agent-deck-desktop-alpha-${ASSET_SUFFIX}.${ext}"
            cp "$src" "$dest"
            echo "collected: $src -> $dest"
            found=$((found + 1))
          done < bundle-files.list
          rm -f bundle-files.list
          if [ "$found" -eq 0 ]; then
            echo "::error::${BUNDLE_DIR} exists but holds no .dmg/.deb/.AppImage."
            exit 1
          fi
          # Tauri names its output "<productName>_<version>_<arch>.<ext>", so a
          # filename carrying the release version is direct evidence that the
          # injected version reached the bundle rather than the 0.1.0 literal.
          # Same discipline as the CLI leg's rodata grep for DAD_VERSION.
          if [ "$versioned" -ne 1 ]; then
            echo "::error::no bundle filename contains ${RELEASE_VERSION}; the version injection did not reach the bundle and these artifacts would be labelled 0.1.0."
            exit 1
          fi
      # PRD #757: the macOS leg's output is an app for `desktop-sign` to sign,
      # not a release asset, so it is archived here and handed on rather than
      # collected into `dist-desktop/`.
      #
      # A `ditto` archive rather than the `.app` directory itself, because
      # `actions/upload-artifact` documents that it does not keep file
      # permissions -- every file arrives 644 -- which would strip the
      # executable bit from the main binary and from the `dot-agent-deck`
      # daemon sidecar, the very files `desktop-sign` is about to sign.
      # `ditto` records modes, symlinks and extended attributes inside the zip,
      # where the uploader cannot flatten them. `--sequesterRsrc` keeps
      # resource forks in `__MACOSX` rather than as AppleDouble files beside
      # the code, which would otherwise be sealed into the signature.
      - name: Archive the macOS app for signing
        if: runner.os == 'macOS'
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          APP_DIR="target/${MATRIX_TARGET}/release/bundle/macos"
          # Same reasoning as the Linux collector: `bundle.active` is false
          # unless the overlay config is passed, so a lost --config exits 0 with
          # no bundle. Assert the output rather than trusting the exit code.
          count=$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .app under ${APP_DIR}, found ${count}. tauri build exited 0 but did not produce the app bundle."
            exit 1
          fi
          APP=$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app')
          # A `.app` name carries no version, unlike the Linux leg's output
          # file, so the injected-version check reads Info.plist instead. It is
          # the same evidence: the release version reached the bundle rather
          # than the 0.1.0 placeholder.
          bundled=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          if [ "$bundled" != "$RELEASE_VERSION" ]; then
            echo "::error::${APP} reports CFBundleShortVersionString ${bundled}, not ${RELEASE_VERSION}; the version injection did not reach the bundle."
            exit 1
          fi
          mkdir -p dist-desktop-app
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-desktop-app/dot-agent-deck-desktop-alpha-${ASSET_SUFFIX}.app.zip"
          ls -la dist-desktop-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Linux'
        with:
          # Deliberately NOT `dot-agent-deck-*`: that is the pattern `finalize`
          # selects on, and these must stay out of the CLI release's `dist/`.
          name: desktop-bundle-${{ matrix.asset_suffix }}
          path: dist-desktop/
          # Re-running a failed `desktop-bundle` leg must not die on the
          # artifact its own earlier attempt uploaded: artifacts are scoped to
          # the run, not the attempt. The sibling upload in `finalize` has the
          # longer reasoning.
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'macOS'
        with:
          # Outside BOTH download patterns in this file: not `dot-agent-deck-*`
          # (`finalize`) and not `desktop-bundle-*` (`desktop-publish` and
          # `attest`), because this archive is an intermediate and must never
          # be published or attested. `desktop-sign` asks for it by name and
          # uploads the finished `.dmg` as `desktop-bundle-macos-arm64`, which
          # is what those two jobs select.
          name: desktop-app-${{ matrix.asset_suffix }}
          path: dist-desktop-app/
          if-no-files-found: error
          # Same re-run reasoning as the Linux upload above.
          overwrite: true

  # PRD #757 Decision 4: the one job that holds the Apple signing credentials.
  #
  # It is split out of `desktop-bundle` for a single reason. That job compiles
  # the desktop crate's full Rust dependency graph and installs `desktop/`'s npm
  # graph, Renovate automerges cargo patch bumps (and minors of crates at 1.0
  # or later) with no human in the loop, and a cargo build script is arbitrary
  # code. A Developer ID private key in that job's environment would be
  # readable by whatever a dependency update brought in. So the key lives here instead, in a job that has no
  # `actions/checkout` and runs its own inline steps, two SHA-pinned artifact
  # actions (`download-artifact`, `upload-artifact`; Renovate holds their
  # updates in this file for a human, see renovate.json) and the runner's
  # system tools (`security`, `codesign`, `ditto`, `hdiutil`, `xcrun`,
  # `plutil`, `openssl`, `curl`, `shasum`, `file`, `python3`). None of its
  # steps invokes the binaries it signs -- `file`, `codesign` and the notary
  # service read them as data.
  #
  # What this does NOT protect against, stated because a split reads as more
  # than it is: `desktop-bundle` can still put anything it likes INSIDE the app,
  # and this job will sign it. The split keeps the key from being exfiltrated
  # by build-time code; it does not vouch for what that code produced. The
  # notary service's scan and its audit trail of submissions are the check on
  # that, and PRD #757 Decision 5 records why a leaked key would cost far more
  # than a bad submission: an exposed Developer ID certificate is revoked, not
  # rotated, and revocation stops already-installed copies launching.
  #
  # The credentials are ENVIRONMENT secrets of `desktop-signing`, not repository
  # secrets, so no job that does not declare that environment can read them --
  # which includes the reusable workflow `docs` calls with `secrets: inherit`.
  # docs/develop/desktop-signing.md has the inventory, the registration steps,
  # the environment's deployment-ref restriction, expiry, rotation and the
  # revocation runbook.
  #
  # Three outcomes, chosen by the "Classify the signing credentials" step:
  # all five secrets empty -> an UNSIGNED `.dmg`, `signed=false`, job green
  # (today's state, before any credential is registered); all five set ->
  # signed, notarized and stapled, `signed=true`; any other combination ->
  # fail, because a half-registered set is a mistake to surface, not a reason
  # to ship unsigned. An expired or nearly expired certificate fails too.
  #
  # Off the CLI's critical path like the rest of the desktop chain: `finalize`
  # does not wait on it, so a signing or notarization failure turns the run red
  # and leaves the CLI release complete. `desktop-publish` still publishes the
  # `.deb` when this job fails.
  desktop-sign:
    needs: [desktop-bundle]
    # `!cancelled()` because `needs` on the bundle MATRIX resolves to the
    # aggregate: without it, a failed LINUX leg would skip this job and throw
    # away a macOS app that built fine -- the #768 defect `desktop-publish`
    # already guards against. Whether the macOS leg itself produced an app is
    # answered by the download step below.
    if: ${{ !cancelled() && !inputs.skip_desktop }}
    runs-on: macos-latest
    environment: desktop-signing
    # Job-level permissions replace the workflow-level `contents: write` /
    # `packages: write`. This job needs no GITHUB_TOKEN scope: it has no
    # checkout and calls no GitHub API (its network calls go to Apple), and
    # same-run artifact transfer authenticates with the runner's own token
    # rather than GITHUB_TOKEN.
    permissions: {}
    # Notarization waits on Apple, and the job submits twice (the app, then the
    # disk image). Bounded so a stuck notary queue cannot hold the runner, and
    # the credentials on it, for the platform default of six hours.
    timeout-minutes: 180
    outputs:
      # Set by the LAST step, and only once the `.dmg` has been uploaded, so an
      # empty value means "this job did not deliver a disk image" rather than
      # defaulting to either claim. `desktop-publish`'s note reads it.
      signed: ${{ steps.result.outputs.signed }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: app
        # Tolerated so the step below can say WHY there is nothing to sign,
        # instead of the action's own "Artifact not found".
        continue-on-error: true
        with:
          name: desktop-app-macos-arm64
          path: app-archive
      - name: Check there is an app to sign
        env:
          DOWNLOAD_OUTCOME: ${{ steps.app.outcome }}
        run: |
          set -eu
          if [ "$DOWNLOAD_OUTCOME" != "success" ] || [ ! -f app-archive/dot-agent-deck-desktop-alpha-macos-arm64.app.zip ]; then
            echo "::error::no desktop-app-macos-arm64 artifact: the macOS desktop-bundle leg failed or its artifact could not be downloaded, so there is no app to sign and no .dmg will be published. The Linux .deb and the CLI release are unaffected."
            exit 1
          fi
      # Self-contained on purpose: this step reads only its environment and
      # writes only `$GITHUB_OUTPUT`, and uses nothing macOS-specific, so its
      # `run:` block can be lifted out and executed under bash with each
      # combination of set and empty variables. It prints secret NAMES, never
      # values.
      - name: Classify the signing credentials
        id: creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -eu
          present=""
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
            eval "value=\${$name:-}"
            if [ -n "$value" ]; then
              present="$present $name"
            else
              missing="$missing $name"
            fi
          done
          if [ -z "$present" ]; then
            echo "::notice::no Apple signing credentials are registered for the desktop-signing environment, so this release's macOS .dmg is built UNSIGNED. See docs/develop/desktop-signing.md to register them."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          elif [ -z "$missing" ]; then
            echo "all five Apple signing credentials are present; signing and notarizing."
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the Apple signing credentials are only partly registered. Present:${present}. Missing or empty:${missing}. Refusing to fall back to an unsigned build when signing was evidently intended -- register the missing secrets in the desktop-signing environment, or remove all five to ship unsigned deliberately. See docs/develop/desktop-signing.md."
            exit 1
          fi
      # The archive was produced by `desktop-bundle`, the job that runs
      # third-party build code, and it is unpacked on the runner that holds the
      # key -- so its member list is checked before anything is written to
      # disk. `ditto -x -k`'s own handling of absolute paths, `..` components
      # and entries written through an archived symlink is NOT measured on a
      # Mac; this step does not rely on it being safe, and it does not claim
      # `ditto` would have been unsafe without it.
      #
      # Self-contained on purpose, like the classifier above: it reads only
      # `APP_ARCHIVE` and writes nothing but its log, and its `run:` block uses
      # `python3`'s standard-library `zipfile` and nothing macOS-specific, so it
      # can be lifted out and run on a Linux host against hostile zips. python3
      # rather than `zipinfo`/`unzip -Z` because zipinfo's text output would
      # have to be parsed to recover names containing spaces or newlines, and
      # `zipfile` hands over the raw name and mode bits directly. python3 ships
      # on both GitHub-hosted macOS and Ubuntu images.
      #
      # It rejects the archive when an entry:
      # - has an absolute name, or a `..`, `.` or empty path component, or a
      #   NUL or backslash in its name (the raw name is checked, because
      #   `zipfile` silently truncates a name at NUL);
      # - is neither a regular file, a directory nor a symlink (device, fifo,
      #   socket), judged from the Unix mode bits in its external attributes;
      # - lies outside the single top-level `<name>.app/` directory, other than
      #   `__MACOSX/<name>.app/...`, where `--sequesterRsrc` puts extended
      #   attributes and resource forks as plain files;
      # - repeats a name, or sits beneath an archived symlink -- compared after
      #   Unicode NFD normalisation and case folding, because the runner's APFS
      #   volume is case- and normalisation-insensitive by default, so
      #   `Contents/L` and `Contents/l` are one path there;
      # - is a symlink whose target is absolute, empty, not UTF-8, or which,
      #   resolved inside the archive (following other archived symlinks, at
      #   most 40 hops), does not land inside the `.app`.
      #
      # WHY SYMLINKS ARE ALLOWED AT ALL: a legitimate bundle can carry them --
      # a versioned macOS framework has `Versions/Current -> A` and top-level
      # links into it. This bundle ships no framework today, so it probably has none,
      # but rejecting every symlink would make the first framework dependency
      # fail the release for a layout Apple requires. A link that stays inside
      # the bundle can only alias a file the archive already controls; one that
      # leaves it is how an unpack writes, or a later step reads, outside the
      # unpack root, so that is the line drawn. Names are printed with repr()
      # so a newline in a hostile name cannot start a workflow command.
      #
      # Every member is also opened, which makes `zipfile` reject one whose
      # local header names a different path than its central-directory entry.
      #
      # Not covered: decompression bombs (size); a local file header that no
      # central-directory entry points at, which this check never sees (it
      # reads the central directory; which one `ditto` reads is unmeasured);
      # and anything about what the files CONTAIN -- see the job comment above.
      - name: Validate the app archive before extracting it
        env:
          APP_ARCHIVE: app-archive/dot-agent-deck-desktop-alpha-macos-arm64.app.zip
        run: |
          set -eu
          python3 - "$APP_ARCHIVE" <<'PY'
          import stat
          import sys
          import unicodedata
          import zipfile

          archive = sys.argv[1]
          problems = []


          def key(path):
              return unicodedata.normalize("NFD", path).casefold()


          try:
              zf = zipfile.ZipFile(archive)
          except (OSError, zipfile.BadZipFile) as err:
              print(f"::error::cannot read {archive!r} as a zip archive: {err}")
              sys.exit(1)

          entries = []
          links = {}
          seen = set()
          tops = set()
          with zf:
              for info in zf.infolist():
                  raw = info.orig_filename
                  if "\0" in raw or "\\" in raw:
                      problems.append(f"{raw!r}: NUL or backslash in the name")
                      continue
                  if raw.startswith("/"):
                      problems.append(f"{raw!r}: absolute path")
                      continue
                  named_dir = raw.endswith("/")
                  path = raw[:-1] if named_dir else raw
                  parts = path.split("/")
                  if any(p in ("", ".", "..") for p in parts):
                      problems.append(f"{raw!r}: empty, '.' or '..' path component")
                      continue
                  mode = info.external_attr >> 16
                  ftype = stat.S_IFMT(mode)
                  if ftype == 0:
                      kind = "dir" if named_dir else "file"
                  elif stat.S_ISDIR(mode):
                      kind = "dir"
                  elif stat.S_ISREG(mode) and not named_dir:
                      kind = "file"
                  elif stat.S_ISLNK(mode) and not named_dir:
                      kind = "link"
                  else:
                      problems.append(f"{raw!r}: not a regular file, directory or symlink (mode {mode:o})")
                      continue
                  k = key(path)
                  if k in seen:
                      problems.append(f"{raw!r}: duplicate entry (after case folding and normalisation)")
                      continue
                  seen.add(k)
                  tops.add(parts[0])
                  # Opening a member is what makes zipfile compare the local
                  # header's name with the central directory's, which is the
                  # list everything else here reads.
                  try:
                      with zf.open(info):
                          pass
                  except (zipfile.BadZipFile, NotImplementedError, RuntimeError) as err:
                      problems.append(f"{raw!r}: unreadable or inconsistent entry: {err}")
                      continue
                  if kind == "link":
                      try:
                          target = zf.read(info).decode("utf-8")
                      except UnicodeDecodeError:
                          problems.append(f"{raw!r}: symlink target is not UTF-8")
                          continue
                      links[k] = target
                  entries.append((raw, parts, kind))

          apps = sorted(t for t in tops if t != "__MACOSX")
          if len(apps) != 1 or not apps[0].endswith(".app"):
              problems.append(f"expected exactly one top-level '<name>.app' directory, found {apps!r}")
              top = None
          else:
              top = apps[0]


          def resolve(start, target):
              parts = list(start)
              pending = target.split("/")[::-1]
              hops = 0
              while pending:
                  c = pending.pop()
                  if c in ("", "."):
                      continue
                  if c == "..":
                      if not parts:
                          return None
                      parts.pop()
                      continue
                  parts.append(key(c))
                  here = "/".join(parts)
                  if here in links:
                      hops += 1
                      nxt = links[here]
                      if hops > 40 or nxt.startswith("/"):
                          return None
                      parts.pop()
                      pending.extend(nxt.split("/")[::-1])
              return parts


          if top is not None:
              for raw, parts, kind in entries:
                  if parts[0] == "__MACOSX":
                      if kind == "link":
                          problems.append(f"{raw!r}: symlink inside __MACOSX")
                          continue
                      # Where ditto applies this entry: the path it describes.
                      # An AppleDouble file sits beside what it describes, so
                      # the bundle root's own one is `__MACOSX/._<top>` and
                      # the prefix has to come off before the root compare.
                      mapped = parts[1:]
                      if kind == "file" and mapped and mapped[-1].startswith("._"):
                          mapped[-1] = mapped[-1][2:]
                      if mapped and mapped[0] != top:
                          problems.append(f"{raw!r}: __MACOSX entry for something other than {top!r}")
                          continue
                  else:
                      mapped = parts
                  for i in range(1, len(mapped)):
                      if key("/".join(mapped[:i])) in links:
                          problems.append(f"{raw!r}: lies beneath an archived symlink")
                          break
                  if kind != "link":
                      continue
                  target = links[key("/".join(parts))]
                  if not target or target.startswith("/"):
                      problems.append(f"{raw!r}: symlink target {target!r} is empty or absolute")
                      continue
                  landed = resolve([key(p) for p in parts[:-1]], target)
                  if not landed or landed[0] != key(top):
                      problems.append(f"{raw!r}: symlink target {target!r} does not resolve to a path inside {top!r}")

          if problems:
              for p in problems[:50]:
                  print(f"::error::unsafe app archive entry: {p}")
              if len(problems) > 50:
                  print(f"::error::... and {len(problems) - 50} more")
              print(f"::error::refusing to extract {archive!r} on the signing runner ({len(problems)} problem(s)).")
              sys.exit(1)
          print(f"app archive OK: {len(entries)} entries under {top!r}, {len(links)} symlink(s), all resolving inside it.")
          PY
      - name: Unpack the app
        id: unpack
        run: |
          set -eu
          UNPACK="$RUNNER_TEMP/app"
          mkdir -p "$UNPACK"
          ditto -x -k app-archive/dot-agent-deck-desktop-alpha-macos-arm64.app.zip "$UNPACK"
          # The second half of the check above, against what `ditto` actually
          # wrote rather than what the archive claimed: no device, fifo or
          # socket file, and no symlink whose fully resolved target leaves the
          # unpack root.
          special=$(find "$UNPACK" \( -type b -o -type c -o -type p -o -type s \) -print)
          if [ -n "$special" ]; then
            echo "::error::the unpacked app contains device, fifo or socket files; refusing to sign it:"
            printf '%s\n' "$special"
            exit 1
          fi
          find "$UNPACK" -type l -print0 | python3 -c '
          import os, sys
          root = os.path.realpath(sys.argv[1])
          bad = [p for p in sys.stdin.buffer.read().split(b"\0") if p]
          bad = [p for p in bad if not os.path.realpath(p).startswith(os.fsencode(root) + b"/")]
          for p in bad:
              print(f"::error::unpacked symlink {p!r} resolves outside the unpack root, to {os.path.realpath(p)!r}")
          sys.exit(1 if bad else 0)
          ' "$UNPACK"
          count=$(find "$RUNNER_TEMP/app" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::the app archive holds ${count} .app bundles at its top level, expected exactly one."
            exit 1
          fi
          APP=$(find "$RUNNER_TEMP/app" -maxdepth 1 -type d -name '*.app')
          # The property the ditto archive exists to preserve. If it did not
          # survive, codesign would seal a sidecar that cannot be executed.
          if [ ! -x "$APP/Contents/MacOS/dot-agent-deck" ]; then
            echo "::error::${APP}/Contents/MacOS/dot-agent-deck is missing or not executable after unpacking; the daemon sidecar did not survive the artifact hand-off."
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
      - name: Import the certificate into a throwaway keychain
        if: steps.creds.outputs.mode == 'signed'
        id: keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          P12="$RUNNER_TEMP/desktop-signing.p12"
          # Random per run and never printed. The keychain is deleted by the
          # cleanup step at the end of this job whatever happens.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          # EXPIRY, which an emptiness check cannot see: an expired certificate
          # is present, imports cleanly, and fails at codesign -- or worse, is
          # caught only by notarization. It is read from the `.p12` itself,
          # before anything enters the keychain, for two reasons. First,
          # `find-identity -v` hides an expired identity, so the keychain can
          # only report "found 0" where this names the real cause. Second, a
          # search by name (`find-certificate -c`) returns the first match and
          # can read a different certificate from the one that signs; the
          # `.p12`'s one certificate-with-key IS the signing certificate, and
          # the identity check below asserts that by SHA-1.
          #
          # `-clcerts -nokeys` writes only the certificate(s) paired with a
          # private key, never the key. The password travels by environment,
          # not argv. Under OpenSSL 3 a `.p12` exported with the older RC2-40
          # encryption reads only with `-legacy`, an option not every
          # `openssl` on a macOS runner accepts, so the plain form is tried
          # first and `-legacy` only if it fails.
          LEAF="$RUNNER_TEMP/developer-id.pem"
          if ! openssl pkcs12 -in "$P12" -nokeys -clcerts -passin env:APPLE_CERTIFICATE_PASSWORD -out "$LEAF" 2> /dev/null \
            && ! openssl pkcs12 -legacy -in "$P12" -nokeys -clcerts -passin env:APPLE_CERTIFICATE_PASSWORD -out "$LEAF"; then
            echo "::error::could not read the certificate out of APPLE_CERTIFICATE with APPLE_CERTIFICATE_PASSWORD. Check that the password matches the .p12 (docs/develop/desktop-signing.md)."
            exit 1
          fi
          leaves=$(grep -c 'BEGIN CERTIFICATE' "$LEAF" || true)
          if [ "$leaves" -ne 1 ]; then
            echo "::error::expected APPLE_CERTIFICATE to hold exactly one certificate with its private key, found ${leaves}. Export only the Developer ID Application certificate and its key as the .p12 (docs/develop/desktop-signing.md)."
            exit 1
          fi
          subject=$(openssl x509 -in "$LEAF" -noout -subject)
          case "$subject" in
            *"Developer ID Application"*) ;;
            *)
              echo "::error::the certificate in APPLE_CERTIFICATE is not a Developer ID Application certificate (${subject}). Export the Developer ID Application certificate and its key as the .p12 (docs/develop/desktop-signing.md)."
              exit 1
              ;;
          esac
          # The fail threshold is one day, not zero, because this job runs for
          # up to three hours after this point and signs twice. Signatures are
          # made with `--timestamp`, so a signature made while the certificate
          # is valid stays valid after it expires; what must not happen is the
          # certificate expiring between here and the second codesign.
          enddate=$(openssl x509 -in "$LEAF" -noout -enddate)
          echo "Developer ID Application certificate ${enddate}"
          if ! openssl x509 -in "$LEAF" -noout -checkend 86400 > /dev/null; then
            echo "::error::the Developer ID Application certificate in APPLE_CERTIFICATE has expired or expires within 24 hours (${enddate}). Refusing to sign. Renew it and replace APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD -- docs/develop/desktop-signing.md, 'Certificate expiry'."
            exit 1
          fi
          if ! openssl x509 -in "$LEAF" -noout -checkend 2592000 > /dev/null; then
            echo "::warning::the Developer ID Application certificate expires within 30 days (${enddate}). Renew it before the next release -- docs/develop/desktop-signing.md, 'Certificate expiry'."
          fi
          LEAF_SHA1=$(openssl x509 -in "$LEAF" -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$P12"
          # Apple's Developer ID G2 intermediate, so the chain resolves whether
          # or not the `.p12` was exported with it. An intermediate cannot
          # create trust on its own: the chain is still validated up to the
          # Apple root already in the system keychain.
          #
          # PINNED by the SHA-256 of its DER bytes, so what enters the keychain
          # beside the key is a known certificate rather than whatever that URL
          # served on the day. `--proto '=https'` and `--proto-redir '=https'`
          # keep `-L` from following a redirect to plain HTTP. The pin was
          # computed on 2026-09-24 from that URL (served HTTP 200, no redirect,
          # 1090 bytes): subject `CN=Developer ID Certification Authority,
          # OU=G2, O=Apple Inc., C=US`, issuer `Apple Root CA`, serial
          # 7FB4003FCD97497ACB834D92A48A7873C2845D43, valid 2021-09-22 to
          # 2031-09-17. Recompute it with
          #   curl --proto '=https' --proto-redir '=https' -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer | shasum -a 256
          # and check the subject, issuer and dates with
          #   openssl x509 -inform DER -noout -subject -issuer -serial -dates
          # before changing it (docs/develop/desktop-signing.md, "The Apple
          # intermediate pin").
          G2_SHA256=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          got=$(shasum -a 256 "$RUNNER_TEMP/DeveloperIDG2CA.cer" | awk '{print $1}')
          if [ "$got" != "$G2_SHA256" ]; then
            echo "::error::the Apple Developer ID G2 intermediate downloaded from apple.com has SHA-256 ${got}, not the pinned ${G2_SHA256}. Refusing to import it. Review what Apple now serves at that URL and, if it is a legitimate reissue, update G2_SHA256 in release.yml -- docs/develop/desktop-signing.md, 'The Apple intermediate pin'."
            exit 1
          fi
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put the throwaway keychain on the search list so codesign finds the
          # identity, keeping the runner's existing keychains after it.
          existing=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          # shellcheck disable=SC2086 # word-splitting the list is the point
          security list-keychains -d user -s "$KEYCHAIN" $existing
          # Exactly one Developer ID Application identity, addressed by its
          # SHA-1 so a second certificate with the same name cannot be picked
          # by accident.
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' || true)
          n=$(printf '%s\n' "$identities" | grep -c 'Developer ID Application' || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one valid 'Developer ID Application' identity in APPLE_CERTIFICATE, found ${n}. Export the Developer ID Application certificate together with its private key as the .p12 (docs/develop/desktop-signing.md)."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          IDENTITY=$(printf '%s\n' "$identities" | awk '{print $2}')
          # The identity codesign will use must be the certificate whose expiry
          # was just checked, not merely one with the same name.
          if [ "$IDENTITY" != "$LEAF_SHA1" ]; then
            echo "::error::the keychain's Developer ID Application identity (${IDENTITY}) is not the certificate read from APPLE_CERTIFICATE (${LEAF_SHA1}). Refusing to sign with a certificate whose expiry was not checked."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
      - name: Sign the app
        if: steps.creds.outputs.mode == 'signed'
        env:
          APP: ${{ steps.unpack.outputs.app }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          set -eu
          # Hardened-runtime entitlements for the APP. Authored here, inline,
          # rather than read from the tree: this job has no checkout, and a
          # plist carried over from `desktop-bundle` would let the job that
          # runs third-party build code choose what the key vouches for. Every
          # key is listed with its reason; add none without one.
          #
          # - com.apple.security.cs.allow-jit: PRD #757 Decision 4 records a
          #   missing JIT entitlement as producing a bundle that signs cleanly
          #   and crashes on launch. NOT measured on this app: WKWebView runs
          #   JavaScript in Apple's own WebContent process, so this may prove
          #   unnecessary for the host process. Kept until M6 measures it,
          #   because omitting it risks a signed release that cannot start,
          #   while including it only loosens one hardened-runtime restriction
          #   on this process.
          # - com.apple.security.device.audio-input: voice capture (PRD #802
          #   M7, desktop/src-tauri/src/voice/capture.rs) opens the microphone
          #   through CoreAudio. The hardened runtime denies audio input to a
          #   process that lacks this entitlement, independently of the
          #   Info.plist usage string and of the user's permission.
          #
          # Deliberately absent: allow-unsigned-executable-memory (the legacy
          # form of JIT, superseded by allow-jit), disable-library-validation
          # (no dylib or framework is configured for bundling -- tauri.conf.json
          # sets no `bundle.macOS.frameworks` -- so there is nothing of ours
          # for library validation to reject), and get-task-allow (debug
          # only, and notarization rejects it).
          ENTITLEMENTS="$RUNNER_TEMP/Entitlements.plist"
          cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.device.audio-input</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$ENTITLEMENTS"
          MAIN=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          # Inside out, per Apple: every nested Mach-O first, deepest path
          # first, then the bundle, whose seal records their signatures. No
          # `--deep` for signing -- it applies one set of options and
          # entitlements to everything it finds, which is why Apple deprecates
          # it for this. `--force` replaces the ad-hoc signature the arm64
          # linker already put on each binary.
          #
          # Nested code gets the hardened runtime and NO entitlements. Today
          # that is the `dot-agent-deck` daemon sidecar, which needs neither
          # JIT nor the microphone; an entitlement it does not need is only
          # attack surface. tauri#11992 reports notarization failing when
          # `externalBin` is configured, which is this sidecar -- the
          # `--verify --deep --strict` below is the first check of that class.
          find "$APP/Contents" -type f -print0 > "$RUNNER_TEMP/bundle-files.list"
          : > "$RUNNER_TEMP/nested.list"
          while IFS= read -r -d "" f; do
            if [ "$f" = "$APP/Contents/MacOS/$MAIN" ]; then
              continue
            fi
            if file -b "$f" | grep -q 'Mach-O'; then
              depth=$(printf '%s' "$f" | tr -cd '/' | wc -c | tr -d ' ')
              printf '%s\t%s\n' "$depth" "$f" >> "$RUNNER_TEMP/nested.list"
            fi
          done < "$RUNNER_TEMP/bundle-files.list"
          if [ ! -s "$RUNNER_TEMP/nested.list" ]; then
            echo "::error::found no nested Mach-O binary in ${APP}; the daemon sidecar should be one. Refusing to sign a bundle whose layout is not what this step expects."
            exit 1
          fi
          sort -rn "$RUNNER_TEMP/nested.list" | cut -f2- > "$RUNNER_TEMP/nested.sorted"
          while IFS= read -r f; do
            echo "signing nested: $f"
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY" "$f"
          done < "$RUNNER_TEMP/nested.sorted"
          echo "signing app: $APP"
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          # `--deep` IS right here: for verification it walks every nested
          # signature instead of trusting the seal.
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign --display --entitlements - "$APP"
      - name: Notarize and staple the app
        if: steps.creds.outputs.mode == 'signed'
        env:
          APP: ${{ steps.unpack.outputs.app }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Despite its name, the CONTENTS of the App Store Connect `.p8` key,
          # not a path to one -- a secret cannot be a file. The name is kept
          # because it is the one registered; it is written to a file below.
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -eu
          # The app is notarized and stapled on its own, BEFORE it goes into
          # the disk image, so the ticket travels with the app when a user
          # drags it to /Applications. Stapling only the `.dmg` would leave the
          # installed app to fetch its ticket from Apple at first launch, which
          # fails offline -- and an offline launch is M6's acceptance test.
          umask 077
          printf '%s\n' "$APPLE_API_KEY_PATH" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 75m --output-format json > "$RUNNER_TEMP/notary-app.json" || true
          cat "$RUNNER_TEMP/notary-app.json"
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary-app.json" 2>/dev/null || echo unknown)
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary-app.json" 2>/dev/null || true)
            echo "::error::notarization of the app returned status '${status}', not Accepted."
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            fi
            exit 1
          fi
          rm -f "$RUNNER_TEMP/app-for-notary.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
      # Both paths build the disk image the same way, so a signed and an
      # unsigned release differ only in the signatures -- not in layout. The
      # layout is the app plus an /Applications link for drag-install; Tauri's
      # own `.dmg` bundler is not used, because it runs inside `tauri build`
      # on the job that must not hold the key.
      - name: Build the disk image
        env:
          APP: ${{ steps.unpack.outputs.app }}
        run: |
          set -eu
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" dist-desktop
          ditto "$APP" "$STAGE/$(basename "$APP")"
          ln -s /Applications "$STAGE/Applications"
          DMG=dist-desktop/dot-agent-deck-desktop-alpha-macos-arm64.dmg
          # `hdiutil create` intermittently fails on hosted runners with
          # "Resource busy"; retried rather than failing a release on it.
          ok=0
          for attempt in 1 2 3; do
            if hdiutil create -volname "Agent Deck" -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              ok=1
              break
            fi
            echo "hdiutil create failed (attempt ${attempt}); retrying"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::hdiutil could not create the disk image after three attempts."
            exit 1
          fi
          ls -la dist-desktop
      - name: Sign, notarize and staple the disk image
        if: steps.creds.outputs.mode == 'signed'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -eu
          DMG=dist-desktop/dot-agent-deck-desktop-alpha-macos-arm64.dmg
          umask 077
          # Rewritten rather than reused from the previous step, so that step's
          # cleanup (or its absence) cannot decide whether this one works.
          printf '%s\n' "$APPLE_API_KEY_PATH" > "$RUNNER_TEMP/AuthKey.p8"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          codesign --verify --strict --verbose=4 "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 75m --output-format json > "$RUNNER_TEMP/notary-dmg.json" || true
          cat "$RUNNER_TEMP/notary-dmg.json"
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary-dmg.json" 2>/dev/null || echo unknown)
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary-dmg.json" 2>/dev/null || true)
            echo "::error::notarization of the disk image returned status '${status}', not Accepted."
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # THE name `desktop-publish` and `attest` select with their
          # `desktop-bundle-*` pattern, so the `.dmg` they publish and attest is
          # this file, byte for byte. The macOS bundle leg no longer uploads
          # under it (it uploads `desktop-app-macos-arm64`), so the name is free.
          #
          # `overwrite: true` so that re-running this job after a later step
          # failed replaces the `.dmg` instead of dying here on the one its own
          # earlier attempt uploaded. That is the only artifact the overwrite
          # can replace: no other upload in this workflow produces this name --
          # `desktop-bundle`'s `desktop-bundle-*` upload runs on its Linux leg
          # only, as `desktop-bundle-linux-amd64`.
          name: desktop-bundle-macos-arm64
          path: dist-desktop/
          if-no-files-found: error
          overwrite: true
      - name: Record whether the disk image is signed
        id: result
        env:
          MODE: ${{ steps.creds.outputs.mode }}
        run: |
          set -eu
          case "$MODE" in
            signed) echo "signed=true" >> "$GITHUB_OUTPUT" ;;
            unsigned) echo "signed=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unexpected credential mode '${MODE}'."
              exit 1
              ;;
          esac
      - name: Delete the throwaway keychain and key files
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/desktop-signing.p12" "$RUNNER_TEMP/developer-id.pem" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  # Attaches the desktop assets to the release that `finalize` already created.
  # Separated from `desktop-bundle` so the upload happens once, after the
  # release object exists, rather than racing per matrix leg.
  desktop-publish:
    # `desktop-sign` because the macOS `.dmg` is now its output, not the bundle
    # matrix's; `desktop-bundle` still, because the Linux `.deb` comes from
    # there directly.
    needs: [prepare, finalize, desktop-bundle, desktop-sign]
    # `needs` on a MATRIX job resolves to the AGGREGATE result of every leg, so
    # `needs: desktop-bundle` alone would skip this job the moment ONE platform
    # failed — discarding the other platform's perfectly good bundle, which is
    # precisely the outcome `fail-fast: false` above exists to prevent. That
    # flag stops the sibling leg being *cancelled*; it cannot make the
    # aggregate succeed. (Greptile P1 on #768.)
    #
    # So gate on what actually matters instead: the release object must exist
    # (`finalize` succeeded) and we must not have been cancelled. Whether there
    # is anything worth publishing is then a question for the steps below,
    # which can see the artifacts and say which platforms are missing. The same
    # holds for `desktop-sign`: when it fails there is no `.dmg`, and the `.deb`
    # is still published.
    if: ${{ !cancelled() && needs.finalize.result == 'success' && !inputs.skip_desktop }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # Tolerated deliberately: with a partial matrix now a legitimate state,
        # this step's own failure mode (no artifact matches the pattern at all)
        # is one the guard below reports far better than "Unable to find any
        # artifacts for the associated workflow" does.
        continue-on-error: true
        with:
          pattern: desktop-bundle-*
          path: dist-desktop
          merge-multiple: true
      - name: Check what there is to publish
        run: |
          set -eu
          if [ ! -d dist-desktop ] || [ -z "$(ls -A dist-desktop 2>/dev/null)" ]; then
            echo "::error::every desktop-bundle leg failed, so there is nothing to publish. The CLI release itself is unaffected and complete."
            exit 1
          fi
          # A partial publish is allowed, but it must never be silent: a
          # release carrying only one platform should say so in the log rather
          # than look like a full one.
          for expected in macos-arm64 linux-amd64; do
            present=0
            for f in dist-desktop/*"-${expected}".*; do
              if [ -e "$f" ]; then present=1; fi
            done
            if [ "$present" -eq 0 ]; then
              echo "::warning::no bundle for ${expected}; that platform's bundle leg failed (or, for macos-arm64, desktop-sign did). Publishing the platforms that did build."
            fi
          done
          ls -la dist-desktop
      - name: Generate desktop checksums
        # Unsigned artifacts make integrity verification more valuable, not
        # less. Kept in their own file so `checksums.txt` stays exactly what it
        # is today for CLI users.
        run: |
          set -eu
          cd dist-desktop
          shasum -a 256 dot-agent-deck-desktop-alpha-* > checksums-desktop-alpha.txt
          cat checksums-desktop-alpha.txt
      - name: Upload the desktop assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        # `--repo` is load-bearing on every `gh` call in this job, and its
        # absence is why every release that has reached this job published no
        # desktop artifact at all (#852). Unlike every other job in this file,
        # `desktop-publish` has no `actions/checkout` -- it downloads artifacts
        # and calls the API, and needs no source tree -- so there is no git
        # repository for `gh` to infer the target from and it dies with
        # `failed to run git: fatal: not a git repository`. Naming the
        # repository is cheaper than cloning a tree the job never reads.
        #
        # All THREE calls in this job needed it: the two in the step below were
        # latent only because the default `bash -e` aborts the job here first,
        # so fixing this one alone would have relocated the failure rather than
        # removed it. `release.yml` never runs on a pull request, so nothing in
        # CI can catch a regression of this -- the static guard that can is
        # `gh_calls_in_checkoutless_jobs_name_their_repository` in
        # xtask/linkage-check/src/release_workflow_wiring.rs.
        run: gh release upload "v$RELEASE_VERSION" dist-desktop/* --clobber --repo "$REPO"
      # Issue #1152, and the mirror of the upload in `finalize`: the desktop
      # manifest is written in THIS job, so `attest` cannot see it either. The
      # bundles reach that job as `desktop-bundle-*` artifacts (the `.deb` from
      # `desktop-bundle`, the `.dmg` from `desktop-sign`), but the manifest
      # does not exist when those are uploaded -- it is generated here, from
      # them -- so it needs a carrier of its own.
      #
      # Uploaded after the release upload above rather than after the generate
      # step, so what travels is the file the release actually carries. Named
      # outside `desktop-bundle-*`, the pattern the download at the top of this
      # job selects on, so a re-run cannot feed a previous attempt's manifest
      # back into `gh release upload dist-desktop/*`. `overwrite: true` for the
      # reason the sibling upload in `finalize` gives at length: stable name
      # because `attest` has to ask for it by name, replaceable because a second
      # attempt at this job must not die on its own first attempt's artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-checksums-desktop
          path: dist-desktop/checksums-desktop-alpha.txt
          if-no-files-found: error
          overwrite: true
      - name: Note the unsigned alpha, or the signed macOS build, in the release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # `true` or `false` once `desktop-sign` has uploaded a `.dmg`, empty
          # otherwise. PRD #757 Decision 10: the note says what was actually
          # signed rather than a fixed string.
          SIGNED: ${{ needs.desktop-sign.outputs.signed }}
        # Appended here rather than assembled in `prepare` so the note appears
        # only when the assets it describes actually exist -- a release whose
        # bundler failed must not advertise downloads it does not have. Each
        # platform's paragraph is written only when that platform's asset is
        # in `dist-desktop/`, which is exactly what the upload step published.
        #
        # REPLACED on every run, never skipped. The note sits between a START
        # and an END marker line, and each run rewrites that block from what
        # this run published. This step used to exit early when the START
        # marker was already present, which left the note describing the FIRST
        # attempt forever: a re-run that swapped an unsigned `.dmg` for a
        # signed one kept telling users to strip the quarantine flag from a
        # signed build (PRD #757 Decision 10's sharpest failure), and a first
        # attempt whose `desktop-sign` failed left a note with no macOS
        # paragraph that no re-run could add.
        #
        # What sits OUTSIDE the block, and is kept byte for byte apart from
        # surrounding blank lines: everything before the START line -- the
        # changelog body `finalize` published, already clamped by `prepare` to
        # leave RESERVE for this note -- and everything after the END line,
        # which no job in this workflow writes, so it can only be a human edit.
        # The block is found by the LAST line that is exactly the START marker,
        # so a changelog entry quoting the marker inline is not mistaken for
        # it. A START with no END after it is a note written before the END
        # marker existed, which always ran to the end of the body; everything
        # from it onward is dropped and rewritten, including any text a human
        # added after such a note.
        run: |
          set -eu
          MARKER="<!-- desktop-alpha -->"
          END_MARKER="<!-- /desktop-alpha -->"
          PREFIX="$RUNNER_TEMP/release-body-before-note.md"
          SUFFIX="$RUNNER_TEMP/release-body-after-note.md"
          # `--repo`, for the reason given on the step above: no checkout in
          # this job means no git context for `gh` to fall back on.
          gh release view "v$RELEASE_VERSION" --repo "$REPO" --json body -q .body > "$RUNNER_TEMP/release-body-current.md"
          python3 - "$RUNNER_TEMP/release-body-current.md" "$MARKER" "$END_MARKER" "$PREFIX" "$SUFFIX" <<'SPLICE'
          import re, sys
          body_path, start, end, prefix_path, suffix_path = sys.argv[1:]
          body = open(body_path, encoding="utf-8").read()
          line = lambda m: re.compile(r"^[ \t]*" + re.escape(m) + r"[ \t\r]*$", re.M)
          starts = list(line(start).finditer(body))
          if not starts:
              before, after = body, ""
          else:
              at = starts[-1]
              before = body[:at.start()]
              close = line(end).search(body, at.end())
              after = body[close.end():] if close else ""
          # Whole blank lines only -- the separators this step writes around
          # the block -- and never whitespace inside a line. `str.strip()` here
          # used to eat the leading indent of a suffix that opens with an
          # indented code block, and every re-run reformatted it again. The
          # prefix is trimmed at its end only: its start is the start of the
          # release body, not a separator.
          blank = lambda l: l.strip(" \t\r") == ""
          def trim(text, leading):
              lines = text.split("\n")
              lo, hi = 0, len(lines)
              while hi > lo and blank(lines[hi - 1]):
                  hi -= 1
              while leading and lo < hi and blank(lines[lo]):
                  lo += 1
              return "\n".join(lines[lo:hi])
          before, after = trim(before, False), trim(after, True)
          open(prefix_path, "w", encoding="utf-8").write(before)
          open(suffix_path, "w", encoding="utf-8").write(after)
          print(f"release body: {len(body)} chars; kept {len(before)} before the note and {len(after)} after it")
          SPLICE
          MAC_DMG=dist-desktop/dot-agent-deck-desktop-alpha-macos-arm64.dmg
          LINUX_DEB=dist-desktop/dot-agent-deck-desktop-alpha-linux-amd64.deb
          # Anything other than an explicit `true` beside a published `.dmg`
          # is described as unsigned. That is the safe direction to be wrong
          # in: calling a signed build unsigned costs a user a needless step,
          # while calling an unsigned build signed would tell them a Gatekeeper
          # warning is a sign of tampering. No `.dmg`, no macOS paragraph.
          if [ ! -f "$MAC_DMG" ]; then
            SIGNED=absent
          elif [ "$SIGNED" != "true" ]; then
            SIGNED=false
          fi
          NOTE="$RUNNER_TEMP/desktop-note.md"
          {
            if [ -s "$PREFIX" ]; then
              cat "$PREFIX"
              printf "\n\n"
            fi
            printf "%s\n" "$MARKER"
            if [ "$SIGNED" = "true" ]; then
              printf "### Desktop GUI (alpha)\n\n"
            else
              printf "### Desktop GUI (alpha, unsigned)\n\n"
            fi
            printf "The \`dot-agent-deck-desktop-alpha-*\` assets are an early preview of the desktop GUI, and they are not covered by the support expectations of the CLI. Each platform's paragraph below says whether its asset is signed.\n\n"
            printf "**Verify what you downloaded, before you do anything else with it.** No OS checks build provenance on your behalf, so this is the step that tells you where the file actually came from -- for an unsigned asset it is the only one, and it is the prerequisite for the platform steps below rather than an alternative to them. Every asset this release uploads carries [build provenance](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations) -- the CLI binaries, the desktop packages, and both \`checksums.txt\` and \`checksums-desktop-alpha.txt\`. That is a stronger claim than a checksum: it says this exact file was produced by this repository's release workflow, from a named commit, rather than merely that it matches a number printed on the same page that served it. The manifests are covered for the same reason you would read one at all -- a list of hashes you check everything else against is the file worth swapping. GitHub's own **Source code** archives are the one exception: GitHub synthesizes those from the tag rather than this workflow uploading them.\n\n"
            printf "\`\`\`sh\ngh attestation verify <the-file-you-downloaded> --repo vfarcic/dot-agent-deck --signer-workflow vfarcic/dot-agent-deck/.github/workflows/release.yml\n\`\`\`\n\n"
            printf "If that does not report a verified attestation from this repository's release workflow, stop there: do not install the file, and do not override any warning your OS raises about it.\n\n"
          } > "$NOTE"
          if [ "$SIGNED" = "true" ]; then
            printf "**macOS** (\`.dmg\`) -- signed with this project's Apple Developer ID and notarized by Apple, with the notarization ticket stapled to both the app and the disk image. Open the disk image, drag Agent Deck to /Applications and launch it: macOS should ask only to confirm opening an app downloaded from the internet. If it instead reports the app as damaged or from an unidentified developer, do not override that -- report it at https://github.com/vfarcic/dot-agent-deck/issues.\n\n" >> "$NOTE"
          fi
          if [ "$SIGNED" = "false" ]; then
            {
              printf "**macOS** (\`.dmg\`) -- this build is **unsigned**, so macOS quarantines the app and refuses the first launch. **Once the verification above has passed**, move the app to /Applications, then use either route to tell macOS you accept it:\n\n"
              printf -- "- Open **System Settings > Privacy & Security**, find the message naming Agent Deck, and choose **Open Anyway**. Control-clicking the app to bypass this no longer works on macOS Sequoia and later, which is why this route is listed first.\n"
              printf -- "- Or clear the quarantine flag from a terminal:\n\n"
              printf "  \`\`\`sh\n  xattr -dr com.apple.quarantine \"/Applications/Agent Deck.app\"\n  \`\`\`\n\n"
              printf "The release workflow signs and notarizes the macOS build once the project's Apple signing credentials are configured, and this release was built without them -- see https://github.com/vfarcic/dot-agent-deck/issues/757.\n\n"
            } >> "$NOTE"
          fi
          if [ -f "$LINUX_DEB" ]; then
            printf "**Linux** (\`.deb\`) -- unsigned. Nothing blocks this install and nothing warns you: \`dpkg -i\` does not verify package signatures, so the checks above are the only ones anybody makes.\n" >> "$NOTE"
          fi
          printf "\n%s\n" "$END_MARKER" >> "$NOTE"
          if [ -s "$SUFFIX" ]; then
            {
              printf "\n"
              cat "$SUFFIX"
              printf "\n"
            } >> "$NOTE"
          fi
          gh release edit "v$RELEASE_VERSION" --repo "$REPO" --notes-file "$NOTE"

  # PRD #757: verifiable build provenance for the assets this workflow uploads.
  #
  # That heading described an intention rather than the job until issue #1152.
  # The subject collection matched only `dot-agent-deck-*` and
  # `dot-agent-deck-desktop-alpha-*`, so of the eight assets a full release
  # publishes, the two checksum manifests carried nothing -- and a manifest is
  # the file a user leans on to validate every other asset. It now covers all
  # eight. It does NOT cover GitHub's auto-generated "Source code" archives:
  # those are synthesized by GitHub from the tag rather than uploaded here, so
  # no job ever holds their bytes.
  #
  # This is the free half of artifact trust, and it is the ONLY half that
  # reaches Linux. OS-level signing does nothing for the `.deb`: dpkg ships
  # with `no-debsig`, so `dpkg -i` verifies no package signature and issues no
  # warning, which means a signed .deb is a signature nothing looks at. What
  # every platform can use is provenance -- proof that a given file was built
  # by this workflow, from this commit, in this repository.
  #
  # NO SIGNING SECRET IS INVOLVED, and that is the point rather than a
  # convenience. `actions/attest-build-provenance` obtains a short-lived
  # Sigstore certificate through the job's OIDC token (`id-token: write`), so
  # there is no private key in this repository, nothing to rotate, and nothing
  # a leak could expose. It is free on public repositories on every current
  # GitHub plan. Contrast Decision 5 of PRD #757, which is what holding an
  # Apple Developer ID key here would have cost.
  #
  # What this does NOT do, stated so nobody reads it as more than it is: it
  # does not remove the macOS Gatekeeper dialog, which needs Apple's own chain,
  # and it does not remove Windows SmartScreen. Verification is opt-in -- a
  # user runs `gh attestation verify`; no OS checks this on their behalf.
  #
  # Off the critical path by the same reasoning as `desktop-bundle`: `finalize`
  # does not list this job in `needs:`, so an attestation-service blip turns
  # the run red and leaves the release complete.
  attest:
    needs: [prepare, finalize, desktop-publish]
    # Gated on the RELEASE existing rather than on `desktop-publish` having
    # succeeded -- `needs` resolves to the aggregate, so requiring the desktop
    # leg would throw away the CLI attestations whenever a bundler failed.
    # Same trap Greptile's P1 on #768 found in `desktop-publish`; same fix.
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level set, which is what is
    # wanted here: this job gets the two scopes attestation needs and drops the
    # `contents: write` / `packages: write` it has no use for.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dot-agent-deck-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # Tolerated for the same reason `desktop-publish` tolerates it: a
        # partial or wholly failed desktop matrix is a legitimate state, and the
        # CLI assets must still be attested when it happens.
        continue-on-error: true
        with:
          pattern: desktop-bundle-*
          path: dist-desktop
          merge-multiple: true
      # Issue #1152: the two checksum manifests, each carried here by the job
      # that published it rather than regenerated (see the upload steps for
      # why). Downloaded into the same two directories as the assets they
      # describe, which is also why neither `find` below changes: the manifests
      # match neither `dot-agent-deck-*` nor `dot-agent-deck-desktop-alpha-*`.
      #
      # NOT tolerated, unlike the download above: `attest` runs only when
      # `finalize` succeeded, and `finalize` cannot succeed without publishing
      # `checksums.txt`. A missing artifact here means the wiring broke, and
      # the release must say so rather than quietly attest one asset fewer.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-checksums
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # Tolerated for exactly the reason the bundle download above is: this
        # artifact exists only when `desktop-publish` ran, and a wholly failed
        # desktop matrix is a legitimate state in which the CLI assets must
        # still be attested.
        continue-on-error: true
        with:
          name: release-checksums-desktop
          path: dist-desktop
      - name: Collect the subjects to attest
        id: subjects
        env:
          # Bound through `env:` like every other context value this workflow
          # feeds a `run:` script. It is the discriminator the missing-manifest
          # branch below needs: `skipped` or `failure` means nothing desktop was
          # published and no claim was made about it, `success` means both.
          DESKTOP_PUBLISH_RESULT: ${{ needs.desktop-publish.result }}
        # Built as an explicit list rather than handed to the action as a glob,
        # because a glob that matches nothing is an error there -- and
        # `dist-desktop/` legitimately holds nothing when both bundler legs
        # failed. Expanding here lets that case attest the CLI assets and move
        # on. Every subject is either `dot-agent-deck-*` or one of the two
        # `checksums*.txt` manifests, and none carries a space; for the bundles
        # that is guaranteed by the rename step in `desktop-bundle` (the `.deb`,
        # whose Tauri output name "Agent Deck_<version>_amd64.deb" has one) and
        # by `desktop-sign` writing the `.dmg` under its final name. That
        # matters because the action takes `subject-path` as a newline-separated
        # list, so a space is survivable but a newline in a name would not be.
        run: |
          set -eu
          cli=$(find dist -maxdepth 1 -type f -name 'dot-agent-deck-*' | sort)
          if [ -z "$cli" ]; then
            echo "::error::no CLI artifacts to attest, but finalize succeeded. Something changed the artifact names or the download pattern."
            exit 1
          fi
          # Issue #1152. Checked by exact name rather than swept up by widening
          # the `find` above, so that "the CLI binaries arrived" and "the CLI
          # manifest arrived" stay two answers: a manifest silently absent from
          # a broadened glob is the failure this is guarding against.
          if [ ! -f dist/checksums.txt ]; then
            echo "::error::dist/checksums.txt did not arrive. finalize publishes it and uploads it as the release-checksums artifact; this job attests that published file rather than recomputing the hashes here, so there is nothing safe to attest in its place."
            exit 1
          fi
          desktop=$(find dist-desktop -maxdepth 1 -type f -name 'dot-agent-deck-desktop-alpha-*' 2>/dev/null | sort || true)
          if [ -z "$desktop" ]; then
            echo "::warning::no desktop bundles to attest; that platform's leg failed. Attesting the CLI assets."
          fi
          # A MISSING DESKTOP MANIFEST IS FATAL EXACTLY WHEN `desktop-publish`
          # SUCCEEDED, and the asymmetry is the point (Greptile P1 on #1227).
          #
          # That job generates the manifest, publishes it with the bundles,
          # uploads it as an artifact, and only THEN appends the release note
          # that tells users every asset here carries provenance -- in that
          # order, under `bash -e`. So `result == success` means the claim is on
          # the release and the artifact was uploaded; the manifest failing to
          # arrive here is then a transient download failure that the
          # `continue-on-error` above swallowed, and attesting around it would
          # leave a published security claim false while the run stayed green.
          # Refuse instead: `attest` is off the critical path, so a red here
          # costs a loud run and not the release.
          #
          # Any other result -- `failure`, `skipped`, `cancelled` -- means the
          # note was never appended and nothing desktop reached the release, so
          # there is no false claim to protect and no manifest to expect. Warn
          # and attest what is here. Erroring in THAT case would throw away the
          # CLI binaries' attestations every time a bundler failed, which is the
          # #768 defect this job's `if:` gate already exists to avoid.
          desktop_manifest=""
          if [ -f dist-desktop/checksums-desktop-alpha.txt ]; then
            desktop_manifest=dist-desktop/checksums-desktop-alpha.txt
          elif [ "$DESKTOP_PUBLISH_RESULT" = "success" ]; then
            echo "::error::desktop-publish succeeded, so checksums-desktop-alpha.txt is on the release and the release body now says it carries provenance -- but the release-checksums-desktop artifact did not arrive here. Attesting without it would publish a claim this run did not make good. Refusing; re-run this job."
            exit 1
          elif [ -n "$desktop" ]; then
            echo "::warning::desktop bundles are here but desktop-publish did not succeed (result: ${DESKTOP_PUBLISH_RESULT}), so no desktop asset reached the release and there is no manifest to attest. Attesting the bundles that were built."
          fi
          # Accumulated into ONE list that is both emitted and logged, rather
          # than the two parallel sequences this used to carry. With four
          # optional-ish members instead of two, a line added to the emitted
          # list and forgotten in the log would leave the run reporting a set of
          # subjects that is not the set attested -- and the log is the only
          # record anybody reads afterwards. It also drops the `A && B || C`
          # pattern shellcheck flags as not-an-if-then-else (SC2015).
          subjects=$(printf '%s\ndist/checksums.txt' "$cli")
          if [ -n "$desktop" ]; then
            subjects=$(printf '%s\n%s' "$subjects" "$desktop")
          fi
          if [ -n "$desktop_manifest" ]; then
            subjects=$(printf '%s\n%s' "$subjects" "$desktop_manifest")
          fi
          {
            echo "paths<<SUBJECTS_EOF"
            echo "$subjects"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'attesting:\n%s\n' "$subjects"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  docs:
    needs: [prepare, finalize]
    uses: ./.github/workflows/docs-publish.yml
    # A reusable workflow invoked via `uses:` receives NO secrets unless the
    # caller forwards them, so without this line `secrets.RELEASE_TOKEN` is
    # empty inside docs-publish.yml and its push to `main` cannot bypass the
    # `main-protected` ruleset. That is exactly how v0.35.9's "Commit chart
    # changes" step failed, with `GH013: … Changes must be made through a pull
    # request` — and because the image had already reached GHCR by then, the
    # symptom was a docs site that never rolled forward rather than an
    # obviously broken release. (The callee now guards for an empty token in
    # its first step, so the same mistake fails before anything is published.)
    #
    # `inherit` is broader than this job needs: it forwards every repository
    # secret, including HOMEBREW_TAP_TOKEN and SCOOP_BUCKET_TOKEN, which are
    # cross-repo write credentials that docs-publish.yml never reads. Narrowing
    # it to an explicit `RELEASE_TOKEN` map is tracked in #514 — deliberately
    # not done inline, because the callee is also `workflow_dispatch`-able and
    # that path has to be canaried first (governance.md step 5). Keep the
    # forwarding until then; do not read this line as an endorsement of
    # `inherit` over a narrow map.
    secrets: inherit
    with:
      image_tag: v${{ needs.prepare.outputs.version }}
      chart_version: ${{ needs.prepare.outputs.version }}
      push_latest: true
