        name: Validate feedback memory
        run: "node <<'SCRIPT'\nconst fs = require(\"fs\");\nconst path = require(\"path\");\nconst memoryRoot = \"/tmp/gh-aw/repo-memory/default\";\nconst baselineRoot = path.join(process.env.RUNNER_TEMP, \"gh-aw\", \"issue-labeler-memory-baseline\");\nconst allowedFiles = new Set([\"feedback-issue.jsonl\", \"feedback-pull_request.jsonl\", \"predictions.jsonl\"]);\nconst allowedLabels = new Set([\"bug\", \"documentation\", \"enhancement\", \"feature\", \"question\", \"source\", \"config\", \"dependencies\", \"tests\", \"ci-cd\", \"devbox\", \"priority:high\", \"priority:medium\", \"priority:low\", \"size:high\", \"size:medium\", \"size:low\", \"needs-triage\"]);\nconst repositorySlug = process.env.GITHUB_REPOSITORY || \"\";\nconst repositoryPattern = repositorySlug.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\");\nif (!repositorySlug) throw new Error(\"GITHUB_REPOSITORY is unavailable\");\nconst issueUrl = new RegExp(`^https://github\\\\.com/${repositoryPattern}/issues/[1-9][0-9]*$`);\nconst pullUrl = new RegExp(`^https://github\\\\.com/${repositoryPattern}/pull/[1-9][0-9]*$`);\n\nfunction validateLabels(labels, max, file, line) {\n  if (!Array.isArray(labels) || labels.length > max || labels.some(label => typeof label !== \"string\" || !allowedLabels.has(label))) {\n    throw new Error(`${file}:${line}: invalid labels`);\n  }\n  if (new Set(labels).size !== labels.length || JSON.stringify(labels) !== JSON.stringify([...labels].sort())) {\n    throw new Error(`${file}:${line}: labels must be unique and sorted`);\n  }\n}\n\nfunction readJsonl(root, file, maxLines, validate) {\n  const filePath = path.join(root, file);\n  if (!fs.existsSync(filePath)) return [];\n  const lines = fs.readFileSync(filePath, \"utf8\").split(\"\\n\").filter(line => line.trim());\n  if (lines.length > maxLines) throw new Error(`${file}: too many entries`);\n  return lines.map((line, index) => {\n    let entry;\n    try { entry = JSON.parse(line); } catch { throw new Error(`${file}:${index + 1}: invalid JSON`); }\n    validate(entry, index + 1);\n    return entry;\n  });\n}\n\nfor (const entry of fs.readdirSync(memoryRoot, { withFileTypes: true })) {\n  if (entry.name === \".git\" && entry.isDirectory()) continue;\n  if (!entry.isFile() || !allowedFiles.has(entry.name)) throw new Error(`unexpected memory entry: ${entry.name}`);\n}\n\nfunction feedbackValidator(file, urlPattern) {\n  return (entry, line) => {\n    if (!entry || typeof entry !== \"object\" || Array.isArray(entry) || Object.keys(entry).sort().join(\",\") !== \"content,labels,url\" || !urlPattern.test(entry.url) || typeof entry.content !== \"string\" || entry.content.length > 2000) {\n      throw new Error(`${file}:${line}: invalid feedback entry`);\n    }\n    validateLabels(entry.labels, allowedLabels.size, file, line);\n  };\n}\n\nfunction predictionValidator(entry, line) {\n  const validTarget = entry && ((entry.type === \"issue\" && issueUrl.test(entry.url)) || (entry.type === \"pull_request\" && pullUrl.test(entry.url)));\n  if (!validTarget || Object.keys(entry).sort().join(\",\") !== \"labels,type,url\") throw new Error(`predictions.jsonl:${line}: invalid prediction entry`);\n  validateLabels(entry.labels, 5, \"predictions.jsonl\", line);\n}\n\nconst validators = {\n  \"feedback-issue.jsonl\": feedbackValidator(\"feedback-issue.jsonl\", issueUrl),\n  \"feedback-pull_request.jsonl\": feedbackValidator(\"feedback-pull_request.jsonl\", pullUrl),\n  \"predictions.jsonl\": predictionValidator,\n};\nconst limits = { \"feedback-issue.jsonl\": 400, \"feedback-pull_request.jsonl\": 400, \"predictions.jsonl\": 2000 };\nconst actual = {};\nconst expected = {};\nfor (const file of allowedFiles) {\n  actual[file] = readJsonl(memoryRoot, file, limits[file], validators[file]);\n  expected[file] = readJsonl(baselineRoot, file, limits[file], validators[file]);\n}\n\nconst agentOutput = JSON.parse(fs.readFileSync(\"/tmp/gh-aw/agent_output.json\", \"utf8\"));\nconst outputItems = Array.isArray(agentOutput.items) ? agentOutput.items : [];\nconst terminal = outputItems.filter(item => item && (item.type === \"add_labels\" || item.type === \"noop\"));\nif (terminal.length !== 1) throw new Error(\"exactly one add_labels or noop output is required\");\n\nconst event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, \"utf8\"));\nconst eventItem = event.pull_request || event.issue;\nif (event.label) {\n  if (terminal[0].type !== \"noop\") throw new Error(\"feedback mode must finish with noop\");\n  if (!eventItem || !eventItem.html_url) throw new Error(\"feedback event has no item\");\n  const url = eventItem.html_url;\n  const classified = expected[\"predictions.jsonl\"].some(entry => entry.url === url);\n  const changedLabel = event.label.name;\n  if (classified && allowedLabels.has(changedLabel)) {\n    const type = event.pull_request ? \"pull_request\" : \"issue\";\n    const file = `feedback-${type}.jsonl`;\n    const labels = [...new Set((eventItem.labels || []).map(label => typeof label === \"string\" ? label : label.name).filter(label => allowedLabels.has(label)))].sort();\n    const record = { url, content: `${eventItem.title || \"\"}\\n${eventItem.body || \"\"}`.slice(0, 2000), labels };\n    const index = expected[file].findIndex(entry => entry.url === url);\n    if (index >= 0) expected[file][index] = record;\n    else expected[file].push(record);\n    expected[file] = expected[file].slice(-400);\n  }\n} else {\n  const type = event.pull_request ? \"pull_request\" : event.issue ? \"issue\" : process.env.ITEM_TYPE;\n  const number = eventItem && eventItem.number ? eventItem.number : Number(process.env.ITEM_NUMBER);\n  if (!([\"issue\", \"pull_request\"].includes(type)) || !Number.isInteger(number) || number < 1) throw new Error(\"labeling target is invalid\");\n  const url = eventItem && eventItem.html_url ? eventItem.html_url : `https://github.com/${repositorySlug}/${type === \"issue\" ? \"issues\" : \"pull\"}/${number}`;\n  const labels = terminal[0].type === \"add_labels\"\n    ? terminal[0].labels.map(label => typeof label === \"string\" ? label : label.name).sort()\n    : [];\n  validateLabels(labels, 5, \"agent_output.json\", 1);\n  expected[\"predictions.jsonl\"].push({ url, type, labels });\n  expected[\"predictions.jsonl\"] = expected[\"predictions.jsonl\"].slice(-2000);\n}\n\nfunction canonical(value) {\n  if (Array.isArray(value)) return value.map(canonical);\n  if (value && typeof value === \"object\") return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])]));\n  return value;\n}\nfor (const file of allowedFiles) {\n  if (JSON.stringify(canonical(actual[file])) !== JSON.stringify(canonical(expected[file]))) {\n    throw new Error(`${file}: changes do not match the triggering event and classifier output`);\n  }\n}\nSCRIPT"

      - name: Upload agent artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}agent
          path: |
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/mcp-config/logs/
            /tmp/gh-aw/redacted-urls.log
            /tmp/gh-aw/mcp-logs/
            /tmp/gh-aw/agent_usage.json
            /tmp/gh-aw/agent-stdio.log
            /tmp/gh-aw/pre-agent-audit.txt
            /tmp/gh-aw/agent/
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/safeoutputs.jsonl
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/aw-*.patch
            /tmp/gh-aw/aw-*.bundle
            /tmp/gh-aw/awf-config.json
            /tmp/gh-aw/sandbox/firewall/logs/
            /tmp/gh-aw/sandbox/firewall/audit/
            /tmp/gh-aw/sandbox/firewall/awf-reflect.json
          if-no-files-found: ignore

  conclusion:
    needs:
      - activation
      - agent
      - detection
      - push_repo_memory
      - safe_outputs
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true' ||
      needs.activation.outputs.secret_verification_result == 'failed' || needs.activation.outputs.daily_ai_credits_exceeded == 'true')
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    concurrency:
      group: "gh-aw-conclusion-issue-labeler-${{ inputs.item_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      noop_message: ${{ steps.noop.outputs.noop_message }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@afc709f45ed6a3f756eb4551856c6a9c42e15b2c # v0.88.0
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Adaptive issue labeler"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/issue-labeler.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.147.0"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_BODY_MODIFIED: "false"
          GH_AW_INFO_ENGINE_ID: "codex"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}agent
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}safe-outputs-items
          path: /tmp/gh-aw/
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Upload usage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}usage
          path: |
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
      - name: Restore daily AIC usage cache
        id: restore-daily-aic-cache-conclusion
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: agentic-workflow-usage-issuelabeler-${{ github.run_id }}
          restore-keys: agentic-workflow-usage-issuelabeler-
          path: /tmp/gh-aw/agentic-workflow-usage-cache.jsonl
      - name: Write daily AIC usage cache entry
        id: write-daily-aic-cache
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/write_daily_aic_usage_cache.cjs');
            await main();
      - name: Save daily AIC usage cache
        id: save-daily-aic-cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: agentic-workflow-usage-issuelabeler-${{ github.run_id }}
          path: /tmp/gh-aw/agentic-workflow-usage-cache.jsonl
      - name: Upload daily AIC usage cache artifact
        id: upload-daily-aic-cache
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aic-usage-cache
          path: /tmp/gh-aw/agentic-workflow-usage-cache.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Process no-op messages
        id: noop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_NOOP_MAX: "1"
          GH_AW_WORKFLOW_NAME: "Adaptive issue labeler"
          GH_AW_WORKFLOW_SOURCE: "dosu-ai/auto-label/workflows/auto-label.md@83084acbe5cdf17fa2be717ea054f1681635f7a4"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/dosu-ai/auto-label/blob/83084acbe5cdf17fa2be717ea054f1681635f7a4/workflows/auto-label.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_NOOP_REPORT_AS_ISSUE: "false"
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
          GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
          GH_AW_WORKFLOW_ID: "issue-labeler"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/handle_noop_message.cjs');
            await main();
      - name: Log detection run
        id: detection_runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Adaptive issue labeler"
          GH_AW_WORKFLOW_SOURCE: "dosu-ai/auto-label/workflows/auto-label.md@83084acbe5cdf17fa2be717ea054f1681635f7a4"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/dosu-ai/auto-label/blob/83084acbe5cdf17fa2be717ea054f1681635f7a4/workflows/auto-label.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/handle_detection_runs.cjs');
            await main();
      - name: Handle agent failure
        id: handle_agent_failure
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Adaptive issue labeler"
          GH_AW_WORKFLOW_SOURCE: "dosu-ai/auto-label/workflows/auto-label.md@83084acbe5cdf17fa2be717ea054f1681635f7a4"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/dosu-ai/auto-label/blob/83084acbe5cdf17fa2be717ea054f1681635f7a4/workflows/auto-label.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_WORKFLOW_ID: "issue-labeler"
          GH_AW_ACTION_FAILURE_ISSUE_EXPIRES_HOURS: "168"
          GH_AW_ENGINE_ID: "codex"
          GH_AW_SECRET_VERIFICATION_RESULT: ${{ needs.activation.outputs.secret_verification_result }}
          GH_AW_CHECKOUT_PR_SUCCESS: ${{ needs.agent.outputs.checkout_pr_success }}
          GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens || '' }}
          GH_AW_AI_CREDITS_RATE_LIMIT_ERROR: ${{ needs.agent.outputs.ai_credits_rate_limit_error || 'false' }}
          GH_AW_UNKNOWN_MODEL_AI_CREDITS: ${{ needs.agent.outputs.unknown_model_ai_credits || 'false' }}
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
          GH_AW_MAX_AI_CREDITS: "10"
          GH_AW_INFERENCE_ACCESS_ERROR: ${{ needs.agent.outputs.inference_access_error }}
          GH_AW_MCP_POLICY_ERROR: ${{ needs.agent.outputs.mcp_policy_error }}
          GH_AW_AGENTIC_ENGINE_TIMEOUT: ${{ needs.agent.outputs.agentic_engine_timeout }}
          GH_AW_MODEL_NOT_SUPPORTED_ERROR: ${{ needs.agent.outputs.model_not_supported_error }}
          GH_AW_HTTP_400_RESPONSE_ERROR: ${{ needs.agent.outputs.http_400_response_error }}
          GH_AW_MAX_CACHE_MISSES_EXCEEDED: ${{ needs.agent.outputs.max_cache_misses_exceeded }}
          GH_AW_MISSING_MODEL_PRICING_ERROR: ${{ needs.agent.outputs.missing_model_pricing_error }}
          GH_AW_MISSING_MODEL_PRICING_MODEL_NAME: ${{ needs.agent.outputs.missing_model_pricing_model_name }}
          GH_AW_ENGINE_API_HOSTS: "api.openai.com"
          GH_AW_LOCKDOWN_CHECK_FAILED: ${{ needs.activation.outputs.lockdown_check_failed }}
          GH_AW_OAUTH_TOKEN_CHECK_FAILED: ${{ needs.activation.outputs.oauth_token_check_failed }}
          GH_AW_STALE_LOCK_FILE_FAILED: ${{ needs.activation.outputs.stale_lock_file_failed }}
          GH_AW_DAILY_AI_CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded }}
          GH_AW_DAILY_AI_CREDITS_TOTAL_EFFECTIVE_TOKENS: ${{ needs.activation.outputs.daily_ai_credits_total_effective_tokens }}
          GH_AW_DAILY_AI_CREDITS_THRESHOLD: ${{ needs.activation.outputs.daily_ai_credits_threshold }}
          GH_AW_PUSH_REPO_MEMORY_RESULT: ${{ needs.push_repo_memory.result }}
          GH_AW_REPO_MEMORY_VALIDATION_FAILED_default: ${{ needs.push_repo_memory.outputs.validation_failed_default }}
          GH_AW_REPO_MEMORY_VALIDATION_ERROR_default: ${{ needs.push_repo_memory.outputs.validation_error_default }}
          GH_AW_REPO_MEMORY_PATCH_SIZE_EXCEEDED_default: ${{ needs.push_repo_memory.outputs.patch_size_exceeded_default }}
          GH_AW_GROUP_REPORTS: "false"
          GH_AW_FAILURE_REPORT_AS_ISSUE: "false"
          GH_AW_MISSING_TOOL_REPORT_AS_FAILURE: "true"
          GH_AW_MISSING_DATA_REPORT_AS_FAILURE: "true"
          GH_AW_TIMEOUT_MINUTES: "15"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/handle_agent_failure.cjs');
            await main();

  detection:
    needs:
      - activation
      - agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      aic: ${{ steps.parse_detection_token_usage.outputs.aic }}
      detection_conclusion: ${{ steps.detection_conclusion.outputs.conclusion }}
      detection_reason: ${{ steps.detection_conclusion.outputs.reason }}
      detection_success: ${{ steps.detection_conclusion.outputs.success }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@afc709f45ed6a3f756eb4551856c6a9c42e15b2c # v0.88.0
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Adaptive issue labeler"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/issue-labeler.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.147.0"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_BODY_MODIFIED: "false"
          GH_AW_INFO_ENGINE_ID: "codex"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.agent.outputs.artifact_prefix }}agent
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
      - name: Checkout repository for patch context
        if: needs.agent.outputs.has_patch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- Threat Detection ---
      - name: Clean stale firewall files from agent artifact
        run: |
          rm -rf /tmp/gh-aw/sandbox/firewall/logs
          rm -rf /tmp/gh-aw/sandbox/firewall/audit
      - name: Check if detection needed
        id: detection_guard
        if: always()
        env:
          OUTPUT_TYPES: ${{ needs.agent.outputs.output_types }}
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
        run: |
          if [[ -n "$OUTPUT_TYPES" || "$HAS_PATCH" == "true" ]]; then
            echo "run_detection=true" >> "$GITHUB_OUTPUT"
            echo "Detection will run: output_types=$OUTPUT_TYPES, has_patch=$HAS_PATCH"
          else
            echo "run_detection=false" >> "$GITHUB_OUTPUT"
            echo "Detection skipped: no agent outputs or patches to analyze"
          fi
      - name: Clear MCP Config for detection
