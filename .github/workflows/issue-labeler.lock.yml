name: "Adaptive issue labeler"
on:
  issues:
    types:
    - opened
    - labeled
    - unlabeled
  pull_request:
    types:
    - opened
    - ready_for_review
    - labeled
    - unlabeled
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      item_number:
        description: Issue or pull request number
        required: true
        type: number
      item_type:
        description: Issue or pull_request
        required: true
        type: string
    secrets:
      CODEX_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: true

permissions: {}

concurrency:
  cancel-in-progress: false
  group: issue-labeler-memory-${{ github.repository }}
  queue: max

run-name: "Adaptive issue labeler"

jobs:
  activation:
    if: >
      ((github.event_name == 'workflow_call' || (vars.ISSUE_LABELER_ENABLED == 'true' && ((github.event.action != 'labeled' &&
      github.event.action != 'unlabeled') || github.event.sender.type != 'Bot'))) && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.id == github.repository_id)) && ((github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_review') || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: "100"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      artifact_prefix: ${{ steps.artifact-prefix.outputs.prefix }}
      body: ${{ steps.sanitized.outputs.body }}
      comment_id: ""
      comment_repo: ""
      daily_ai_credits_exceeded: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total_effective_tokens: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_total_effective_tokens || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
