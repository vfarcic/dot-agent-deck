name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Also verify main AFTER a merge. Without this, CI only ever saw proposed
  # changes, so a broken main stayed invisible until some later PR inherited the
  # break and failed for reasons that had nothing to do with it. That is exactly
  # what happened on 2026-07-29: #269 merged with all three build jobs red, and
  # main was unbuildable for about a day while every subsequent PR failed at the
  # first cargo step.
  #
  # This matters more, not less, with Renovate automerging non-major bumps: those
  # land without a human looking, so the post-merge check is what turns "main is
  # broken" from a discovery into a notification.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      # `cargo nextest run`, NOT `cargo test` — the same runner as the
      # `cargo test-fast` local gate, and as build-macos/build-windows which
      # already use it. `cargo test` runs the whole tier in ONE process with
      # parallel threads; nextest gives each test its own process.
      #
      # That difference produced real flakes. On 2026-07-30, two different
      # timing-sensitive tests failed here and nowhere else:
      # `delegate_injects_single_line_pointer_and_keeps_footer_in_task_file`
      # (waiting on a PTY write; task file came back empty) and
      # `login_shell::tests::captures_path_despite_large_stdout_banner`
      # (subprocess plus a large stdout drain). Both passed on re-run with no
      # code change, both passed on macOS and Windows in the SAME runs, and
      # `cargo nextest run` passed 1343/1343 locally throughout — the three jobs
      # were a natural experiment and only the `cargo test` one flaked.
      #
      # Aligning the runners also makes a CI failure reproducible locally, which
      # neither of those was, and makes "green locally" mean the same thing as
      # "green in CI".
      - run: cargo nextest run
      # CLAUDE.md rule 7 has always SAID this runs in CI ("CI's linkage-check
      # rule 7 fails the build if the Scenario comment is missing or the
      # generator fails"), and the build-macos/build-windows comment says these
      # steps "stay on the Linux job" — but no such step existed, so nothing
      # enforced either claim. Added 2026-07-30 after a revert removed two
      # `#[spec]`-annotated tests and left their tests/CATALOG.md entries
      # orphaned: linkage-check was failing on main and no gate noticed, because
      # it only ever ran when somebody invoked it by hand.
      - run: cargo xtask linkage-check

  # PRD #42 M8 — native Windows (x86_64-pc-windows-msvc) compile + clippy +
  # unit-test gate, running parallel to the Linux `build` job so a Windows-only
  # break is visible independently. Uses rustup via dtolnay/rust-toolchain (the
  # devbox/nix toolchain used locally is Linux-only) and the runner's native
  # MSVC toolchain — no cross-compile lib.exe→ar shim (that was a Linux-only
  # cross-check artifact; windows-latest archives natively).
  #
  # SCOPE: foundation gate only. The Unix-domain-socket daemon/attach/hook
  # integration suites and the L2 PTY e2e suite are gated to Unix at the source
  # level (#![cfg(unix)]), so they compile to empty crates here. Porting that
  # harness to Windows named pipes + ConPTY and running full integration/e2e on
  # a Windows VM is tracked by #164 (M10). aarch64-pc-windows-msvc is #164 (M9),
  # not M8.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo build
      # Match the Linux `build` job's clippy invocation (no --all-targets) so a
      # test-only lint can't fail Windows-only and be unreproducible on the
      # Linux pre-push gate (PRD #42 review S1).
      - run: cargo clippy -- -D warnings
      # test-fast tier only (CLAUDE.md #5): protocol/state + L1 render tests.
      # No `e2e` feature (needs real agents + LLM APIs) and no linkage-check /
      # `cargo xtask docs` steps — those stay on the Linux job.
      - run: cargo nextest run

  # macOS (host = aarch64-apple-darwin) compile + clippy + unit-test gate,
  # mirroring build-windows. macOS is otherwise built ONLY in the release
  # workflow (release.yml builds both apple targets), so a macOS-only break —
  # e.g. the libc *mut/*const `openpty` and `ioctl` request-type differences in
  # src/wrap.rs — stayed invisible on PRs and first surfaced at release time
  # (broke the v0.34.0 build). This job closes that gap. The runner is Apple
  # Silicon, so this covers aarch64-apple-darwin exactly; x86_64-apple-darwin
  # shares the same libc apple bindings, so a host build catches the same class.
  #
  # Unlike build-windows (where the unix daemon/attach/e2e suites are gated to
  # Unix at the source level and compile to empty crates), macOS *is* unix, so
  # `cargo nextest run` runs the same test-fast tier as the Linux `build` job.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo build
      # Match the Linux `build` job's clippy invocation (no --all-targets) so a
      # test-only lint can't fail macOS-only and be unreproducible on the Linux
      # pre-push gate.
      - run: cargo clippy -- -D warnings
      - run: cargo nextest run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
