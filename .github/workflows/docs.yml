name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `docs-build`, not `build`, so the check-run name is unique across
  # workflows. `ci.yml` also has a `build` job, and branch protection matches
  # required status checks by bare context NAME with no workflow qualifier — two
  # jobs sharing one name makes "require `build`" ambiguous on any PR that
  # touches docs/** or site/**, since both report under it. Renamed so that
  # `build` unambiguously means ci.yml's fmt/clippy/test/linkage gate and can be
  # required. (`release.yml` also has a `build`, but it only ever triggers on
  # tags, so it never collides on a PR.)
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: site/Dockerfile
          load: true
          tags: ghcr.io/vfarcic/dot-agent-deck-docs:test

      # Netlify preview at pr-<N>--agent-deck-devopstoolkit-ai.netlify.app.
      # Secrets are not passed to pull requests from forks, so those (and the
      # manual `workflow_dispatch` run, which has no PR number) get no preview.
      # netlify-cli is pinned in devbox.json.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          enable-cache: true

      # `--cwd site` and the space-free arguments are load-bearing for the same
      # reasons given on the production deploy in docs-publish.yml: without the
      # former site/netlify.toml's headers are silently dropped.
      - name: Deploy preview to Netlify
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          URL=$(devbox run -- netlify deploy --cwd site --no-build --dir=build \
            --alias "pr-${PR_NUMBER}" --message "pr-${PR_NUMBER}" --json | jq -r '.deploy_url')
          echo "Preview: ${URL}"
          echo "### Netlify preview: ${URL}" >> "$GITHUB_STEP_SUMMARY"
