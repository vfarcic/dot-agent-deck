name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `docs-build`, not `build`, so the check-run name is unique across
  # workflows. `ci.yml` also has a `build` job, and branch protection matches
  # required status checks by bare context NAME with no workflow qualifier — two
  # jobs sharing one name makes "require `build`" ambiguous on any PR that
  # touches docs/** or site/**, since both report under it. Renamed so that
  # `build` unambiguously means ci.yml's fmt/clippy/test/linkage gate and can be
  # required. (`release.yml` also has a `build`, but it only ever triggers on
  # tags, so it never collides on a PR.)
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: site/Dockerfile
          load: true
          tags: ghcr.io/vfarcic/dot-agent-deck-docs:test
