name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'xtask/site/**'
      - 'src/published_docs.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `docs-build`, not `build`, so the check-run name is unique across
  # workflows. `ci.yml` also has a `build` job, and branch protection matches
  # required status checks by bare context NAME with no workflow qualifier — two
  # jobs sharing one name makes "require `build`" ambiguous on any PR that
  # touches docs/** or site/**, since both report under it. Renamed so that
  # `build` unambiguously means ci.yml's fmt/clippy/test/linkage gate and can be
  # required. (`release.yml` also has a `build`, but it only ever triggers on
  # tags, so it never collides on a PR.)
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Generates the published Markdown, llms.txt/llms-full.txt, images, the
      # landing page and both targets' redirects from docs/published.toml, and
      # fails on a broken link (PRD #1419). The same layout feeds the image
      # below and the Netlify preview.
      - name: Build site
        run: cargo xtask site site/build/public --nginx-redirects site/build/nginx-redirects.conf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: site/Dockerfile
          load: true
          tags: ghcr.io/vfarcic/dot-agent-deck-docs:test

      # The Netlify preview is DEPLOYED by docs-preview.yml, not here. This job
      # runs the PR's own code -- its workflow, its devbox.json init hook, the
      # crates `cargo xtask site` compiles -- so it gets no secret, and hands over only the
      # built static files. docs-preview.yml runs from `main` on
      # `workflow_run`, holds the Netlify token, and executes nothing from the
      # PR. Forks get no preview (and upload nothing).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: docs-site
          path: site/build
          if-no-files-found: error
          retention-days: 1
