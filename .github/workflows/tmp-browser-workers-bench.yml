# TEMPORARY (issue #2079): measures `desktop-browser` at 1-4 Playwright
# workers on ubuntu-latest. Deleted before the PR is opened.
name: tmp-browser-workers-bench
on:
  push:
    branches: [agent/dispatch-issue-2079]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3, 4]
        attempt: [a, b]
    name: workers-${{ matrix.workers }}-${{ matrix.attempt }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 25
      - run: nproc && free -g
      - name: suite
        timeout-minutes: 20
        env:
          CI: "true"
        run: |
          start=$(date +%s)
          pnpm test:browser --workers=${{ matrix.workers }}
          echo "SUITE_SECONDS=$(( $(date +%s) - start ))"
