# =============================================================================
# PRD #376 — Semaphore CI spike. MIRRORS .github/workflows/ci.yml. Replaces
# nothing.
# =============================================================================
#
# READ THIS FIRST IF YOU ARE COMPARING THE TWO FILES.
#
# `.github/workflows/ci.yml` is the merge gate. It is NOT modified by this PRD
# and must not be: Renovate automerges cargo/devbox bumps against it being
# green, and — for as long as PRD #376's measurement is open — it is the
# experimental control this pipeline is measured against. Wiring `ci.yml` to
# route through `task ci-*` would look like finishing the job and would destroy
# the comparison. Don't.
#
# This pipeline is a SPIKE. It is not a required status check anywhere, nothing
# depends on it being green, and it has no promotions, no deployment targets and
# no publishing of any kind — mirroring `ci.yml`, which has no side effects
# either. Since it cannot publish, there is no double-publish problem to guard
# against, and so there are deliberately no publish flags or kill switches (PRD
# #376 Work Log decision 3: separate destinations, never flags).
#
# WHAT IT MIRRORS
#
#   this block      | ci.yml job     | machine                    | steps
#   ----------------|----------------|----------------------------|--------------------------------------------------
#   build           | build          | e1-standard-4 / ubuntu2404 | fmt, clippy, build --release, nextest, linkage-check
#   build-macos     | build-macos    | a2-standard-4 / macOS      | build (debug), clippy, nextest
#   security        | security       | e1-standard-4 / ubuntu2404 | cargo audit
#
# WHAT IT DELIBERATELY DOES NOT MIRROR
#
#   * `build-windows` — OUT OF SCOPE, permanently for this PRD. nix has no
#     native Windows support and Semaphore Cloud has no hosted Windows runner
#     (only self-hosted agents). Windows keeps rustup plus marketplace actions
#     on GHA; two toolchain-provisioning paths is the accepted end state, not a
#     gap somebody should close here.
#   * `windows-cross-check` — same reason: it exists to keep a Linux-hosted
#     Windows type-check honest, and it is a GHA-side gate.
#   * `changes` — the Renovate-devbox-only skip gate. It is GitHub-API-shaped
#     (it reads the PR's file list) and it is a conditional; the PRD asks for
#     none. The cost of not having it is that a devbox-only bump runs the full
#     set here.
#   * `devbox` (the smoke job) — structurally subsumed. Every job below resolves
#     devbox.lock and runs the pinned tools, which is the one thing that job
#     exists to prove.
#   * `ci.yml`'s `concurrency: cancel-in-progress`. Semaphore expresses that
#     with `auto_cancel`, whose `when` expressions are exactly the kind of
#     construct nobody can validate without a live runner. Left out; the cost
#     is redundant runs on rapid pushes, and it is one line to add later.
#
# TOOLCHAIN PROVISIONING
#
# There is no `jetify-com/devbox-install-action` here — that is a GitHub
# marketplace action and does not exist on Semaphore. `.semaphore/ci.sh`
# hand-rolls the equivalent (install a PINNED, digest-verified nix installer,
# install a PINNED, digest-verified devbox, realise the devbox.json environment
# by substituting from cache.nixos.org) and every build step then runs through
# `devbox run -- task ci-*`. Read that script's header for the mechanism and for
# the list of steps whose behaviour is assumed rather than observed.
#
# THERE IS NO NIX-STORE CACHE, ON PURPOSE. The first version of this pipeline
# cached `/nix/store` through a privileged `sudo tar -C /` round trip, and an
# unverified archive extracted at `/` as root is reason enough on its own. (This
# comment used to add that it was also DEAD, because `cache store` strips a
# leading `/` — that mechanism has since been disproved against the cache CLI's
# source, which preserves absolute paths with tar's `-P`. See `.semaphore/ci.sh`;
# the safety argument does not depend on it, and `-P` in fact sharpens it.) It is
# gone rather than repaired. Every job now substitutes the closure from
# `cache.nixos.org`, which nix verifies by signature, and COLD BOOTSTRAP IS THE
# BASELINE M5 MEASURES. `.semaphore/ci.sh` carries the full argument, including
# the signed `nix copy` shape to use if store caching is ever added back.
#
# CACHE TRUST. Only a push to the default branch writes the cache; branch and
# pull-request runs restore read-only. Restores never land on the checkout. That
# check lives in a script the untrusted ref also controls, so it is defence in
# depth, NOT an authorization boundary — the real boundary is provider-side and
# is listed in `docs/develop/ci-entrypoints.md` as a required step before a
# Semaphore project is connected.
#
# VALIDATION STATUS — IT HAS RUN TWICE. macOS IS GREEN. LINUX HAS NEVER STARTED.
#
# A Semaphore Cloud project IS connected to `vfarcic/dot-agent-deck`, and this
# pipeline ran twice on 2026-08-04, with the identical pattern both times:
#
#   block        | machine       | result | evidence
#   -------------|---------------|--------|------------------------------------------
#   build        | f1-standard-4 | failed | `start_time: 0` — no agent, no commands
#   security     | f1-standard-4 | failed | `start_time: 0` — same
#   build-macos  | a2-standard-4 | PASSED | 5m45s, cold nix bootstrap, no cache
#
# THE LINUX FAILURES WERE MACHINE-TYPE AVAILABILITY, NOT THIS PIPELINE. The API
# error is explicit: "Selected machine type is not available in this
# organization." `f1-standard-4` is not on this org's plan, so no agent was ever
# assigned and not one command ran — which means nothing in `.semaphore/ci.sh` was
# implicated on Linux, and the `SEMAPHORE_GIT_DEPTH=0` fix recorded below, while a
# genuine latent bug, was NOT the cause of these two failures. Both Linux blocks
# now run on `e1-standard-4`; the `agent` comment below carries the choice and its
# caveats. THE LINUX BOOTSTRAP HAS STILL NEVER EXECUTED A SINGLE COMMAND — treat
# the next Linux run as debugging, not as a measurement.
#
# WHAT build-macos's GREEN RUN RETIRES, EMPIRICALLY. The job printed its own
# `diagnose-nix-env` output, so these are observations and not inferences: the
# APFS `/nix` volume gets created (`/dev/disk2s7 on /nix (apfs, local, nosuid,
# journaled, noatime, nobrowse)`); the PINNED v3.21.9 installer is what ran (the
# `profile.d` symlink resolves into `…-determinate-nix-3.21.9`); `nix-daemon.sh`
# is present at exactly the path the deliberately-unguarded `source` below uses;
# `devbox run` realises the closure on `aarch64-darwin`, whose lock entries no CI
# job had ever exercised; 8 GB suffices for the debug build plus clippy plus the
# full nextest tier; and the cache trust gate behaves correctly in production —
# the branch push reported `is_trusted_ref: no` and stored nothing, exactly as
# designed. One passing run is not a track record, but none of the above is
# speculation any more.
#
# Every key used here is from Semaphore's documented v1.0 schema, and the
# individually load-bearing assumptions — block-level `run`/`when`, the tag
# condition's semantics, `global_job_config.prologue` ordering, the `cache` CLI
# exit codes and path handling, `SEMAPHORE_GIT_REF_TYPE`/`_BRANCH` values, the
# machine types and `os_image` strings, `execution_time_limit`, `dependencies: []`
# — were each verified against docs or against the provider's own source on
# 2026-08-04. One lesson from the two failed Linux jobs: verifying a machine type
# against the DOCS is not enough, because the catalogue an org may actually use is
# a PLAN property. A documented, correctly-spelled machine type still fails with
# every job at `start_time: 0` and no logs at all.
# =============================================================================

version: v1.0
name: CI (devbox/nix spike — mirrors .github/workflows/ci.yml)

# Default agent — the two Linux blocks inherit it; build-macos overrides it.
#
# e1-standard-4 is 4 vCPU / 8 GB / 35 GB disk, and it is NOT the first choice —
# `f1-standard-4` was, and it is NOT AVAILABLE ON THIS ORGANIZATION'S PLAN. That
# is what killed the first two runs, with both Linux jobs at `start_time: 0` and
# the API reporting "Selected machine type is not available in this
# organization." The catalogue this org can actually provide is `a2-standard-4`,
# `e1-standard-1`, `e1-standard-4`, `e1-standard-8`, `e2-standard-2` and
# `f1-standard-2` — note `f1-standard-2` IS offered, so it is specifically the
# `-4` size of F1 that is gated, not the F1 generation.
#
# WHY e1-standard-4 OUT OF WHAT IS AVAILABLE, because the next reader will ask:
#
#   * vCPU PARITY WITH THE GHA CONTROL. `ubuntu-latest` is 4 vCPU / 16 GB.
#     `e1-standard-4` matches the vCPU count, and vCPU count dominates compile
#     wall clock — which is exactly what M5 measures.
#   * `e1-standard-8` (8 vCPU / 16 GB) would match the RAM but DOUBLE the CPU,
#     making Semaphore look artificially fast and the comparison invalid.
#   * `f1-standard-2` and `e2-standard-2` are 2 vCPU; they understate.
#   * The 8 GB-against-16 GB gap is no longer speculative. `a2-standard-4` is
#     also 4 vCPU / 8 GB and it PASSED the full compile + clippy + nextest tier
#     on this very branch, so 8 GB is proven adequate for this workload. Not a
#     perfect transfer, and the gap is stated rather than glossed: that job runs
#     `ci-build-debug` while this one runs `ci-build` (`--release`) plus
#     `linkage-check`. What keeps it a small gap is that `Cargo.toml` declares no
#     `[profile.release]` overrides, so the release build is stock — no fat LTO,
#     no `codegen-units = 1` — and therefore has no single memory-hungry link
#     step that a debug build would not also have.
#   * 35 GB of disk against a 4.4 GiB devbox closure plus `target/` is ample
#     (`f1-standard-4` would have had 65 GB).
#
# `os_image: ubuntu2404` does NOT move with the machine type: E1, E2 and F1 all
# offer `ubuntu2204` and `ubuntu2404`, so the image string is unchanged.
#
# THE LEGACY CAVEAT — A LIMITATION ON THE MEASUREMENT, NOT A TODO SOMEBODY CAN
# CLOSE HERE. Semaphore's docs say "The E1 and E2 generations are legacy machine
# types … F1 and R1 are the recommended machine types for Linux workloads." So
# M5's Linux numbers will come from a generation the provider is steering away
# from. The clean fix is a plan upgrade unlocking `f1-standard-4` — the exact
# `ubuntu-latest` analogue and the recommended generation — which is the
# repository owner's commercial decision, not this file's.
agent:
  machine:
    type: e1-standard-4
    os_image: ubuntu2404

# A cold nix bootstrap plus a release build plus the full nextest tier can
# plausibly exceed the default per-job limit, and a pipeline that dies at the
# limit produces a misleading measurement rather than a failure. Two hours is
# generous on purpose; M5's numbers, not this ceiling, are the thing to read.
execution_time_limit:
  hours: 2

global_job_config:
  env_vars:
    # THERE IS DELIBERATELY NO `SEMAPHORE_GIT_DEPTH` HERE. It used to be set to
    # "0", meaning "full clone". THAT WAS A BUG, and it is the one thing in this
    # file that has now been disproved rather than merely unverified:
    #
    #   * Semaphore documents the variable as "the shallow clone depth level for
    #     the checkout command. The default value is 50" — a DEPTH, with no
    #     documented sentinel for "unlimited".
    #   * The toolbox passes it straight through: `libcheckout` defaults it to 50
    #     only when UNSET (`[ -z … ]`), then runs
    #     `git clone --depth "${SEMAPHORE_GIT_DEPTH}" …`. A literal "0" reaches
    #     git untouched.
    #   * git rejects it: `git clone --depth 0` fails with
    #     `fatal: depth 0 is not a positive number` (measured, git 2.55.0).
    #
    # What that produced depends on the ref type, which is why it could look like
    # it worked. `SEMAPHORE_GIT_REF_TYPE` is always set on a real run, so
    # `checkout` takes the `refbased` path:
    #   * branch push — falls through to `checkout::shallow`, whose depth clone is
    #     guarded by `if !`, so the failure is swallowed and a FULL clone runs as
    #     the "branch not found" fallback. Survives, after burning the clone
    #     retries and printing a misleading reason.
    #   * pull-request run — the depth clone is NOT guarded, and the next line is
    #     `cd "${SEMAPHORE_GIT_DIR}" || exit`. The directory was never created, so
    #     checkout EXITS and every job dies in this prologue before any build step.
    #
    # The default (50) is now used, and that is strictly more history than the GHA
    # control has: `ci.yml` uses `actions/checkout@v7` with no `fetch-depth`,
    # i.e. a depth-1 clone. Nothing in CI needs more — `cargo xtask
    # linkage-check` does NOT shell out to git; its seven checks read
    # `tests/CATALOG.md`, the `tests/` tree and
    # `xtask/linkage-check/m2.allowlist` from the working tree, and rule 7 runs
    # the docs generator in-process. The three `Command::new("git")` sites in
    # `xtask/linkage-check/src/list_tests.rs` belong to a DIFFERENT subcommand,
    # `cargo xtask list-tests`, which diffs against `origin/main` and is invoked
    # by the release flow, never by CI.
    #
    # If a future CI step does need history, set a POSITIVE depth, or fetch
    # explicitly (`git fetch --no-tags --depth=N origin main`). Do not reach for
    # "0" again. Note also that no clone here guarantees the `origin/main`
    # remote-tracking ref — check `git rev-parse origin/main` rather than
    # assuming it.
    #
    # Parity with GHA, not a divergence from it: `Swatinem/rust-cache` disables
    # incremental compilation by default, so the `ci.yml` jobs already build
    # non-incrementally. Incremental artifacts are also the single largest
    # cacheable-but-worthless part of `target/` (1.4 GiB of a measured 8.5 GiB
    # local tree).
    - name: CARGO_INCREMENTAL
      value: "0"
  prologue:
    commands:
      - checkout
      # CARGO_HOME is moved INSIDE the checkout, and the value comes from the
      # script rather than being written twice. Semaphore's `cache store` strips
      # a leading `/` and `cache restore` extracts relative to the working
      # directory, so only a checkout-relative path round-trips; leaving the
      # cargo home at `$HOME/.cargo` is what made the previous cache design
      # unable to work. Two hardcoded copies of this path would drift into a
      # silently-cold cache, hence the one source of truth.
      - export CARGO_HOME="$(bash .semaphore/ci.sh cargo-home)"
      - bash .semaphore/ci.sh bootstrap
      # TEMPORARY SCAFFOLDING, AND THE SCRIPT SAYS SO TOO. This pipeline cannot
      # be observed from a development machine — no Semaphore access there, and
      # every attempt costs a real push — so this step prints what the installer
      # actually left on disk IMMEDIATELY BEFORE the unguarded `source` on the
      # next line. It is pure observation and returns 0 whatever it finds, so it
      # cannot fail a job. Full argument, and what it deliberately does NOT do,
      # is above `cmd_diagnose_nix_env` in ci.sh.
      #
      # IT HAS ALREADY EARNED ITS KEEP ON macOS — its output is the evidence for
      # every claim in the VALIDATION STATUS block at the top of this file (APFS
      # volume, pinned installer version, `nix-daemon.sh` present, trust gate
      # declining to store). KEEP IT ANYWAY: the Linux blocks have still never
      # executed a command, so on that platform it has not served its purpose
      # yet. Trim it once a LINUX run has been green too, not before.
      - bash .semaphore/ci.sh diagnose-nix-env
      # The bootstrap ran in its own shell, so the PATH and NIX_REMOTE it
      # exported died with it. Re-establish them in the shell the job's own
      # commands run in. `nix-daemon.sh` ships inside the `nix` package itself,
      # so it is present after any multi-user install on either platform, and
      # it is what points a non-root client at the daemon.
      #
      # DELIBERATELY UNGUARDED. If this path is wrong, every job dies here — and
      # that is the intended behaviour, because the alternative (skip the source
      # when the file is missing) only moves the failure to `devbox run` with nix
      # off PATH. The diagnostic step above exists so that this failure is
      # self-explaining rather than opaque.
      - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      # Where ci.sh puts the pinned devbox binary. A directory the agent user
      # owns, so nothing had to be `sudo`-placed in /usr/local/bin.
      - export PATH="$HOME/.local/bin:$PATH"

# Every block declares `dependencies: []` so all three start at once, the way
# GHA's independent jobs do. Without it Semaphore runs blocks sequentially,
# which would make the wall-clock comparison in M5 meaningless. (Semaphore
# requires that either every block declares dependencies or none does.)
#
# EVERY BLOCK IS ALSO TAG-GUARDED — `run: when: "tag !~ '.*'"`, i.e. run only
# when this workflow was not triggered by a tag push. Semaphore treats tag
# pushes as a trigger by default, and this pipeline on a release tag would start
# build/audit/cache work alongside `release.yml` and report a second status.
# That is the release-shaped behaviour the PRD rules out, so the guard is here.
#
# THE EXPRESSION IS NOW CONFIRMED, THE GUARD IS STILL ONLY HALF A FIX.
#
# `tag !~ '.*'` reads like it should never be true — `.*` matches the empty
# string in every PCRE engine — so it was worth checking rather than trusting.
# Semaphore's Conditions DSL special-cases an empty keyword value, and its
# implementation (`renderedtext/when`) asserts exactly this case in its own test
# suite, in a test named "empty string value of keyword parameter does not match
# '.*' regex":
#
#     params = %{"branch" => "master", "tag" => "", "pull_request" => "123"}
#     assert {:ok, false} = When.evaluate("tag =~ '.*'", params)
#     assert {:ok, true}  = When.evaluate("tag !~ '.*'", params)
#
# So on a branch push the guard is TRUE and the block runs; on a tag push `tag`
# is non-empty and it is FALSE and the block is skipped. `tag =~ '.*'` is also
# the idiom Semaphore's own docs use for "on any tag", and this is its negation.
#
# THE LIMIT THAT REMAINS: even working perfectly it only skips the WORK. A skipped
# block "immediately finish[es] with a `passed` result and a `skipped`
# result_reason", so Semaphore still creates a workflow for the tag push and still
# reports a status for it. The real fix is DISABLING TAG TRIGGERS IN THE PROJECT
# SETTINGS, which is a required step in the activation checklist in
# `docs/develop/ci-entrypoints.md`. This is defence in depth; that setting is the
# boundary.
blocks:
  # Mirrors ci.yml's `build` job (ci.yml:103-144), step for step and in the same
  # order, so a failure lands on the same step name a GHA failure would. One job
  # rather than five parallel ones on purpose: each job pays its own nix
  # bootstrap and its own cache restore, so splitting would multiply the
  # bootstrap cost by five and measure the wrong thing.
  #
  # SOLE WRITER of the two non-platform cargo cache keys (registry, git db) plus
  # its own platform `target/`. `has_key` is not atomic, so two blocks that both
  # miss and both store the same key duplicate GiB of work and confound M5;
  # ownership is therefore explicit rather than "whoever gets there first".
  - name: build
    run:
      when: "tag !~ '.*'"
    dependencies: []
    task:
      prologue:
        commands:
          - bash .semaphore/ci.sh restore-cargo-cache
      jobs:
        - name: fmt, clippy, build --release, nextest, linkage-check
          commands:
            # `task ci-*`, not raw cargo. That is the entire point of M1: the
            # invocation layer is provider-agnostic where being so costs
            # nothing, and a contributor runs these exact commands locally.
            - devbox run -- task ci-fmt
            - devbox run -- task ci-clippy
            - devbox run -- task ci-build
            - devbox run -- task ci-test
            - devbox run -- task ci-linkage-check
      epilogue:
        on_pass:
          commands:
            # `on_pass` only, matching rust-cache's default of not saving after
            # a failed job: a half-built `target/` is not worth propagating.
            # Writes nothing at all unless this is a push to the default branch.
            - bash .semaphore/ci.sh save-cargo-cache

  # Mirrors ci.yml's `build-macos` job (ci.yml:245-261): host build, clippy,
  # nextest on Apple Silicon.
  #
  # THIS IS THE ONE BLOCK THAT HAS ACTUALLY RUN, AND IT PASSED — on the first
  # attempt and again on the second, with no macOS-specific fix in between,
  # 5m45s with a fully cold nix bootstrap and no cache of any kind. DO NOT CHANGE
  # ITS MACHINE OR ITS os_image. Two of the three warnings that used to head this
  # block are retired by that run; the third still stands:
  #
  # 1. MEMORY — RESOLVED. a2-standard-4 is 4 vCPU / 8 GB against
  #    ubuntu-latest's 16 GB, and the worry was a compiler killed under memory
  #    pressure presenting as something other than an obvious OOM. It ran the
  #    debug build, clippy and the full nextest tier inside 8 GB. One passing run
  #    is not a track record, but it is no longer speculation — and it is the
  #    evidence that let the Linux blocks move to a 4 vCPU / 8 GB machine too.
  # 2. THE DARWIN TOOLCHAIN — NOW RUN, ONCE. M2 proved every pinned devbox.lock
  #    package is SUBSTITUTABLE for aarch64-darwin from cache.nixos.org
  #    (narinfo 200 on all of them, a full 30-path runtime-closure walk with no
  #    misses, at nixpkgs rev a5cbcfe954791221bfffe2307f7d1a1bf61a871e). It did
  #    not prove any of it RUNS correctly there — this run did. `devbox run`
  #    realised the closure on a real aarch64-darwin agent and every step passed,
  #    so ci.yml:294-295's note that the aarch64-darwin lock entries have never
  #    been exercised by any CI job is now true of GHA only.
  # 3. `path:gcloud#google-cloud-sdk` — the one devbox.json entry with no
  #    devbox.lock pin — HAS NOW BEEN CHECKED TOO, and it does not build the SDK
  #    from source. At the March-2024 nixpkgs revision `gcloud/flake.lock` pins,
  #    the aarch64-darwin plan is 91 substitutable paths (318.7 MiB download /
  #    1.8 GiB unpacked) plus 5 locally-built derivations, none of which invokes
  #    a compiler: three component-tarball unpacks and the `withExtraComponents`
  #    copy-and-sed composition. The base `google-cloud-sdk` itself substitutes
  #    (84.8 MiB xz / 466 MiB unpacked). The composition is built locally on
  #    x86_64-linux too, so this is symmetric, not a darwin gap. See the PRD's
  #    M2 note for the evidence.
  - name: build-macos
    run:
      when: "tag !~ '.*'"
    dependencies: []
    task:
      agent:
        machine:
          type: a2-standard-4
          # macos-xcode26 is the other documented image for this machine. The
          # build needs a working system cc for build scripts and linking and
          # nothing else from Xcode, so either should do.
          os_image: macos-xcode16
      prologue:
        commands:
          - bash .semaphore/ci.sh restore-cargo-cache
      jobs:
        - name: build, clippy, nextest (aarch64-apple-darwin)
          commands:
            # `ci-build-debug`, NOT `ci-build`: ci.yml's macOS job runs plain
            # `cargo build` (ci.yml:256) while the Linux job runs `cargo build
            # --release` (ci.yml:116). Using the release entrypoint here would
            # hand an 8 GB machine strictly more work than its GHA counterpart
            # does and quietly confound the very comparison this block exists
            # for.
            - devbox run -- task ci-build-debug
            - devbox run -- task ci-clippy
            - devbox run -- task ci-test
      epilogue:
        on_pass:
          commands:
            # `save-cargo-target-cache`, NOT `save-cargo-cache`: this block
            # RESTORES the registry and git-db keys but must never write them,
            # because it shares them with `build` and `has_key` is not atomic.
            # It owns only its own platform `target/` key.
            - bash .semaphore/ci.sh save-cargo-target-cache

  # Mirrors ci.yml's `security` job (ci.yml:264-273) — with one improvement that
  # is the cheapest win in the whole PRD: ci.yml:272 runs `cargo install
  # cargo-audit --locked`, compiling the tool from source on every single run.
  # Here it comes pinned from devbox.json (`cargo-audit@0.22.2`).
  #
  # No cargo cache in this block, and that is not an oversight: `cargo audit`
  # reads Cargo.lock and never compiles the workspace, so `target/` stays empty.
  # Sharing the target key with `build` would let whichever job finishes first
  # write an EMPTY archive under it and poison the cache for the job that
  # actually needs it. (What this job could usefully cache is the RustSec
  # advisory-db clone; ci.yml does not, so neither does this, for parity.)
  - name: security
    run:
      when: "tag !~ '.*'"
    dependencies: []
    task:
      jobs:
        - name: cargo audit
          commands:
            - devbox run -- task ci-audit
