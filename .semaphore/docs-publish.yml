# Semaphore port of .github/workflows/docs-publish.yml.
#
# THE IMAGE BUILDS. NOTHING IS PUSHED OR COMMITTED.
#
# The GHCR login, the `docker push`, the Chart.yaml/values.yaml bump and the
# commit to `main` are all present but COMMENTED OUT, so adopting Semaphore is
# an uncomment rather than a rewrite. `docker build` stays live, because that is
# the step that can actually fail on a docs change.
#
# CAVEAT: nothing validates the commented blocks — not `sem-ai yaml validate`,
# not any run. They will drift silently if the registry path or token names
# change. Review them before uncommenting rather than trusting them.
#
# NOT REACHABLE TODAY. Both promotions that would lead here are commented out
# (the auto one in release.yml, the manual one in semaphore.yml), because with
# the publishing disabled this file duplicates the `Docs site` block in
# semaphore.yml, which already builds the site and the image on every change to
# `docs/**` or `site/**`. It is kept as the structural counterpart of the GHA
# file so the mapping stays one-to-one.
#
# TWO ENTRY POINTS, mirroring the GHA file's two triggers:
#
#   * auto-promoted from release.yml  -> the `workflow_call` path. Publishes
#     `v<version>` plus `:latest` and bumps Chart.yaml.
#   * manually promoted from semaphore.yml -> the `workflow_dispatch` path,
#     i.e. the /publish-docs skill. Publishes `main-<sha>`, values.yaml only.
#
# GHA distinguishes them with `inputs.image_tag` being set or empty. Semaphore
# has no reusable-workflow inputs, so the discriminator is the tag on the
# commit: a promoted release pipeline carries SEMAPHORE_GIT_TAG_NAME, a manual
# promotion off a main build does not. Same two behaviors, same branch point.
#
# NOTE: this shape sidesteps the v0.35.9 failure mode by construction. There,
# the GHA `docs` job called this workflow via `uses:` WITHOUT `secrets: inherit`,
# so `secrets.RELEASE_TOKEN` was empty in the callee, checkout silently fell
# back to `github.token`, and the push to main died on GH013 — after the image
# had already been published. A Semaphore promotion binds its own secrets
# explicitly, so there is no inheritance to forget.
version: v1.0
name: Docs build (no publish)

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

# Uncomment together with the publishing steps below. This pipeline would push
# a commit to main, so two of them interleaving would race on the chart bump.
# GHA: `concurrency: {group: docs-publish, cancel-in-progress: false}`.
#
# queue:
#   name: docs-publish
#   scope: project
#   processing: serialized

global_job_config:
  # Uncomment together with the publishing steps below.
  #
  # secrets:
  #   - name: dot-agent-deck-release
  prologue:
    commands:
      - checkout

blocks:
  - name: Build
    dependencies: []
    task:
      jobs:
        - name: build docs image
          commands:
            # Resolve the tag list and chart version. `main-<sha>` for a manual
            # publish; `v<version>` plus `:latest` for a release. Kept live even
            # though nothing is pushed, because this discriminator is itself a
            # thing that can break.
            - |
              if [ -n "${SEMAPHORE_GIT_TAG_NAME:-}" ]; then
                IMAGE_TAG="$SEMAPHORE_GIT_TAG_NAME"
                CHART_VERSION="${SEMAPHORE_GIT_TAG_NAME#v}"
                PUSH_LATEST=true
                ORIGIN=workflow_call
              else
                IMAGE_TAG="main-$(git rev-parse --short=7 HEAD)"
                CHART_VERSION=""
                PUSH_LATEST=false
                ORIGIN=manual
              fi
              export IMAGE_TAG CHART_VERSION PUSH_LATEST ORIGIN
              echo "image_tag=$IMAGE_TAG chart_version=${CHART_VERSION:-<none>} push_latest=$PUSH_LATEST origin=$ORIGIN"

            - docker build -f site/Dockerfile -t "ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}" .
            - 'echo "OK: image built as ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}. Nothing was pushed."'

            # === PUSHES TO GHCR AND main — COMMENTED OUT =================
            # GHA equivalent of the login: docker/login-action against ghcr.io,
            # using the job's ambient GITHUB_TOKEN with `packages: write` from
            # the workflow `permissions:` block. Semaphore has no such ambient
            # identity, so the admin PAT authenticates here instead — a real
            # reduction in least-privilege, noted in docs/develop/semaphore-ci.md.
            #
