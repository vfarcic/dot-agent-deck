# An RWX sandbox for running this repository's heavy local operations — the
# commit gates, e2e runs, `cargo xver` — on a cloud Linux machine instead of
# the developer's box. `rwx sandbox exec -- <command>` syncs the worktree's
# local changes up, runs the command, and syncs changes back. Each worktree
# gets its own sandbox (keyed by branch and config path).
#
# The setup tasks mirror `.rwx/ci.yml`, so the sandbox has the same toolchain
# CI's RWX port used. No tool cache: a cached sandbox task would upload its
# whole filesystem (tens of GB with a `target/`) when it stops.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
        libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev \
        build-essential pkg-config jq bubblewrap
      sudo apt-get clean

  - key: code
    call: git/clone 2.2.0
    with:
      preserve-git-dir: true
      repository: https://github.com/vfarcic/dot-agent-deck.git
      ref: ${{ init.commit-sha }}

  # Issue #2052 — the version the sandbox's builds report, the way CI's builds
  # get one (issue #326; `.rwx/ci.yml`'s `backend` task and ci.yml's `changes`
  # job's `version` step): `code` is a shallow clone with no tags, so
  # `build.rs`'s `git describe` finds none and a build reports the `0.1.0`
  # placeholder as "version unknown" (`0.1.0+unknown`), and the lane-1 tests
  # written against a known version (`remote_upgrade_*`, `remote_connect_*`)
  # fail. The newest vX.Y.Z tag at origin, which
  # scripts/latest-release-version.sh reads as both CI systems do, is what a
  # developer's checkout of `main` reports. `cache: false`: the tags move without the commit moving,
  # so a cached value would go stale.
  - key: version
    use: code
    cache: false
    run: |
      set -euo pipefail
      dad_version=$(scripts/latest-release-version.sh origin)
      printf '%s' "$dad_version" > "$RWX_VALUES/dad_version"
      echo "dad_version=$dad_version"

  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.99.1

  - key: nextest
    use: rust
    env:
      CARGO_NEXTEST_RELEASE: cargo-nextest-0.9.149
    run: |
      # The release asset, checked against its published SHA-256, rather than
      # get.nexte.st piped straight into tar (issue #2300). The pin is the
      # GitHub release's TAG, and renovate.json's RWX nextest manager reads it
      # together with the checksum below, so a Renovate bump moves both (issue
      # #2566). A bump by hand needs the new checksum too: the `.sha256` beside
      # the tarball on the new release. The retry flags are the devbox
      # download's in `.rwx/ci.yml`, which says what each one does.
      mkdir -p "$HOME/.cargo/bin"
      curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 -o /tmp/cargo-nextest.tar.gz \
        "https://github.com/nextest-rs/nextest/releases/download/${CARGO_NEXTEST_RELEASE}/${CARGO_NEXTEST_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
      echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
      tar -xzf /tmp/cargo-nextest.tar.gz -C "$HOME/.cargo/bin" cargo-nextest
      cargo nextest --version

  # Some fast-tier tests run `node` (e.g. tests/pi_native_observer.rs); GitHub's
  # `test` job sets up Node 26 and the devbox shell ships it, the RWX base
  # image does not. Exact X.Y.Z is required by the package.
  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: "26.13.1"

  # pnpm, at devbox.json's pin, so desktop/'s commands (`pnpm install`,
  # `pnpm test`, `pnpm test:browser`, the desktop half of
  # `cargo docs-screenshots`) can leave the shared box like the cargo ones.
  # `.rwx/ci.yml`'s `pnpm` task, and scripts/check-pin-lockstep.sh holds this
  # copy to devbox.json too.
  - key: pnpm
    use: node
    run: |
      npm install -g pnpm@12.9.0
      pnpm --version

  # The @playwright/test pin from desktop/package.json, as a value, so that
  # `playwright-browsers` is keyed on the version alone. A task's cache key
  # covers its env but not the value's source file, so a dependency bump that
  # moves another line of package.json (3 of its 5 changes in the month to
  # 2026-11-26) reuses the cached browsers instead of reinstalling them. The
  # `sandbox` task uses `playwright-browsers`, so a reinstall delays every
  # sandbox, a Rust-only one included.
  - key: playwright-version
    use: [code, node]
    filter: [desktop/package.json]
    run: |
      version=$(node -p "require('./desktop/package.json').devDependencies['@playwright/test']")
      # A range would let `pnpm install` resolve a Playwright whose browsers
      # are not the ones installed below.
      [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "desktop/package.json must pin @playwright/test exactly, not '$version'" >&2; exit 1; }
      printf '%s' "$version" > "$RWX_VALUES/version"

  # Chromium and WebKit with the Ubuntu packages they need, for the Playwright
  # suite and the screenshot generator: `.rwx/ci.yml`'s `playwright-browsers`
  # task, keyed on the pin rather than on package.json (`playwright-version`).
  # A cache miss downloads about 195 MB of packages from the Ubuntu mirror (14
  # minutes on 2026-11-26).
  - key: playwright-browsers
    use: pnpm
    timeout: 45m
    env:
      PLAYWRIGHT_VERSION: ${{ tasks.playwright-version.values.version }}
    run: |
      npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium webkit
      sudo apt-get clean

  # cargo-mutants, for `/code-cleanup`'s tests mode
  # (`.claude/skills/code-cleanup/find-targets.sh tests`), so a mutation run,
  # one rebuild and test run per mutant, leaves the shared dev box too. The
  # version is find-targets.sh's pin, written again here in the layout the
  # Renovate customManager for that script reads, so one bump moves both;
  # find-targets.sh refuses any other version, and
  # code_cleanup_018_the_sandbox_installs_the_pinned_cargo_mutants fails a drift.
  - key: cargo-mutants
    use: rust
    run: |
      # renovate: datasource=crate depName=cargo-mutants
      CARGO_MUTANTS_VERSION=27.1.0
      cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION" --root "$HOME/.cargo"
      "$HOME/.cargo/bin/cargo-mutants" mutants --version

  # Issue #2051: the pinned real OpenCode 1.x and 2.x the lane-1
  # tests/e2e_opencode_real_binary.rs runs, as `.rwx/ci.yml`'s `opencode` task
  # installs them, so those tests run here rather than skip.
  - key: opencode
    use: [code, node]
    run: scripts/install-pinned-opencode.sh

  - key: go-task
    run: |
      curl -LsSf https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz \
        | sudo tar zxf - -C /usr/local/bin task
      task --version

  # Issue #2072: puts scripts/rwx-sandbox-bin, whose `cargo` hands the real one
  # a DAD_BUILD_ID composed from the checkout's git content, ahead of the real
  # cargo on PATH. Every exec's sync rewrites `.git/HEAD`, the branch ref, the
  # reflog and the index, so without it `build.rs`'s mtime watches on those
  # files rebuilt the root crate on every command (201 s for a no-change build
  # of the gates' target set, 1.2 s with it). The directory is the synced
  # checkout's, so an edit to the script takes effect on the next exec. RWX
  # joins PATH across `use` dependencies.
  - key: cargo-build-id
    run: printf '%s\n' "$RWX_WORKSPACE_DIR/scripts/rwx-sandbox-bin" > "$RWX_ENV/PATH"

  - key: sandbox
    use: [system-packages, code, rust, nextest, cargo-mutants, go-task, node, pnpm, playwright-browsers, opencode, cargo-build-id]
    runner:
      cpus: 16
      memory: 64gb
      disk: 150gb
    env:
      DAD_REQUIRE_GO_TASK: "1"
      # Issue #2052: see the `version` task.
      DAD_VERSION: ${{ tasks.version.values.dad_version }}
    # Billed per second while alive, idle included. Nothing stops it after a
    # command by default (`affected-checks --run` included, unless
    # DAD_REMOTE_EXEC_KEEP=0): one unit's agents share it, and a stop killed a
    # teammate's running command (2026-10-31). This timeout is what stops it. A running command counts
    # as activity (measured 2026-10-22: a 3-minute command survived a 1-minute
    # timeout), so this timeout does not cut a running command off. RWX does:
    # one exec is killed at 30 minutes, with the sandbox. Nothing documented
    # says what sets that; rwx-sandbox's --first-exec-timeout and
    # --inactivity-timeout both default to 30m, and setting either above 30m
    # was not measured (issue #2077, docs/develop/rwx.md "Stopping").
    run: rwx-sandbox --inactivity-timeout 5m
