# An RWX sandbox for running this repository's heavy local operations — the
# commit gates, e2e runs, `cargo xver` — on a cloud Linux machine instead of
# the developer's box. `rwx sandbox exec -- <command>` syncs the worktree's
# local changes up, runs the command, and syncs changes back. Each worktree
# gets its own sandbox (keyed by branch and config path).
#
# The setup tasks mirror `.rwx/ci.yml`, so the sandbox has the same toolchain
# CI's RWX port used. No tool cache: a cached sandbox task would upload its
# whole filesystem (tens of GB with a `target/`) when it stops.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
        libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev \
        build-essential pkg-config jq bubblewrap
      sudo apt-get clean

  - key: code
    call: git/clone 2.2.0
    with:
      preserve-git-dir: true
      repository: https://github.com/vfarcic/dot-agent-deck.git
      ref: ${{ init.commit-sha }}

  # Issue #2052 — the version the sandbox's builds report, the way CI's builds
  # get one (issue #326; `.rwx/ci.yml`'s `backend` task and ci.yml's `changes`
  # job's `version` step): `code` is a shallow clone with no tags, so
  # `build.rs`'s `git describe` finds none and a build reports the `0.1.0`
  # placeholder as "version unknown" (`0.1.0+unknown`), and the lane-1 tests
  # written against a known version (`remote_upgrade_*`, `remote_connect_*`)
  # fail. The newest vX.Y.Z tag at origin, which
  # scripts/latest-release-version.sh reads as both CI systems do, is what a
  # developer's checkout of `main` reports. `cache: false`: the tags move without the commit moving,
  # so a cached value would go stale.
  - key: version
    use: code
    cache: false
    run: |
      set -euo pipefail
      dad_version=$(scripts/latest-release-version.sh origin)
      printf '%s' "$dad_version" > "$RWX_VALUES/dad_version"
      echo "dad_version=$dad_version"

  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.99.0

  - key: nextest
    use: rust
    run: |
      mkdir -p "$HOME/.cargo/bin"
      curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "$HOME/.cargo/bin"
      cargo nextest --version

  # Some fast-tier tests run `node` (e.g. tests/pi_native_observer.rs); GitHub's
  # `test` job sets up Node 26 and the devbox shell ships it, the RWX base
  # image does not. Exact X.Y.Z is required by the package.
  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: "26.13.0"

  # cargo-mutants, for `/code-cleanup`'s tests mode
  # (`.claude/skills/code-cleanup/find-targets.sh tests`), so a mutation run,
  # one rebuild and test run per mutant, leaves the shared dev box too. The
  # version is find-targets.sh's pin, written again here in the layout the
  # Renovate customManager for that script reads, so one bump moves both;
  # find-targets.sh refuses any other version, and
  # code_cleanup_018_the_sandbox_installs_the_pinned_cargo_mutants fails a drift.
  - key: cargo-mutants
    use: rust
    run: |
      # renovate: datasource=crate depName=cargo-mutants
      CARGO_MUTANTS_VERSION=27.1.0
      cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION" --root "$HOME/.cargo"
      "$HOME/.cargo/bin/cargo-mutants" mutants --version

  - key: go-task
    run: |
      curl -LsSf https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz \
        | sudo tar zxf - -C /usr/local/bin task
      task --version

  - key: sandbox
    use: [system-packages, code, rust, nextest, cargo-mutants, go-task, node]
    runner:
      cpus: 16
      memory: 64gb
      disk: 150gb
    env:
      DAD_REQUIRE_GO_TASK: "1"
      # Issue #2052: see the `version` task.
      DAD_VERSION: ${{ tasks.version.values.dad_version }}
    # Billed per second while alive, idle included. Nothing stops it after a
    # command by default (`affected-checks --run` included, unless
    # DAD_REMOTE_EXEC_KEEP=0): one unit's agents share it, and a stop killed a
    # teammate's running command (2026-10-31). This timeout is what stops it. A running command counts
    # as activity (measured 2026-10-22: a 3-minute command survived a 1-minute
    # timeout), so a short timeout cannot cut a long test run off.
    run: rwx-sandbox --inactivity-timeout 5m
