# RWX port of the Linux `build` and `e2e-deterministic` jobs in
# .github/workflows/ci.yml: the same commands, split into a DAG so fmt, clippy,
# the release build, the fast tier and the e2e tier run in parallel. Which of
# the two runs a pull request is `.github/ci-backend`'s call
# (docs/develop/rwx.md); pushes to `main` always run on GitHub Actions.
#
# Every task runs on 4 CPU / 16 GB, the size of GitHub's `ubuntu-latest`.
# Raising `cpus:` on a task buys speed per task (measured 2026-10-18: compile
# tasks on 16 CPUs took the run from 6.3 to 5.0 minutes, at roughly twice the
# cost).
#
# The versions below are pinned in devbox.json and .github/workflows/ too.
# renovate.json's RWX customManagers bump them with the other copies, and
# scripts/check-pin-lockstep.sh (run by `cargo test-fast`) fails when the Rust
# toolchain, nextest, pnpm or go-task disagree with devbox.json.

# Two triggers:
# - a pull request: this run replaces the Linux jobs of
#   `.github/workflows/ci.yml` when `.github/ci-backend` says `rwx`; otherwise
#   the `backend` task below skips everything and the run passes in seconds, so
#   RWX's check can stay required whichever system is active. It tests the PR's
#   head commit (GitHub Actions tests the PR merged with its base).
# - `rwx run` from a worktree: local uncommitted changes on top of the pushed
#   HEAD.
# GitHub-triggered runs on a public repository can use the tool-cache vault only
# with its "Allow public repositories" switch on (vault -> Access Control).
on:
  github:
    pull_request:
      # `RWX: linux` on the pull request, the name the ruleset requires
      # (scripts/apply-branch-protection.sh).
      status-checks:
        name: linux
      init:
        commit-sha: ${{ event.git.sha }}
        trigger: pull_request
        base-sha: ${{ event.github.pull_request.pull_request.base.sha }}
        author: ${{ event.github.pull_request.pull_request.user.login }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      trigger: cli
      base-sha: ""
      author: ""

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

# Incremental `target/` and `~/.cargo` between runs — the counterpart of
# Swatinem/rust-cache in ci.yml. Without it every content-cache miss compiles
# from scratch. The vault holds no secrets; it must exist, be unlocked, and
# have "Allow public repositories" on (it was deleted after the 2026-10-18
# evaluation: `rwx vaults create --name dot_agent_deck_rwx_eval --unlocked`).
tool-cache:
  vault: dot_agent_deck_rwx_eval

defaults:
  runner:
    cpus: 4
    memory: 16gb

tasks:
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
        libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev \
        build-essential pkg-config jq
      sudo apt-get clean

  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/vfarcic/dot-agent-deck.git
      ref: ${{ init.commit-sha }}
      # Some fast-tier tests run `git rev-parse --show-toplevel`.
      preserve-git-dir: true

  # Full history, for the path classification below: the files a PR changes
  # are the ones since its merge-base with the base. Kept apart from `code`,
  # whose shallow clone every other task builds on.
  - key: history
    call: git/clone 2.2.0
    with:
      repository: https://github.com/vfarcic/dot-agent-deck.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true
      fetch-full-depth: true

  # Which tasks this run needs, one value per group, read by each task's `if:`.
  # Nothing runs unless the run is active: a pull request whose
  # `.github/ci-backend` does not say `rwx` is GitHub Actions' to run, so every
  # task is skipped and this run passes in seconds, which keeps RWX's check
  # requirable either way. The paths are classified by scripts/ci-changes.sh,
  # the script ci.yml's `changes` job runs, from the files the PR changes
  # against the merge-base with its base, which is the list GitHub's PR view
  # shows.
  - key: backend
    use: history
    env:
      TRIGGER: ${{ init.trigger }}
      BASE_SHA: ${{ init.base-sha }}
      AUTHOR: ${{ init.author }}
    run: |
      set -euo pipefail
      active=true
      if [ "$TRIGGER" = pull_request ] \
          && [ "$(tr -d '[:space:]' < .github/ci-backend 2>/dev/null)" != rwx ]; then
        active=false
      fi
      files=""
      if [ "$TRIGGER" = pull_request ] && [ -n "$BASE_SHA" ]; then
        # Fail safe: if the base cannot be fetched the list stays empty, which
        # the script reads as "unknown" and answers with everything.
        if git fetch -q origin "$BASE_SHA" && mb=$(git merge-base "$BASE_SHA" HEAD); then
          files=$(git diff --name-only "$mb" HEAD)
        fi
      fi
      printf '%s' "$files" | scripts/ci-changes.sh "$TRIGGER" "$AUTHOR" > changes.env
      cat changes.env
      . ./changes.env
      put() { printf '%s' "$2" > "$RWX_VALUES/$1"; echo "$1=$2"; }
      on() { [ "$active" = true ] && [ "$1" = true ] && echo true || echo false; }
      put active "$active"
      not_lock_only=$([ "$devbox_only" != true ] && [ "$flake_only" != true ] && echo true || echo false)
      put rust "$(on "$not_lock_only")"
      put nix "$(on "$([ "$devbox_only" != true ] && echo true || echo false)")"
      put aarch64 "$(on "$cargo")"

  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.99.0

  - key: nextest
    use: rust
    run: |
      mkdir -p "$HOME/.cargo/bin"
      curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "$HOME/.cargo/bin"
      cargo nextest --version

  # Some fast-tier tests run `node` (e.g. tests/pi_native_observer.rs); GitHub's
  # ubuntu-latest image and the devbox shell both ship Node 24, the RWX base
  # image does not. Exact X.Y.Z is required by the package.
  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: "24.22.0"

  - key: go-task
    run: |
      curl -LsSf https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz \
        | sudo tar zxf - -C /usr/local/bin task
      task --version

  - key: fmt
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [code, rust]
    run: cargo fmt --check

  - key: clippy
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rust]
    tool-cache: ci-clippy-v2
    env:
      CARGO_INCREMENTAL: "0"
    run: cargo clippy --workspace --all-targets --features e2e,e2e-live -- -D warnings

  - key: build-release
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rust]
    tool-cache: ci-build-release-v2
    run: cargo build --release

  - key: linkage-check
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: build-release
    run: cargo xtask linkage-check

  - key: test
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rust, nextest, go-task, node]
    tool-cache: ci-test-v2
    env:
      DAD_REQUIRE_GO_TASK: "1"
      # Line tables keep file:line in panics and backtraces but drop the rest
      # of the debug info, which is most of `target/`'s size and link time.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    run: |
      cargo test-fast
      # Keep only the dependencies in the tool cache, as Swatinem/rust-cache
      # does on GitHub: the workspace crates rebuild every run anyway (fresh
      # source mtimes), and keeping them grew the cache by tens of GB a run.
      cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
        | while read -r pkg; do cargo clean -q -p "$pkg"; done
    outputs:
      test-results:
        - path: target/nextest/default/junit.xml
          options:
            language: Rust
            framework: cargo-nextest

  # Compile the e2e tier once into a nextest archive. The partitions run the
  # archive, so they never build the tier: a cargo build there would rebuild
  # the workspace crates, whose sources get fresh mtimes in every task.
  - key: e2e-build
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rust, nextest, node]
    tool-cache: ci-e2e-build-v2
    # The e2e `target/` plus its archive needs well over the default 50 GB.
    runner:
      disk: 150gb
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    run: |
      cargo nextest archive --workspace --features e2e --archive-file e2e.tar.zst
      # Keep only the dependencies in the tool cache, as Swatinem/rust-cache
      # does on GitHub: the workspace crates rebuild every run anyway (fresh
      # source mtimes), and keeping them grew the cache by tens of GB a run.
      cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
        | while read -r pkg; do cargo clean -q -p "$pkg"; done

  # Five runners the size of a GitHub `ubuntu-latest` (4 vCPU / 16 GB), so the
  # timing-sensitive e2e tests see the per-runner load they see in ci.yml, and
  # the speed-up comes from partitioning rather than from bigger machines.
  - key: e2e
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: e2e-build
    parallel:
      values:
        - shard: "1"
        - shard: "2"
        - shard: "3"
        - shard: "4"
        - shard: version
    runner:
      disk: 150gb
    env:
      SHARD: ${{ parallel.shard }}
    run: |
      # `lifecycle/version/001` runs a nested cold `cargo build` (72-370s in CI)
      # and set the floor of whichever partition drew it, so it runs alone in
      # its own shard and the other four split the rest of the tier.
      if [ "$SHARD" = version ]; then
        set -- -E 'test(=version_001_injected_build_env_reaches_the_binary)'
      else
        set -- --partition "count:$SHARD/4" -E 'not test(=version_001_injected_build_env_reaches_the_binary)'
      fi
      # Extracted into the workspace, so `target/` lands where the tests'
      # compile-time paths (`env!("CARGO_BIN_EXE_dot-agent-deck")`) point.
      cargo nextest run --archive-file e2e.tar.zst --workspace-remap . \
        --extract-to . --extract-overwrite --retries 1 "$@"
    outputs:
      # Nothing uses a partition's filesystem; uploading it cost 5 minutes.
      filesystem: false
      test-results:
        - path: target/nextest/default/junit.xml
          options:
            language: Rust
            framework: cargo-nextest

  # The cross-compiling tasks need more targets than `rust` installs, and
  # `rust-lang/install` ships no `rustup` to add them, so these get a
  # rustup-managed copy of the same toolchain.
  - key: rustup
    run: |
      # `rust-src` up front: `cross` adds it otherwise, into the toolchain, and
      # a warm tool cache then restores that copy over this layer's and
      # rustup refuses the conflict (measured 2026-10-22).
      curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
        --default-toolchain 1.99.0 --component rust-src \
        --target x86_64-pc-windows-msvc --target aarch64-unknown-linux-gnu
      echo "$HOME/.cargo/bin" >> "$RWX_ENV/PATH"

  - key: pnpm
    use: node
    run: |
      npm install -g pnpm@12.9.0
      pnpm --version

  # desktop/: the web app's unit tests and build (ci.yml's `desktop-web`).
  - key: desktop-web
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [code, pnpm]
    run: |
      cd desktop
      pnpm install --frozen-lockfile
      pnpm test
      pnpm build
      ! grep -rl __dadDriver dist/

  # desktop/: the Playwright suite in Chromium and WebKit (`desktop-browser`).
  - key: desktop-browser
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [code, pnpm]
    timeout: 20m
    run: |
      cd desktop
      pnpm install --frozen-lockfile
      pnpm exec playwright install --with-deps chromium webkit
      pnpm test:browser:types
      pnpm test:browser

  # The desktop app driven through WebKitWebDriver under Xvfb
  # (`desktop-driver`).
  - key: desktop-driver
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rust, pnpm]
    tool-cache: ci-desktop-driver-v1
    timeout: 30m
    env:
      TAURI_DRIVER_VERSION: 2.0.6
      CARGO_INCREMENTAL: "0"
    run: |
      sudo apt-get update
      sudo apt-get install -y webkit2gtk-driver xvfb xclip xdotool
      cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      # `cargo install` puts it in Cargo's bin dir, which is not on PATH here.
      export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
      cargo build --locked --bin dot-agent-deck
      cd desktop
      pnpm install --frozen-lockfile
      pnpm test:driver:types
      VITE_DAD_DRIVER_SEAM=1 pnpm tauri build --debug --no-bundle
      DAD_DRIVER_NATIVE_DRIVER=/usr/bin/WebKitWebDriver \
        xvfb-run -a -s "-screen 0 1920x1080x24 -dpi 96" pnpm test:driver

  # Type-checks the workspace for Windows from Linux (`windows-cross-check`).
  - key: windows-cross-check
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [system-packages, code, rustup]
    tool-cache: ci-windows-cross-check-v1
    run: |
      set -euo pipefail
      WINDOWS_CROSS_CHECK_TOOLCHAIN="$(rustup show home)/toolchains/$(rustup show active-toolchain | cut -d' ' -f1)"
      export WINDOWS_CROSS_CHECK_TOOLCHAIN
      scripts/windows-cross-check.sh

  # `cargo audit` against the RustSec advisories (`security`).
  - key: security
    if: ${{ tasks.backend.values.rust == 'true' }}
    use: [code, rust]
    tool-cache: ci-security-v1
    run: |
      cargo install cargo-audit --locked
      cargo audit

  # Nix, single-user: a task has no init system for the daemon.
  - key: nix-install
    run: |
      sudo install -d -o "$(id -u)" -g "$(id -g)" /nix
      curl -fsSL https://releases.nixos.org/nix/nix-2.35.3/install | sh -s -- --no-daemon
      echo "$HOME/.nix-profile/bin" >> "$RWX_ENV/PATH"
    env:
      NIX_CONFIG: experimental-features = nix-command flakes

  # `nix flake check` (`nix`).
  - key: nix
    if: ${{ tasks.backend.values.nix == 'true' }}
    use: [code, nix-install]
    tool-cache: ci-nix-v1
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    run: nix flake check -L --all-systems

  # The toolchain pins agree, and the devbox shell works (`devbox`).
  - key: devbox
    if: ${{ tasks.backend.values.active == 'true' }}
    use: [code, nix-install]
    tool-cache: ci-devbox-v1
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      DEVBOX_USE_VERSION: 0.18.4
    run: |
      scripts/check-pin-lockstep.sh
      curl -fsSL https://get.jetify.com/devbox | bash -s -- -f
      devbox run -- bash scripts/devbox-smoke.sh

  # The aarch64 release build through `cross` (aarch64-crossbuild-check.yml),
  # when the manifests or a CI definition changed.
  - key: aarch64-crossbuild
    if: ${{ tasks.backend.values.aarch64 == 'true' }}
    use: [code, rustup]
    docker: true
    tool-cache: ci-aarch64-v2
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y file
      cargo install cross --locked --version 0.2.5
      export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
      cross build --release --target aarch64-unknown-linux-gnu
      bin=target/aarch64-unknown-linux-gnu/release/dot-agent-deck
      file "$bin" | grep -q 'ARM aarch64'
      echo "OK: aarch64 binary produced"
