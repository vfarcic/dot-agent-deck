# RWX port of the Linux `build` and `e2e-deterministic` jobs in
# .github/workflows/ci.yml — first measured on branch `rwx-eval` (kept as
# `rwx-eval-archive`), not a replacement. Same commands, split into a DAG so
# fmt, clippy, the release build, the fast tier and the e2e tier run in
# parallel.
#
# Every task runs on 4 CPU / 16 GB, the size of GitHub's `ubuntu-latest`, so a
# push compares the two on comparable hardware. Raising `cpus:` on a task buys
# speed per task (measured 2026-10-18: compile tasks on 16 CPUs took the run
# from 6.3 to 5.0 minutes, at roughly twice the cost).
#
# Keep the versions below in step with ci.yml (Renovate does not update this
# file).

# A push to `rwx` runs this on RWX and `.github/workflows/ci.yml` on GitHub
# Actions side by side; `rwx run` from a worktree runs local uncommitted
# changes on top of the pushed HEAD. Push-triggered runs on a public repository
# can use the tool-cache vault only with its "Allow public repositories" switch
# on (vault → Access Control).
on:
  github:
    push:
      if: ${{ event.git.branch == 'rwx' }}
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

# Incremental `target/` and `~/.cargo` between runs — the counterpart of
# Swatinem/rust-cache in ci.yml. Without it every content-cache miss compiles
# from scratch. The vault holds no secrets; it must exist, be unlocked, and
# have "Allow public repositories" on (it was deleted after the 2026-10-18
# evaluation: `rwx vaults create --name dot_agent_deck_rwx_eval --unlocked`).
tool-cache:
  vault: dot_agent_deck_rwx_eval

defaults:
  runner:
    cpus: 4
    memory: 16gb

tasks:
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
        libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev \
        build-essential pkg-config jq
      sudo apt-get clean

  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/vfarcic/dot-agent-deck.git
      ref: ${{ init.commit-sha }}
      # Some fast-tier tests run `git rev-parse --show-toplevel`.
      preserve-git-dir: true

  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.98.1

  - key: nextest
    use: rust
    run: |
      mkdir -p "$HOME/.cargo/bin"
      curl -LsSf https://get.nexte.st/0.9.146/linux | tar zxf - -C "$HOME/.cargo/bin"
      cargo nextest --version

  # Some fast-tier tests run `node` (e.g. tests/pi_native_observer.rs); GitHub's
  # ubuntu-latest image and the devbox shell both ship Node 24, the RWX base
  # image does not. Exact X.Y.Z is required by the package.
  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: "24.22.0"

  - key: go-task
    run: |
      curl -LsSf https://github.com/go-task/task/releases/download/v3.54.0/task_linux_amd64.tar.gz \
        | sudo tar zxf - -C /usr/local/bin task
      task --version

  - key: fmt
    use: [code, rust]
    run: cargo fmt --check

  - key: clippy
    use: [system-packages, code, rust]
    tool-cache: ci-clippy-v2
    env:
      CARGO_INCREMENTAL: "0"
    run: cargo clippy --workspace --all-targets --features e2e,e2e-live -- -D warnings

  - key: build-release
    use: [system-packages, code, rust]
    tool-cache: ci-build-release-v2
    run: cargo build --release

  - key: linkage-check
    use: build-release
    run: cargo xtask linkage-check

  - key: test
    use: [system-packages, code, rust, nextest, go-task, node]
    tool-cache: ci-test-v2
    env:
      DAD_REQUIRE_GO_TASK: "1"
      # Line tables keep file:line in panics and backtraces but drop the rest
      # of the debug info, which is most of `target/`'s size and link time.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    run: |
      cargo test-fast
      # Keep only the dependencies in the tool cache, as Swatinem/rust-cache
      # does on GitHub: the workspace crates rebuild every run anyway (fresh
      # source mtimes), and keeping them grew the cache by tens of GB a run.
      cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
        | while read -r pkg; do cargo clean -q -p "$pkg"; done
    outputs:
      test-results:
        - path: target/nextest/default/junit.xml
          options:
            language: Rust
            framework: cargo-nextest

  # Compile the e2e tier once into a nextest archive. The partitions run the
  # archive, so they never build the tier: a cargo build there would rebuild
  # the workspace crates, whose sources get fresh mtimes in every task.
  - key: e2e-build
    use: [system-packages, code, rust, nextest, node]
    tool-cache: ci-e2e-build-v2
    # The e2e `target/` plus its archive needs well over the default 50 GB.
    runner:
      disk: 150gb
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    run: |
      cargo nextest archive --workspace --features e2e --archive-file e2e.tar.zst
      # Keep only the dependencies in the tool cache, as Swatinem/rust-cache
      # does on GitHub: the workspace crates rebuild every run anyway (fresh
      # source mtimes), and keeping them grew the cache by tens of GB a run.
      cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
        | while read -r pkg; do cargo clean -q -p "$pkg"; done

  # Five runners the size of a GitHub `ubuntu-latest` (4 vCPU / 16 GB), so the
  # timing-sensitive e2e tests see the per-runner load they see in ci.yml, and
  # the speed-up comes from partitioning rather than from bigger machines.
  - key: e2e
    use: e2e-build
    parallel:
      values:
        - shard: "1"
        - shard: "2"
        - shard: "3"
        - shard: "4"
        - shard: version
    runner:
      disk: 150gb
    env:
      SHARD: ${{ parallel.shard }}
    run: |
      # `lifecycle/version/001` runs a nested cold `cargo build` (72-370s in CI)
      # and set the floor of whichever partition drew it, so it runs alone in
      # its own shard and the other four split the rest of the tier.
      if [ "$SHARD" = version ]; then
        set -- -E 'test(=version_001_injected_build_env_reaches_the_binary)'
      else
        set -- --partition "count:$SHARD/4" -E 'not test(=version_001_injected_build_env_reaches_the_binary)'
      fi
      # Extracted into the workspace, so `target/` lands where the tests'
      # compile-time paths (`env!("CARGO_BIN_EXE_dot-agent-deck")`) point.
      cargo nextest run --archive-file e2e.tar.zst --workspace-remap . \
        --extract-to . --extract-overwrite --retries 1 "$@"
    outputs:
      # Nothing uses a partition's filesystem; uploading it cost 5 minutes.
      filesystem: false
      test-results:
        - path: target/nextest/default/junit.xml
          options:
            language: Rust
            framework: cargo-nextest
