# The published docs (PRD #1419, Decision 5).
#
# This file is the single list of what is published: the site's Markdown,
# `llms.txt`, `llms-full.txt` and the topics `dot-agent-deck docs` offers are
# all generated from it. A page under `docs/` that is not listed here is not
# published anywhere. Nothing under `docs/develop/` may be listed; the parser
# rejects a `develop/` slug.
#
# Array order is the reading order used by every consumer.
#
#   slug        - the file path under `docs/` without `.md` ("desktop/voice")
#   title       - the page's title (its first `#` heading)
#   description - one line saying what the page is for

