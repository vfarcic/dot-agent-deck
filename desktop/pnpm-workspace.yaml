# pnpm 10 warns about a dependency whose build (postinstall) script it skipped;
# pnpm 11 makes the same condition FATAL (ERR_PNPM_IGNORED_BUILDS), which fails
# `pnpm install --frozen-lockfile` and, through its deps-status check, every
# `pnpm test` / `pnpm build` after it. esbuild is the only such dependency here.
#
# Spelling matters twice over: pnpm 11 REMOVED `onlyBuiltDependencies` (that key
# is read as an unknown setting and silently does nothing), and `allowBuilds`
# takes a MAP -- `allowBuilds: [esbuild]` parses but approves nothing.
#
# This file is not a version-bump artifact: pnpm 10 honours it too, and it makes
# pnpm 10 actually RUN esbuild's postinstall instead of silently skipping it.
allowBuilds:
  esbuild: true

# TEMPORARY -- DELETE THIS WHOLE BLOCK once 2026-09-27T17:10Z has passed (24h
# after the last of these was published). #1358 moved the Rust `tauri` crate to
# 2.12.0 while the npm half stayed on 2.11.x, and `tauri build` refuses mismatched
# minors, so `desktop-driver` and the release's desktop bundles were red. The
# npm 2.12.0 packages were hours old, inside pnpm's default 24h minimum release
# age, so pnpm wrote these exclusions to let the lockfile take them early. That
# is a deliberate, owner-approved exception to the supply-chain age gate
# (renovate.json's npm `minimumReleaseAge` rule explains the gate), scoped to
# these exact versions; left in place it would exempt nothing new, but it reads
# as policy, so remove it.
minimumReleaseAgeExclude:
  - '@tauri-apps/api@2.12.0'
  - '@tauri-apps/cli-darwin-arm64@2.12.0'
  - '@tauri-apps/cli-darwin-x64@2.12.0'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.0'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.0'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-x64-musl@2.12.0'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.0'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.0'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.0'
