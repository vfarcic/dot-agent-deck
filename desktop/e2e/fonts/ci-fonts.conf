<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  A font set that matches the `desktop-browser` CI job's ubuntu-latest image,
  for running the Playwright suite locally with CI's text measurements:

    FONTCONFIG_FILE="$PWD/e2e/fonts/ci-fonts.conf" pnpm test:browser   # from desktop/

  The directories are where Debian and Ubuntu packages install these fonts.
  A directory that is missing is skipped, so on another layout the run
  measures with fewer fonts and no longer matches CI. Fonts in other
  directories, such as under your home directory, are not loaded. The rules in
  /etc/fonts/conf.d still apply. On 2026-11-25 this set reproduced CI's
  measurements on both engines, where a DejaVu-only set did not.
  docs/develop/desktop-gui.md, "Fonts: why a layout test passes locally and
  fails in CI", has the rest.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/freefont</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/truetype/wqy</dir>
  <dir>/usr/share/fonts/opentype/ipafont-gothic</dir>
  <dir>/usr/share/fonts/opentype/tlwg</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <cachedir prefix="xdg">fontconfig-ci</cachedir>
</fontconfig>
