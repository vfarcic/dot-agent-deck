# Whole-sentence safety: the same action request with independent content
# must not run. Both a model no-match and an action-grounding refusal count;
# timeouts, backend errors and unavailable actions never count as a refusal.

[[fixtures]]
name = "mixed-content-dictation-on"
utterance = "capture my speech as text from now on; the meeting begins at noon"
screen = "agent"
refusal = true
action = "none"
outcome = "no_match"

