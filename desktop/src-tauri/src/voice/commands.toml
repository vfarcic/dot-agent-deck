# PRD #1223 — the rest of the New agent form by voice: Mode, the agent's
# command, and Name — and since PR #1451 round 4 (decision D8), Command itself.
#
# **Each resolves against what the form OFFERS, as the dialog declared it**
# (`VoiceNewAgentForm`), never against a list this table knows. The Mode row
# varies by the deck's capabilities (the authoring chips need `authoring-kind`,
# orchestration chips need `prepare-workflow`), the deck's experimental flag
# (`schedule: issues`) and whether the directory is a project; the agents are
# the deck's own registry, or the desktop's fallback copy. So "mode
# schedule issues" on a deck whose flag is off is refused as a chip that is not
# offered — the same `ParamUnresolved` a directory not on screen gets — rather
# than resolved against a chip nobody can see.
#
# **Availability is `requires = ["new_agent_form"]`**: the fields are live only
# with a deck and a directory chosen, no start in flight and no start
# confirmation open — exactly when a click on them would take. `choose_mode` and
# `name_new_agent` call the function their control calls (`selectMode`, the
# Name input's own setter), so a spoken Name counts as an edit exactly as a
# typed one. `choose_agent_type` has had no control of its own since the Agent
# picker was removed from both clients (PRD #1223): it sets Command to the named
# agent's `default_command`, overwriting what is there.
#
# **Command HAS a row since PR #1451 round 4 (decision D8), which reverses
# what this paragraph used to say.** It said Command had no row, deliberately:
# it is the one field that executes, a transcriber normalises away exactly what
# a command line is made of, and `choose_agent_type`'s registry default would
# cover the common case. The maintainer's hand test answered "Set the command
# to devbox run agent." with "no matching action", and the decision was:
# "Command is only a field. There is a separate action to create an agent."
# Filling the field runs nothing — the agent starts only on a Start the user
# asks for (`start_new_agent`) with the form, command included, in front of
# them — so a mis-heard command costs one correction, not a run. What survives
# of the old caution is the grounding: `command_text` (`voice/command_text.rs`)
# accepts the model's value only when it is in the transcript as written, on
# word boundaries, and the field gets the TRANSCRIPT's slice — byte for byte,
# less surrounding quotes and a sentence's full stop — so the model cannot add
# a flag or correct a word on the way in. The three other form rows used to
# tell the model that Command is typed by hand; they now point at this row.
#
# **None of these starts anything**, so none is in PRD #802 D5's set: they
# change what the form will say, and a start is still a separate act
# (`start_new_agent`, below, and the dialog's own Start).
#
# **`choose_mode` chooses a NAMED chip, never the category** (PRD #1223). Its
# `heard_as` keeps `orchestration`, because "use the billing orchestration" is
# how people name a chip, but its description now says the bare word names no
# chip and that "Activate orchestration" — the Start button's label once an
# orchestration is chosen — is `start_new_agent`. Each chip's own label, said as
# it reads ("No mode", "Orch billing run", "schedule", "dispatcher"), is in the
# description too, for the label rule.
[[commands]]
id          = "choose_mode"
description = """In the New agent form, choose one of the Mode chips it offers, BY NAME: No mode (a
plain agent), one NAMED orchestration (`Orch: <name>`), schedule, schedule: issues, or dispatcher.
Use for mode schedule, make it a dispatcher, use the billing orchestration, orchestration build,
orch billing, plain agent, no mode — and for a chip's label read aloud as it is written: "No mode",
"Orch billing", "schedule", "schedule issues", "dispatcher". Set `mode` to the chip the user meant,
exactly as listed in `new_agent_form.modes` or `new_agent_form.modes_not_offered` — when it is one
the form does NOT offer, the app then says so, so never answer with the nearest offered chip
instead. The bare word "orchestration" names NO chip: an orchestration chip is chosen
by its name. "Activate orchestration", "activate the orchestration", "start orchestration", "start
the orchestration" and "start the run" are the Start button's words and mean `start_new_agent` —
they never choose a chip. This only changes the Mode
field: it starts nothing. Never for the Command field, which is `set_new_agent_command`."""
invoke      = "chooseNewAgentMode"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "choosing a mode needs a daemon and a directory chosen in the New agent dialog; choose those first"
report      = "Mode: {mode}."
asks_to     = "choose a mode"
try_saying  = "mode {mode}"
heard_as    = ["mode", "schedule", "dispatcher", "orchestration", "orch", "plain", "make it", "use", "choose", "set"]

  [[commands.params]]
  name = "mode"
  kind = "mode_ref"

[[commands]]
id          = "choose_agent_type"
description = """In the New agent form, choose which agent to start — Claude Code, OpenCode, Pi or
Codex — by filling the Command field with that agent's default command. Use for use claude, pick
opencode, agent codex, make it a pi agent, set the agent to claude. Set `agent_type` to the words
the user used, copied as they said them — even when they name one that is NOT in
`new_agent_form.agent_types`: the app then says it is not offered, so never answer with the
nearest entry instead. This is a KIND of agent for the new one, never an existing agent (that is
`open_agent`), and it starts nothing. It only ever puts that agent's own default command in the
field: a command line the user says word for word is `set_new_agent_command`."""
invoke      = "chooseNewAgentType"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "choosing an agent needs a daemon and a directory chosen in the New agent dialog; choose those first"
report      = "Command set to {agent_type}'s default command."
asks_to     = "choose an agent"
try_saying  = "use {agent_type}"
heard_as    = ["agent", "use", "pick", "choose", "make it", "set", "claude", "opencode", "pi", "codex"]

  [[commands.params]]
  name = "agent_type"
  kind = "agent_type_ref"

# The `spoken_prefix` kind, reused rather than a new free-text kind: the model
# marks where the introducing words end ("name it", "call it") and the app takes
# the name from its own transcript after them — the dictation row's fidelity
# rule, for the same reason. The dialog trims the trailing full stop a
# transcriber adds to a sentence; nothing else about the words is changed.
#
# The report names no value on purpose: the field itself is on screen beside it,
# and a sentence repeating the transcript would disagree with the field by
# exactly that trimmed full stop.
[[commands]]
id          = "name_new_agent"
description = """In the New agent form, set the Name field to what the user says. Use for name it
billing worker, call it the api reviewer, set the name to docs bot. Answer with `prefix` set to
the exact introducing words and NOTHING else — "name it", "call it", "set the name to" — copied
from the user's own sentence; the app takes the name from the words after them. Never answer with
the name itself. Only the Name field: never the Command field, which is `set_new_agent_command`,
and it starts nothing."""
invoke      = "nameNewAgent"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "naming the new agent needs a daemon and a directory chosen in the New agent dialog; choose those first"
report      = "Name set."
asks_to     = "name the new agent"
try_saying  = "name it docs bot"
heard_as    = ["name", "call"]

  [[commands.params]]
  name = "prefix"
  kind = "spoken_prefix"

# PR #1451 round 4, decision D8 — the Command field by voice. The model
# locates the command in the sentence and `command_text` holds it to the
# transcript (see the paragraph above `choose_mode`); the dialog sets the field
# through the path a keystroke takes, so a spoken command counts as an edit
# exactly as a typed one does. It starts nothing: "Set the command to devbox
# run agent." contains `run`, a `start_new_agent` word, which is why the
# description says in so many words that a command's own words are not a
# request to start. The report quotes what was applied, because the field is
# the thing the user checks before pressing Start.
[[commands]]
id          = "set_new_agent_command"
description = """In the New agent form, set the Command field — the command line the new agent
will run — to a command the user says. Use for set the command to devbox run agent, make the
command npm run dev, change the command to claude --model haiku, the command is bash. Set
`command` to the command exactly as the user said it, copied from their own words
and nothing else: never add, drop or correct a flag, a word or a path, never answer with a command
they did not say, and leave out the introducing words ("set the command to") and the sentence's
final full stop. It only fills the field and starts nothing, even when the command itself contains
words like run, start or launch: the new agent starts only when the user then asks for that
(`start_new_agent`). Not for choosing a kind of agent by name ("use claude" is
`choose_agent_type`) and not for the Name field (`name_new_agent`)."""
invoke      = "setNewAgentCommand"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "setting the command needs a daemon and a directory chosen in the New agent dialog; choose those first"
report      = "Command: “{command}”."
asks_to     = "set the command"
try_saying  = "set the command to {command}"
heard_as    = ["command"]

  [[commands.params]]
  name = "command"
  kind = "command_text"

# Issue #1263 — the deck field, once the dialog is open: the `deck_ref` kind
# `open_new_agent` already resolves, on a row of its own, so a wrong or missing
# deck costs one utterance rather than a close and a reopen. It matters more
# since reference grounding went: a deck the model fills in for "spawn an
# agent" is preselected, and this is how a voice-only user corrects it.
#
# **It calls `chooseDeck`, the click's own function**, so a different deck
# clears the chosen directory, its listing, the deck's options and its
# orchestrations and keeps a typed Name or Command; the deck already chosen
# changes nothing. The dialog looks the resolved deck up in its field as it is
# NOW and refuses one that left it or can no longer take a spawn.
#
# **`requires = ["new_agent_dialog"]`, not `new_agent_form`**: choosing a deck
# is how the form BECOMES live, so gating it on the form would make it useless
# exactly where it is needed. With the dialog closed, a named deck is
# `open_new_agent`'s param instead.
#
# **`heard_as = ["daemon", "deck"]` and nothing else, on purpose.** Changing
# the daemon throws away a chosen directory, which takes several utterances to
# reach again, and observed names — directories, agent labels, orchestration
# titles — can be written to steer the model. With a verb such as `use` or
# `pick` in the vocabulary, "use this directory" or "use claude" over a hostile
# listing could ground a steered switch; requiring the word "daemon" (or
# "deck", the field's name before issue #1045) means the user has to have
# talked about a daemon. "Switch to the build box" without it is refused with
# `try_saying`, which teaches the phrasing. The field's visible label is
# "Daemon", so the label rule is met by "daemon <name>", as "mode <chip>"
# meets it for the Mode row; "deck" stays because people keep saying the old
# name, the same reason `open_deck` keeps it. The residual — "deck" said for another reason while a
# steered pick is in flight — is the one every `heard_as` row carries
# (`docs/develop/voice-first-design.md`, section 6), and what it reaches is
# another deck on screen, visibly, with the typed fields kept.
#
# **"demon" is the same word, as speech-to-text writes it** ("Select mini PC,
# Demon."), so it grounds this row and `switch_deck` as "daemon" does and is
# dropped from a reference like it. It widens the vocabulary by a homophone,
# not by a verb, so the user still has to have talked about a daemon.
#
# **The grounding word is not a deck name.** "daemon" is also a word of the
# local deck's label, "Local daemon", so `resolve_deck_ref` drops "daemon",
# "deck" and articles from the reference before matching: a bare "daemon" —
# the field's heading said alone, or all the model kept of "daemon build box" —
# names no daemon and is asked about, never resolved to the local one.
#
# The report names the deck by the label the screen shows, which is what makes
# a guess audible.
[[commands]]
id          = "choose_deck"
description = """In the New agent dialog, choose which daemon the new agent starts on — the dialog's
Daemon field. Use for daemon build box, use the local daemon, switch to the build box daemon, change
the daemon to local, pick the remote daemon, put it on the local daemon, choose daemon ci — and for a
daemon's own name said with the word daemon, like "Local daemon". Users who knew the field by its
older name say deck in the same places — deck build box, use the local deck, pick the remote deck —
and those mean THIS one too, as does demon, which is how speech-to-text often writes daemon. Set
`deck` to the daemon the user meant, exactly as listed in `decks`. Choosing a different daemon clears the chosen directory and the Mode and keeps a typed Name
or Command. While the New agent dialog is open, a request that names WHICH daemon the new agent goes
on is THIS one — never `open_deck`, which leaves the agent dashboard for the Daemons screen, and
never `open_new_agent`, since the dialog is already open. It starts nothing, and never touches the
Command field."""
invoke      = "chooseNewAgentDeck"
screens     = ["overview"]
requires    = ["new_agent_dialog"]
unavailable_hint = "choosing the daemon this way works while the New agent dialog is open; say “new agent on” and the daemon to open it on one"
report      = "Daemon: {deck}."
asks_to     = "choose the new agent's daemon"
try_saying  = "daemon {deck}"
heard_as    = ["daemon", "deck", "demon"]

  [[commands.params]]
  name = "deck"
  kind = "deck_ref"

# PRD #1223 x PRD #802 D5 — the row that STARTS something.
#
# **It starts at once, and that is D5 REVISITED, not ignored** (2026-09-23). As
# first shipped, this row opened a `ConfirmDialog` restating the form, and the
# user's verdict was: "it shows another popup asking me to confirm. I think that
# only introduced friction by me having to give the same instruction twice." The
# confirmation was dropped for the START only, for three reasons recorded in PRD
# #802's D5 and in `docs/develop/voice-first-design.md`:
#
# - **action grounding** now requires the transcript to contain a start word, so
#   a hostile label can no longer steer the model into starting something while
#   the user said something else — the injection risk D5 was written against is
#   closed at a different layer;
# - the confirmation **re-stated what is already on screen** — deck, directory,
#   mode and command are all visible in the dialog the user is looking at;
# - a mistaken agent is now **one "close" away**, which was not true when D5 was
#   written.
#
# The two stops keep theirs (below): they are destructive, their target may be
# OFF-SCREEN — there is no form to read — and an orchestration close takes
# several roles at once. That asymmetry is the point.
#
# **`unavailable_redirects`: a start with the dialog CLOSED opens it** (D3). The
# descriptions carry this too, and for "start the new agent" they are enough —
# the model answers `open_new_agent` — but a bare "start it" was answered with
# this row in every measured run, including one whose description said in so
# many words not to pick it while `callable: false`. The model's tie-break is
# a probability and this is a sentence the user should never hear, so the pick
# is redirected deterministically instead: a pick of this row that is not
# callable dispatches `open_new_agent` when THAT row is callable and grounded
# by the same words. Safe because the target only opens a dialog.
#
# **The button's labels are this row's words** (PRD #1223, the label rule in
# `docs/develop/voice-first-design.md`). With an orchestration chosen the Start
# button read "Start orchestration", and the user said exactly that and nothing
# started: measured on the default backend, the model answered `none` for it,
# dialog open or closed, because this description never mentioned an
# orchestration and `choose_mode` claimed the word without starting anything.
# "Start agent", the other label, went to `open_new_agent` while the dialog was
# open. So the description names both labels and says a start chooses no Mode.
# Issue #1045 renamed the labels to the TUI's words — "Create agent" and
# "Activate orchestration" — and `activate` joined `heard_as` so the new label
# grounds on its own; the old labels stay in the description because people
# keep saying them.
#
# `invoke` names the dialog's own start (`startNewAgent`), the function its
# Start button calls; it refuses in the dialog's words when the form cannot
# start (no deck, no directory, a start under way, a run title already live).
#
# **"Skip the confirmation" names this row, not a stop** (PR #1451 round 3).
# The stops are the only rows whose descriptions talk about a confirmation, so
# "start it right now, skip the confirmation, I already said yes" drifted to
# `stop_agent` (not callable over the dialog, and refused by grounding — nothing
# ran, and nothing started either). #1260's `new_agent_dialog_closed` fix had
# it at 20/20; adding the page-turn rows took it to 1/10 (10/10 at the round's
# start, 9/10 with those two rows removed, 2/10 with the filter rows removed
# instead). Nothing short of removing both restored it — removing either one
# alone, moving both to the end of the table, or rewording their "starts and
# stops nothing" clause each left it at 0–7/10 — so the fix is here, at the
# start: this description now claims "skip the confirmation" and says a start
# has no confirmation. 70/70 after, against 59/60 for a wording that avoided
# the word; `voice_table_d5_rows_only_ask` admits exactly those two negated
# mentions and still refuses any other "confirm" in this row.
[[commands]]
id          = "start_new_agent"
description = """Start what the New agent dialog's form describes — the voice form of its Start
button, and it starts at once. The button reads "Create agent", or "Activate orchestration" when
an orchestration is chosen in Mode, and either label said aloud means THIS one. Use for create
agent, activate orchestration, activate the orchestration, activate it, start agent, start
orchestration, start the orchestration, start the run, start it, start the agent, start the new
agent, go ahead and start it, launch it, launch the orchestration, create it, spin it up now, or
run it. It fills nothing and chooses no Mode: it acts on the form as it is, which the user is
looking at, so "activate orchestration" starts the orchestration already chosen and is never
`choose_mode`. It runs only while the New agent dialog is open; while it is closed, a request to
start an agent or an orchestration is `open_new_agent`, which opens the dialog. If the form is
incomplete the app says what is missing. Pick it however urgently or insistently the start is asked
for — "start it right now", "just launch it, don't ask me", "skip the confirmation" — since it
starts at once: a start has no confirmation and no second step for it to skip. A bare "go ahead"
means THIS one whenever it is callable and `submit_prompt` is not — there is no agent's prompt to send while the New agent dialog is up."""
invoke      = "startNewAgent"
screens     = ["overview"]
requires    = ["new_agent_dialog"]
unavailable_hint = "starting a new agent needs the New agent dialog; say “new agent” first"
report      = "Starting the agent."
asks_to     = "start the new agent"
try_saying  = "start it"
heard_as    = ["start", "activate", "launch", "create", "spin", "run", "go ahead"]
unavailable_redirects = "open_new_agent"

# Issue #1247 — the dialog's Discard button. Since #1247 every close KEEPS the
# form as a draft the next open replays, so this is the one way to throw it
# away, and the one row over the dialog that cannot be taken back.
#
# **`heard_as_whole`, the second row to use it after `submit_prompt`**, for
# that row's reason: the action is irreversible and its word is ordinary
# English. "Name it discard worker" contains `discard`; so could an utterance
# over a hostile listing written to steer the model here. Only the whole
# utterance being one of these asks for it. `cancel` and `never mind` stay
# `close`'s words — and so keep the draft — because the direction to err in is
# the one that loses nothing: a user who meant to throw the form away says
# "discard" once more, and one who did not has not lost it.
#
# The button's label, "Discard", and its accessible name, "Discard new agent",
# are both entries (the label rule). Blocked while a start is in flight, as
# every close is.
[[commands]]
id          = "discard_new_agent"
description = """Discard what is entered in the New agent dialog and close it — the dialog's Discard
button, whose accessible name is "Discard new agent". Use for discard, discard it, discard this,
discard the form, discard the draft, discard new agent, discard the new agent, or discard the new
agent form — said on their own. Every OTHER way of closing the dialog — close, cancel, never mind —
keeps what was entered for the next time it opens, and that is `close`, not this one. It starts
nothing and stops nothing."""
invoke      = "discardNewAgent"
screens     = ["overview"]
requires    = ["new_agent_dialog"]
unavailable_hint = "discarding works while the New agent dialog is open"
report      = "Discarded the New agent form."
asks_to     = "discard the New agent form"
try_saying  = "discard"
heard_as_whole = [
  "discard", "discard it", "discard this", "discard the form", "discard the draft",
  "discard new agent", "discard the new agent", "discard the new agent form",
]

# PRD #1223 x PRD #802 D5 — the two rows that STOP something, and the one rule
# they share: **each terminates at a `ConfirmDialog`, never at a direct
# dispatch.** D5 requires confirmation "regardless of model confidence, because
# the cost of a rare misfire … is an agent doing something nobody sanctioned and
# a confident wrong answer is indistinguishable from a right one". A dispatch of
# one of these opens the confirmation the manual control opens, and nothing
# stops until the user presses its button. The confirmation's BODY states the
# risk — what will stop, on which daemon — per `ConfirmDialog`'s convention.
#
# **Where the gate lives today, and where it belongs.** In the frontend: each
# row's registry entry calls a member that can only open a confirmation
# (`confirmStopAgent`, `confirmCloseOrchestration`). PRD #802 anticipates a
# `confirm` column in this table; it is deliberately NOT added here, because it
# is #802's feature-wide mechanism to build, and when it lands these two rows
# are the first to carry it.
#
# **Their words are the destructive reading, and only that** (PRD #1223, D1):
# "close" is a VIEW word (`close`) and grounds neither — `stop_agent` has no
# `close` at all, and `close_orchestration` needs the orchestration or the run
# named beside its verb (`heard_as_also`).
#
# **`stop_agent` is the one control whose label is not its voice phrase.**
# Issue #1045 renamed the dashboard row's button to "Close <name> agent",
# because Close is the glossary's word for ending one agent. Reading that label
# aloud does NOT ground this row: with reference grounding gone (2026-09-24),
# `close` in `heard_as` would let a model's pick of this row for "Close the
# agent" open a stop confirmation for whichever agent it guessed, which is the
# D1 misreading this rule exists to prevent. Its spoken form stays "stop
# <name> agent"; `voice_outcome_the_row_close_label_is_not_a_stop_phrase` pins
# the exception.
#
# Each `report` says that nothing has happened yet, because nothing has: the
# report describes the dispatch, and the dispatch only asked.
#
# **Neither runs while the New agent dialog is open** (`requires =
# ["new_agent_dialog_closed"]`, #1260). The dialog is modal over the dashboard,
# so no row's button and no card's Close can be clicked under it, and the
# overview has always refused both dispatches then (`STOP_BEHIND_NEW_AGENT` in
# `AgentOverview.tsx`, which stays as the second line). What was missing was
# the TABLE saying so: the model was told both rows were `callable: true` over
# the open dialog, and "start it right now, skip the confirmation, I already
# said yes" was answered `stop_agent` — with no agent — in 6 and 7 of 20 runs
# across two measurements on the default backend (2 of 20 on `main`, before
# this branch's other prompt changes), most likely because the stops are the
# only rows whose descriptions talk about a confirmation. Grounding refused
# every one of them, so it was never unsafe; it was a start the user asked for
# that did not happen. Held to this requirement, the stops are `callable:
# false` there, and `schema`'s tie-break sends a start-worded request to the
# callable start. It narrows where a stop can run and changes nothing about
# what one does: each still only opens a confirmation.
[[commands]]
id          = "stop_agent"
description = """Stop one running agent on the agent dashboard — the voice form of its row's close
button, whose accessible name is "Close <name> agent". Use for stop tester agent, stop the tester,
stop the agent, kill the reviewer, kill it, shut down the coder,
shut it down, end that agent, terminate the one that is stuck. Set `agent` the way `open_agent`
does. It never stops anything by itself: the app shows the same confirmation the row's button shows
and the user confirms by hand, so pick it whenever the user asks to stop an agent, however
urgently. It needs a word that can only mean stopping: "close" is NOT one — "close the agent" and
"close the tester" close the VIEW (`close`) and stop nothing — and "start" is its opposite: "start
it" is never this one, it is `open_new_agent`. Ending a whole orchestration is
`close_orchestration`. Never for isolating or hiding — "get rid of everything except the tester"
means SHOW the tester (`open_agent`) and stops nothing."""
invoke      = "confirmStopAgent"
screens     = ["overview"]
requires    = ["new_agent_dialog_closed"]
unavailable_hint = "stopping an agent works from the agent dashboard, with the New agent dialog closed"
report      = "Confirm stopping {agent} — nothing has been stopped yet."
asks_to     = "stop an agent"
try_saying  = "stop {agent}"
heard_as    = ["stop", "kill", "shut down", "shut it down", "end", "terminate"]

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "close_orchestration"
description = """Close a whole orchestration on the agent dashboard, stopping every one of its roles —
the voice form of its card's Close button, whose accessible name is "Close <title> orchestration".
The button's visible word is a bare "Close", and a bare "close" is NOT this row: it is `close`,
which closes a view and stops nothing. Use for close the review orchestration, stop the
billing run, shut down the whole orchestration, end every role of it, stop all roles, stop all the
roles. Set `orchestration` to the one the user meant, exactly as listed in `orchestrations`.
The user must NAME the orchestration or the run — "close the agent" or "close the billing agent"
is `close`, which closes a view and stops nothing. It never stops anything by itself: the app shows
the same confirmation the Close button shows, naming every role it will stop, and the user
confirms by hand. One agent is `stop_agent`. Never for isolating or hiding — "get rid of everything
except the tester" means SHOW the tester (`open_agent`) and stops nothing."""
invoke      = "confirmCloseOrchestration"
screens     = ["overview"]
requires    = ["new_agent_dialog_closed"]
unavailable_hint = "closing an orchestration works from the agent dashboard, with the New agent dialog closed"
report      = "Confirm closing {orchestration} — nothing has been stopped yet."
asks_to     = "close an orchestration"
try_saying  = "close the {orchestration} orchestration"
heard_as    = ["close", "stop", "shut down", "end"]
heard_as_also = ["orchestration", "run", "every role", "all roles", "all the roles"]

  [[commands.params]]
  name = "orchestration"
  kind = "orchestration_ref"
