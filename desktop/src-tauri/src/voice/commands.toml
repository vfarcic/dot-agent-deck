unavailable_hint = "turning a page works on the agent dashboard, the Daemons screen and the New agent dialog, once the agent's pane is closed"
report      = "Previous page."
asks_to     = "show the previous page"
try_saying  = "previous page"
heard_as    = ["previous", "back", "before", "page up"]

