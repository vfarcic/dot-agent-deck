# PRD #802 — the voice command table.
#
# ONE file, embedded with `include_str!` (see `table.rs`), read by three
# consumers: schema generation, validation, and dispatch. A row does NOT define
# behaviour — it EXPOSES behaviour that already exists, so `invoke` names an
# entry in the frontend action registry (`desktop/src/lib/voiceActions.ts`,
# M2) and never a second implementation.
#
# Columns:
#
#   id               the action the model answers with. Must not be `none`,
#                    which is reserved for "none of these".
#   description      a PROMPT, not documentation. The model picks on it, so it
#                    is written for a model and reviewed as an interface.
#   invoke           the registry entry to dispatch. M3's guard resolves it.
#   screens          where the command can run: `deck`, `overview`, `agent` —
#                    the three `DeckView` kinds (`desktop/src/types.ts`).
#                    Absent or empty means available everywhere.
#   requires         what else must hold, from the closed set in `table.rs`'s
#                    `Requirement`: `directory_listing` (the New agent dialog
#                    is showing a listing), `parent_directory` (that listing
#                    has a `..`), `new_agent_form` (the dialog's fields are
#                    live) and `new_agent_dialog` (the dialog is open at all).
#                    Answered by what the webview declared with the
#                    utterance. Absent or empty means nothing more is needed.
#   unavailable_hint names the PREREQUISITE, for the sentence the app renders
#                    when the model picks a command the current screen cannot
#                    run. No leading capital and no trailing period: it is
#                    rendered into a sentence, not as one.
#   report           the user-facing sentence for a successful dispatch — the
#                    pipeline's stage 6. A `{param}` placeholder is replaced
#                    with what that param resolved to; `table.rs` refuses a
#                    placeholder naming no declared param.
#                    NAMED `report` RATHER THAN `confirmation` ON PURPOSE:
#                    PRD #802 D5 is "destructive commands behind confirmation",
#                    so rows in this same file will later carry a genuine
#                    confirm-before-acting flag, and the two are close to
#                    opposite — this describes an action that HAPPENED, that
#                    one blocks an action before it does. Do not rename it back.
#   heard_as         the words that ASK for this action (PRD #1223, closing
#                    audit F1). A pick is dispatched only when the transcript
#                    contains at least one entry — a word (heard with or
#                    without a trailing `s`, or split across two or three
#                    adjacent words) or a phrase (its words adjacent, in
#                    order). Otherwise the app refuses with "nothing in that
#                    asks for …". Every entry must be words of the row's own
#                    `id` or `description`, which `table.rs` checks, so the
#                    vocabulary is the one the model picks on. It exists
#                    because observed names (directories, agent labels,
#                    orchestration titles) can be written to steer the model,
#                    and a row with no reference to ground — `submit_prompt`
#                    presses Enter in an agent's prompt — had nothing else
#                    between a steered pick and a dispatch. Tune a too-narrow
#                    vocabulary here; do not loosen the rule.
#   heard_as_whole   instead of `heard_as`: the row is asked for only when the
#                    WHOLE utterance is one of these entries — case,
#                    punctuation and an edge politeness word ("okay",
#                    "please", "now", …) aside —
#                    never when one merely occurs in it (closing audit G1).
#                    For a row whose action cannot be taken back, where an
#                    unrelated occurrence of one ordinary word ("tell it to put
#                    END after the report") must not be enough. Same own-words
#                    rule. Exactly one row uses it, `submit_prompt`
#                    (`voice_table_whole_utterance_rows_are_the_deliberate_set`);
#                    on an ordinary row it would make natural speech fail.
#   ungrounded       instead of either: why this row CANNOT be grounded by
#                    words. Every row carries exactly one of the three, so no
#                    row is exempt by omission. No shipped row uses it
#                    (`voice_table_no_row_is_exempt_from_action_grounding`).
#   [[commands.params]]  name + kind, `kind` from the closed resolver set
#                    (`agent_ref`, `deck_ref`, `dir_ref`, `mode_ref`,
#                    `agent_type_ref`, `orchestration_ref`, `spoken_prefix`).
#                    `optional =
#                    true` lets the row dispatch when the model supplies no
#                    value; a value that resolves to nothing is still refused,
#                    and a report may not interpolate an optional param.
#
# **This table was NAVIGATION ONLY and is not any more**, which is worth saying
# in the sentence that used to claim it rather than leaving the claim to rot:
# `voice_off` stops the microphone, `list_commands` opens an overlay,
# `dictate_to_agent` types what it hears into the open agent's prompt and
# `submit_prompt` presses Enter in it. What still holds is the narrower property
# the old sentence was really protecting — **no row here starts an agent, stops
# one, or answers a permission prompt BY ITSELF.** Three rows now LEAD to a start
# or a stop — `start_new_agent`, `stop_agent`, `close_orchestration`, at the end
# of this file — and each of them terminates at a `ConfirmDialog` the user
# answers by hand, never at a direct dispatch: that is PRD #802 D5's
# confirm-before-acting step, satisfied in the FRONTEND for now. The table's own
# `confirm` column that D5 anticipates (see `report` above) is still unbuilt and
# is where that flag belongs eventually; it is #802's mechanism, and building it
# here would put a feature-wide safety mechanism on one feature's schedule.
# `voice_table_d5_rows_only_ask` pins the set. No row answers a permission
# prompt at all. The dictation pair is what to
# weigh against that, and it earns its place on two counts: the words go into a
# VISIBLE input the user can edit, and nothing is sent without the user either
# saying so or watching a five-second countdown they can cancel by speaking.
# `close` closes a VIEW rather than a terminal pane — see the comment above that
# row, because the two are one word apart in speech.

[[commands]]
id          = "open_agent"
description = """Open one agent's pane over the current screen, so the user can watch that one
agent's terminal. Use when the user asks to focus on, enlarge, zoom, open, show, see or look at ONE
named agent, or to see only that one ("everything except the tester"). The agent is named the way the deck shows it — a role like "tester" or
"orchestrator", or a name the user gave it."""
invoke      = "openAgent"
screens     = ["deck", "overview"]
unavailable_hint = "opening an agent works from the deck or the agent overview"
report      = "Opening {agent}."
heard_as    = ["open", "show", "see", "focus", "enlarge", "zoom", "look", "watch", "except"]

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "open_overview"
description = """Leave the deck and show the agent overview: every agent across every connected
deck in one list, with each one's status and activity. Use when the user asks to see everything,
all the agents, the whole fleet, or asks which agents are running or what needs attention."""
invoke      = "openOverview"
screens     = ["deck"]
unavailable_hint = "the agent overview opens from the deck"
report      = "Opening the agent overview."
heard_as    = ["overview", "everything", "all", "fleet", "running", "attention"]

[[commands]]
id          = "open_deck"
description = """Go back to the deck — the screen with the terminals on it — leaving the agent
overview. On the agent overview a bare "go back" or "back" means THIS one, because the deck is
the screen the overview was opened from. Also use for return to the deck, take me back, or show
the terminals or panes again."""
invoke      = "openDeck"
screens     = ["overview"]
unavailable_hint = "returning to the deck works from the agent overview"
report      = "Back to the deck."
heard_as    = ["deck", "back", "return", "terminals", "panes"]

# PRD #802 — "close" means the thing on TOP, and this row replaced
# `close_agent_view` rather than sitting beside it.
#
# The defect that made it necessary: the discovery overlay is opened by voice
# and could only be dismissed by a click or Escape, which breaks the feature's
# own premise. The overlay is a `useState` boolean in the voice surface, so
# *"an overlay is open"* is not expressible in `screens` — the `screens` column
# draws on `DeckView`, and M1 recorded that limitation. So the PRECEDENCE is
# decided at DISPATCH, in `closeTopmost` (`desktop/src/lib/voiceActions.ts`):
# the list of commands if it is showing, otherwise the agent's pane, otherwise
# nothing — and when there is nothing, the surface says so rather than
# reporting a close that did not happen.
#
# **`close_agent_view` folded into this one instead of staying.** Two rows both
# claiming *"close this"* is exactly the tie `schema::TOOL_INSTRUCTIONS`
# documents at length, and on the agent screen the callability tie-break cannot
# break it because both would be callable. One row, one meaning, one place the
# precedence is written down.
#
# No `screens`, so callable everywhere — the third row in that deliberate set,
# and for the overlay's sake rather than for convenience: the voice surface is
# a sibling of the screen switch, so its overlay can be open on any of the
# three. The bare "go back" claim is scoped to a pane being open, exactly as
# `close_agent_view`'s was, because `open_deck` claims the same phrase for the
# overview.
#
# It closes a VIEW rather than a terminal pane. The agent keeps running and its
# pane is untouched — the two are one word apart in speech, so the description
# says so.
[[commands]]
id          = "close"
description = """Close whatever is open OVER the current screen and go back to what was
underneath. That is the list of spoken commands if it is showing, and otherwise one agent's open
pane. Use for close, close this, close it, dismiss this, hide this, get rid of this, I'm done
with this, stop looking at this, or leave this agent. A bare "go back" or "back" means THIS one ONLY when `open_deck`
is not callable — a callable `open_deck` means the deck itself is what "back" leads to, and that
one wins. This only closes what is on top: it does NOT stop any agent, does NOT close an agent's
terminal pane, and does NOT turn voice off."""
invoke      = "closeTopmost"
unavailable_hint = "closing what is on top works anywhere"
report      = "Closed."
heard_as    = ["close", "dismiss", "hide", "get rid", "done", "leave", "stop looking", "back"]

# PRD #802 M8 — the cost-of-a-row proof: the first command added after the
# plumbing existed. It cost SEVEN files, five of them test-only and none of them
# implementation — the nine tests that pin the shipped row set by value are what
# the other five are. PRD #802's M8 milestone has the file-by-file accounting.
#
# `screens = ["deck"]` rather than `["deck", "overview"]`, and the
# narrowing is the rule rather than caution: the Settings overlay is reachable
# only from the DECK rail — the overview's rail holds Deck and Overview and
# nothing else — so listing `overview` would let voice open a surface no click
# can reach from that screen, which makes voice a second control surface with
# capabilities the first lacks. A row does not define behaviour; it exposes
# behaviour that already exists.
[[commands]]
id          = "open_settings"
description = """Open the app's Settings sheet: appearance, the decks this app connects to, voice,
and zoom. Use when the user asks for settings, preferences, options, configuration, or asks where
to change how the app looks, where to add or edit a deck, or where to put an API key. This only
opens the sheet — it changes no setting by itself."""
invoke      = "openSettings"
screens     = ["deck"]
unavailable_hint = "settings open from the deck"
report      = "Opening settings."
heard_as    = ["settings", "preferences", "options", "configuration", "api key"]

# PRD #802 — the first row with NO `screens` key, which means callable
# everywhere, and that is the requirement rather than an oversight: stopping
# must never be unavailable. Every other row narrows because the behaviour it
# exposes is reachable only from some screens; this one exposes the Voice
# button, which is a peer of the screen switch and is mounted on all three.
#
# `unavailable_hint` is still required and is the one column here nothing
# renders today: `Unavailable` is produced only by a row the current screen
# cannot run, and this row has no such screen. The column stays required rather
# than becoming conditional on `screens` — a second rule in the parser for one
# row shape — and the fragment below is what would render if the row were ever
# narrowed. `voice_table_rows_callable_everywhere_are_the_deliberate_set` pins
# which rows are in this position so it stays a decision.
#
# It is `stopVoice` and not `toggleVoice`: the table cannot see which way a
# toggle is pointing (the same reason `toggleEvidenceDrawer` carries a
# `no_voice`), and "voice on" is a thing nothing could hear anyway.
[[commands]]
id          = "voice_off"
description = """Turn voice control off — close the microphone and stop listening, so nothing
further is heard until the Voice button is pressed again. Use for voice off, turn off the voice,
turn voice off, stop listening, stop voice control, stop voice, mute, mic off, or any request to stop
LISTENING.
This stops the microphone and nothing else: it changes no screen, closes no view, and stops no
agent."""
invoke      = "stopVoice"
unavailable_hint = "turning voice off works anywhere"
report      = "Voice control off."
heard_as    = ["voice", "listening", "microphone", "mic", "mute"]

# PRD #802 D7 — discovery, and the second row with no `screens` key.
#
# The product owner asked the feature what it could do and was told that is not
# a command. This is the row that answers. It is callable everywhere for the
# same reason `voice_off` is: a user who does not know what to say cannot be
# told to go to another screen first.
#
# The overlay it opens is GENERATED from this table — every row's id, its
# description and whether this screen can run it — so a row added below appears
# in it with no edit anywhere. There is deliberately no user-facing wording
# column feeding it: the `description` a reader sees there IS this prompt, which
# reads as one, and that is the accepted cost of not keeping two wordings in
# step. `desktop_voice_commands` in `lib.rs` has the argument.
[[commands]]
id          = "list_commands"
description = """List everything the user can say right now: an overlay naming every spoken
command and what each one does. Use when the user asks what they can say, what commands there
are, "what can you do", how this works, for help, for the options, or for a list. This only shows
the list — it runs none of the commands on it."""
invoke      = "showVoiceCommands"
unavailable_hint = "the list of commands opens anywhere"
report      = "Here is what you can say."
heard_as    = ["say", "commands", "help", "options", "list", "what can", "how"]

# PRD #802 D6, REBUILT — dictation without a mode, and the feature's own point
# in the product owner's words: *"see what's going on in any of the agents and
# interact with any of them."*
#
# **What shipped first was a MODE and this is not.** *"type to the tester"* used
# to aim the microphone and every later utterance was typed until an exit phrase
# was heard — the two failures D6 itself warned about, a missed exit typing the
# exit phrase into the agent and a false positive truncating somebody
# mid-sentence, are both gone by construction. The shape now is: open the
# agent's pane, then say what you want typed, one utterance at a time.
#
# **The model marks a boundary; it never supplies the text.** The `prefix` param
# is the words that INTRODUCED the dictation — *"let's write a prompt"* in
# *"let's write a prompt run the login tests"* — and the app verifies those
# words really are the front of its own transcript before typing anything
# (`voice::dictation::strip_opening`). What reaches the agent is a slice of the
# transcript and never of the model's answer. A free-text CONTENT param was the
# obvious alternative and is exactly what makes it unacceptable: it would put
# the model in the path of the user's own words.
#
# **No agent param, because the target is the pane the user is looking at.**
# `screens = ["agent"]` is the whole targeting rule, which is finally what the
# screen model is for. With no pane open the app renders the hint below rather
# than typing into a terminal nobody can see — the requirement is that dictated
# words land in a VISIBLE input the user can edit, and on the deck and the
# overview there is no one pane to mean.
#
# The words are typed and NOT sent. Sending is `submit_prompt`, the five-second
# countdown the surface runs, or the user pressing Enter — each of which the
# user can see coming and cancel by talking.
#
# **A fast path answers the obvious openers without a model call at all**
# (`voice::dictation::DICTATION_OPENERS` — `type`, `write`, `say`, `dictate`),
# and that is an optimisation rather than the vocabulary: everything else
# reaches the model and is answered by this row. The list is a cost decision,
# not a set of magic words, which is the distinction PRD #802 opens by making.
[[commands]]
id          = "dictate_to_agent"
description = """Put the user's own words into the open agent's prompt instead of treating them
as a command. Use whenever the user introduces something they want written down for the agent —
they may open with type, write, say or dictate ("type run the login tests", "write a note that
the build is green"), or with anything else at all ("let's write a prompt ...", "tell it to ...",
"ask it to ...", "I want it to ..."). Answer with `prefix` set to the exact introducing words and
NOTHING else: the words BEFORE what the user wants written, copied from their own sentence. Stop
the prefix at the last word that leads UP TO the request — for "let's write a prompt run the
login tests" it is "let's write a prompt", and for "ask it to summarise what it just did" it is
"ask it to" and NOT "ask it to summarise", because the thing the agent is being asked to do is
part of the text. Never answer with the text itself — the app takes that from the transcript. Do NOT use this for a request to
LOOK at an agent or open its pane, which is `open_agent`, and do NOT use it to send what is
already in the prompt, which is `submit_prompt`."""
invoke      = "dictateToAgent"
screens     = ["agent"]
unavailable_hint = "typing to an agent needs that agent's pane open — open one first"
report      = "Typed: “{prefix}”."
heard_as    = ["type", "write", "say", "dictate", "tell", "ask", "want", "prompt", "note"]

  [[commands.params]]
  name = "prefix"
  kind = "spoken_prefix"

# PRD #802 D6 — press Enter in the open agent's prompt.
#
# The third way to send, beside the surface's five-second countdown and the
# user's own keyboard, and the only one that is a spoken command. It is a row
# rather than a private phrase list so the discovery overlay lists it: a user
# who has just watched their words appear in an agent's prompt needs to be able
# to find out how to send them, and "generated from the table" is how anything
# becomes findable here.
#
# A fast path matches `voice::dictation::SUBMIT_PHRASES` against the WHOLE
# normalised utterance before any backend call. Whole-utterance equality is the
# defence against the failure that makes this dangerous: a trailing rule would
# submit "the meeting is at the" when the user said "type the meeting is at the
# end". Submitting is the last thing that happens to a prompt, so that failure
# is unrecoverable — see the constant's own doc for the phrases that were
# rejected and why.
#
# The MODEL's path is held to the same rule by `heard_as_whole` (PRD #1223,
# closing audit G1). With `heard_as` a steered pick grounded on any occurrence
# of one of these words — "tell it to enter the result", "tell it the build has
# finished", "tell it to go ahead with the refactor" — and the surface presses
# Enter at once. So the whole utterance must BE one of the entries below, less
# an edge politeness word ("okay", "please", "now", …): "okay, send it please"
# still submits, and a sentence that merely contains "send" is dictation or
# nothing.
#
# `screens = ["agent"]` for `dictate_to_agent`'s reason: there is one prompt to
# send only when there is one pane on screen.
[[commands]]
id          = "submit_prompt"
description = """Send what is already in the open agent's prompt — press Enter for the user. Use
when the user says to send it, submit it, press enter, go ahead, that is the end, or that the
prompt is finished. A bare "send", "submit", "enter" or "end" means this. It sends what is
ALREADY there and types nothing new: a request to write something down is `dictate_to_agent`."""
invoke      = "submitAgentPrompt"
screens     = ["agent"]
unavailable_hint = "sending a prompt needs an agent's pane open"
report      = "Sent."
heard_as_whole = [
  "send it", "send", "submit it", "submit", "press enter", "enter", "go ahead", "end",
  "that is the end", "finished", "the prompt is finished",
]

# PRD #1223 — open the New agent dialog, and the first row with a `deck_ref`.
#
# It OPENS A DIALOG AND STARTS NOTHING, which is why it sits outside PRD #802
# D5's confirm-before-acting set with every other row here: the dialog's own
# Start button is still the only thing that starts an agent, and the user
# presses it with the form in front of them. "close" dismisses it (U5).
#
# The `deck` param is OPTIONAL — the first one in the table. "new agent" alone
# is a complete command (the dialog opens on its deck step, exactly as the top
# bar's button opens it), and "new agent on the build box" preselects that deck,
# which is what a deck group's own header button does. A deck the fleet does not
# have is still refused rather than dropped: the user named one, and opening the
# dialog as though they had not would lose what they asked for.
#
# `screens = ["overview"]`: the dialog lives on the overview, whose fleet its
# deck step lists (`VoiceOverviewContext` in `voiceActions.ts`), and a row
# exposes behaviour that already exists rather than adding a route of its own.
[[commands]]
id          = "open_new_agent"
description = """Open the New agent dialog, where the user picks a deck, a directory and an agent to
start. Use for new agent, start a new agent, create an agent, launch an agent, add an agent, or
spin one up. When the user names the deck it should go on — "new agent on the build box", "start
an agent on local" — set `deck` to the words they used for it; otherwise leave `deck` out. This
only OPENS the dialog: it starts nothing, and the user still presses Start. It is not
`open_agent`, which shows an agent that already exists."""
invoke      = "openNewAgent"
screens     = ["overview"]
unavailable_hint = "starting a new agent works from the agent overview"
report      = "Opening the New agent dialog."
heard_as    = ["new", "create", "launch", "add", "spin", "start"]

  [[commands.params]]
  name     = "deck"
  kind     = "deck_ref"
  optional = true

# PRD #1223 — the directory browser by voice: the first rows that address a
# control INSIDE a mounted dialog rather than app-level state.
#
# **Why a name resolves at all.** The daemon lists one level per request, so
# there is no flat set of the deck's directories to match a spoken name against
# — and the verb that would make one, a directory search, was declined (#819,
# and again in this PRD) because it needs its own bounds, capability and threat
# model. But at any moment the browser HAS a finite, visible set of named
# children on screen, and "open dir billing" means the child called billing in
# the level the user is looking at. That set is what a `dir_ref` resolves
# against, exactly as `agent_ref` resolves against the live agent list. Each
# utterance stays independent: the dialog holds the cursor and the resolver
# needs no memory. **None of this can find a directory anywhere else on the
# deck** — that is still the declined search verb, and it stays declined.
#
# **Availability is the `requires` column, not `screens`**, because a dialog is
# not a `DeckView`. The webview declares what the browser shows with each
# utterance (`VoiceDirectories`); with no declaration — dialog closed, no deck
# chosen, no listing yet, a start in flight — every row below is `callable:
# false` and a pick of one renders the hint rather than dispatching into a
# closed dialog.
#
# **None of these starts anything**, so none is in PRD #802 D5's confirmation
# set: navigating a listing and choosing a directory change what the FORM will
# say, and the dialog's own Start is still the only thing that starts an agent.
# The manual paths — the `..` row, `h`/Left/Backspace, Enter/`l`/Right, Space,
# the filter, `q` — are untouched; each row calls the function its key calls.
[[commands]]
id          = "open_dir"
description = """In the New agent dialog's directory browser, open one of the directories listed
on screen — go down into it. Use for open dir billing, open the billing folder, go into src, enter
docs, cd into api. Set `dir` to the words the user used for the directory; it must be one of
`directories.entries`, the directories on screen right now. This only moves the browser: it
starts nothing and does not choose the directory for the agent (that is `use_this_directory`).
Not for going up (`go_to_parent`), and never for an agent or a deck."""
invoke      = "openDirectory"
screens     = ["overview"]
requires    = ["directory_listing"]
unavailable_hint = "opening a directory works while the New agent dialog is showing a directory listing"
report      = "Opening {dir}."
heard_as    = ["open", "into", "enter", "cd", "go down"]

  [[commands.params]]
  name = "dir"
  kind = "dir_ref"

[[commands]]
id          = "go_to_parent"
description = """In the New agent dialog's directory browser, go up one level to the parent
directory — the `..` row. Use for go to parent, go to the parent dir, go up, up one level, one
level up, parent directory, or cd dot dot. It moves the browser only and starts nothing."""
invoke      = "goToParentDirectory"
screens     = ["overview"]
requires    = ["parent_directory"]
unavailable_hint = "going up works while the New agent dialog is showing a directory that has a parent"
report      = "Going up."
heard_as    = ["parent", "up", "dot dot"]

[[commands]]
id          = "use_this_directory"
description = """In the New agent dialog's directory browser, choose the directory on screen as the
one the new agent starts in, which unlocks the rest of the form. Use for use this directory, use
this folder, pick this one, choose this directory, this is the one, or select this directory.
It chooses the directory and starts nothing — the user still presses Start."""
invoke      = "useThisDirectory"
screens     = ["overview"]
requires    = ["directory_listing"]
unavailable_hint = "choosing a directory works while the New agent dialog is showing a directory listing"
report      = "Using this directory."
heard_as    = ["use", "pick", "choose", "select", "this is the one", "this one"]

# PRD #1223 — the rest of the New agent form by voice: Mode, Agent and Name.
#
# **Each resolves against what the form OFFERS, as the dialog declared it**
# (`VoiceNewAgentForm`), never against a list this table knows. The Mode row
# varies by the deck's capabilities (the authoring chips need `authoring-kind`,
# orchestration chips need `prepare-workflow`), the deck's experimental flag
# (`schedule: issues`) and whether the directory is a project; the Agent picker
# is the deck's own registry, or the desktop's labelled fallback. So "mode
# schedule issues" on a deck whose flag is off is refused as a chip that is not
# offered — the same `ParamUnresolved` a directory not on screen gets — rather
# than resolved against a chip nobody can see.
#
# **Availability is `requires = ["new_agent_form"]`**: the fields are live only
# with a deck and a directory chosen, no start in flight and no start
# confirmation open — exactly when a click on them would take. Each row calls the
# function its click calls (`selectMode`, `chooseAgent`, the Name input's own
# setter), so choosing an agent overwrites Command with its default exactly as
# the picker does, and a spoken Name counts as an edit exactly as a typed one.
#
# **Command has NO row, deliberately.** It is the one field that executes: what
# is in it runs as the deck's user in the chosen directory. Dictating a shell
# command is the most error-prone thing a transcriber can be asked to do —
# flags, quotes, paths and punctuation are precisely what it normalises away —
# and a mis-dictated command is the one mistake in this dialog with
# consequences beyond the form. Choosing an agent already fills it with that
# agent's default command, which covers the common case, and the field stays
# typed by hand. `choose_mode`'s and `name_new_agent`'s descriptions say so, so
# "set the command to …" is not coerced into either.
#
# **None of these starts anything**, so none is in PRD #802 D5's set: they
# change what the form will say, and a start is still a separate, confirmed
# act (`start_new_agent`, below, and the dialog's own Start).
[[commands]]
id          = "choose_mode"
description = """In the New agent form, choose one of the Mode chips it offers: No mode (a plain
agent), an orchestration (`Orch: <name>`), schedule, schedule: issues, or dispatcher. Use for
mode schedule, make it a dispatcher, use the billing orchestration, orchestration build, plain
agent, no mode. Set `mode` to the words the user used for the chip, copied as they said them —
even when they name a chip that is NOT in `new_agent_form.modes`: the app then says that chip is
not offered, so never answer with the nearest chip instead. This only changes the Mode field: it
starts nothing. Never for the command line, which is typed by hand."""
invoke      = "chooseNewAgentMode"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "choosing a mode works while the New agent form has a deck and a directory chosen"
report      = "Mode: {mode}."
heard_as    = ["mode", "schedule", "dispatcher", "orchestration", "orch", "plain", "make it", "use", "choose", "set"]

  [[commands.params]]
  name = "mode"
  kind = "mode_ref"

[[commands]]
id          = "choose_agent_type"
description = """In the New agent form, choose which agent to start from its Agent picker — Claude
Code, OpenCode, Pi, Codex, or auto — which also fills the Command field with that agent's default
command. Use for use claude, pick opencode, agent codex, make it a pi agent, set the agent to
auto. Set `agent_type` to the words the user used, copied as they said them — even when they name
one that is NOT in `new_agent_form.agent_types`: the app then says it is not offered, so never
answer with the nearest entry instead. This is a KIND of agent for the new one, never an existing
agent (that is `open_agent`), and it starts nothing."""
invoke      = "chooseNewAgentType"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "choosing an agent works while the New agent form has a deck and a directory chosen"
report      = "Agent: {agent_type}."
heard_as    = ["agent", "use", "pick", "choose", "make it", "set", "claude", "opencode", "pi", "codex", "auto"]

  [[commands.params]]
  name = "agent_type"
  kind = "agent_type_ref"

# The `spoken_prefix` kind, reused rather than a new free-text kind: the model
# marks where the introducing words end ("name it", "call it") and the app takes
# the name from its own transcript after them — the dictation row's fidelity
# rule, for the same reason. The dialog trims the trailing full stop a
# transcriber adds to a sentence; nothing else about the words is changed.
#
# The report names no value on purpose: the field itself is on screen beside it,
# and a sentence repeating the transcript would disagree with the field by
# exactly that trimmed full stop.
[[commands]]
id          = "name_new_agent"
description = """In the New agent form, set the Name field to what the user says. Use for name it
billing worker, call it the api reviewer, set the name to docs bot. Answer with `prefix` set to
the exact introducing words and NOTHING else — "name it", "call it", "set the name to" — copied
from the user's own sentence; the app takes the name from the words after them. Never answer with
the name itself. Only the Name field: never the command line, which is typed by hand, and it
starts nothing."""
invoke      = "nameNewAgent"
screens     = ["overview"]
requires    = ["new_agent_form"]
unavailable_hint = "naming the new agent works while the New agent form has a deck and a directory chosen"
report      = "Name set."
heard_as    = ["name", "call"]

  [[commands.params]]
  name = "prefix"
  kind = "spoken_prefix"

# PRD #1223 x PRD #802 D5 — the three rows that START or STOP something, and the
# one rule they share: **each terminates at a `ConfirmDialog`, never at a direct
# dispatch.** D5 requires confirmation "regardless of model confidence, because
# the cost of a rare misfire … is an agent doing something nobody sanctioned and
# a confident wrong answer is indistinguishable from a right one". So the model
# is never trusted to START anything: a dispatch of one of these rows opens the
# confirmation the manual control opens (or, for the start, the dialog's own),
# and nothing runs until the user presses its button. The confirmation's BODY
# states the risk — what will run, where, on which deck — per `ConfirmDialog`'s
# convention.
#
# **Where the gate lives today, and where it belongs.** In the frontend: each
# row's registry entry calls a member that can only open a confirmation
# (`confirmStartNewAgent`, `confirmStopAgent`, `confirmCloseOrchestration`).
# PRD #802 anticipates a `confirm` column in this table; it is deliberately NOT
# added here, because it is #802's feature-wide mechanism to build, and when it
# lands these three rows are the first to carry it.
#
# Each `report` says that nothing has happened yet, because nothing has: the
# report describes the dispatch, and the dispatch only asked.
[[commands]]
id          = "start_new_agent"
description = """Start the agent the New agent dialog's form describes — the voice form of its Start
button. Use for start it, start the agent, go ahead and start it, launch it, create it, spin it up
now, or run it. It fills nothing: it acts on the form as it is. It never starts anything
by itself — the app shows a confirmation naming the deck, the directory, the mode and the command,
and the user confirms by hand — so pick it whenever the user asks to start, however urgently or
insistently they say it. If the form is incomplete the app says what is missing. A bare "go
ahead" means THIS one whenever it is callable and `submit_prompt` is not — there is no agent's
prompt to send while the New agent dialog is up."""
invoke      = "confirmStartNewAgent"
screens     = ["overview"]
requires    = ["new_agent_dialog"]
unavailable_hint = "starting a new agent works while the New agent dialog is open"
report      = "Confirm the start in the dialog — nothing has started yet."
heard_as    = ["start", "launch", "create", "spin", "run", "go ahead"]

[[commands]]
id          = "stop_agent"
description = """Stop one running agent on the agent overview — the voice form of its row's Stop
button. Use for stop the tester, kill the reviewer, shut down the coder, end that agent, terminate
the one that is stuck. Set `agent` the way `open_agent` does. It never stops anything by itself:
the app shows the same confirmation the Stop button shows and the user confirms by hand, so pick it
whenever the user asks to stop an agent, however urgently. It stops an AGENT; closing a view is
`close`, and ending a whole orchestration is `close_orchestration`. Never for isolating or hiding —
"get rid of everything except the tester" means SHOW the tester (`open_agent`) and stops nothing."""
invoke      = "confirmStopAgent"
screens     = ["overview"]
unavailable_hint = "stopping an agent works from the agent overview"
report      = "Confirm stopping {agent} — nothing has been stopped yet."
heard_as    = ["stop", "kill", "shut down", "end", "terminate"]

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "close_orchestration"
description = """Close a whole orchestration on the agent overview, stopping every one of its roles —
the voice form of its card's Close button. Use for close the review orchestration, stop the
billing run, shut down the whole orchestration, end every role of it. Set `orchestration` to the
words the user used for it; it must be one of `orchestrations`. It never stops anything by itself:
the app shows the same confirmation the Close button shows, naming every role it will stop, and the
user confirms by hand. One agent is `stop_agent`. Never for isolating or hiding — "get rid of
everything except the tester" means SHOW the tester (`open_agent`) and stops nothing."""
invoke      = "confirmCloseOrchestration"
screens     = ["overview"]
unavailable_hint = "closing an orchestration works from the agent overview"
report      = "Confirm closing {orchestration} — nothing has been stopped yet."
heard_as    = ["close", "stop", "shut down", "end"]

  [[commands.params]]
  name = "orchestration"
  kind = "orchestration_ref"
