  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "open_card_pull_request"
description = """Open, in the app's GitHub browser, the pull request an agent reported on its CARD,
as the deck checked it. Use when the user names an agent's card and its pull request — "open the
pull request on the coder's card", "show the PR the tester reported". The pull request of the
