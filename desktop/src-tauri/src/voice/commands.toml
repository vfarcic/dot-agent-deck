# PRD #802 — the voice command table.
#
# ONE file, embedded with `include_str!` (see `table.rs`), read by three
# consumers: schema generation, validation, and dispatch. A row does NOT define
# behaviour — it EXPOSES behaviour that already exists, so `invoke` names an
# entry in the frontend action registry (`desktop/src/lib/voiceActions.ts`,
# M2) and never a second implementation.
#
# Columns:
#
#   id               the action the model answers with. Must not be `none`,
#                    which is reserved for "none of these".
#   description      a PROMPT, not documentation. The model picks on it, so it
#                    is written for a model and reviewed as an interface.
#   invoke           the registry entry to dispatch. M3's guard resolves it.
#   screens          where the command can run: `deck`, `overview`, `agent` —
#                    the three `DeckView` kinds (`desktop/src/types.ts`).
#                    Absent or empty means available everywhere.
#   unavailable_hint names the PREREQUISITE, for the sentence the app renders
#                    when the model picks a command the current screen cannot
#                    run. No leading capital and no trailing period: it is
#                    rendered into a sentence, not as one.
#   report           the user-facing sentence for a successful dispatch — the
#                    pipeline's stage 6. A `{param}` placeholder is replaced
#                    with what that param resolved to; `table.rs` refuses a
#                    placeholder naming no declared param.
#                    NAMED `report` RATHER THAN `confirmation` ON PURPOSE:
#                    PRD #802 D5 is "destructive commands behind confirmation",
#                    so rows in this same file will later carry a genuine
#                    confirm-before-acting flag, and the two are close to
#                    opposite — this describes an action that HAPPENED, that
#                    one blocks an action before it does. Do not rename it back.
#   [[commands.params]]  name + kind, `kind` from the closed resolver set.
#
# **This table was NAVIGATION ONLY and is not any more**, which is worth saying
# in the sentence that used to claim it rather than leaving the claim to rot:
# `voice_off` stops the microphone, `list_commands` opens an overlay, and
# `dictate_to_agent` aims the microphone at one agent and types what it hears
# into that agent's terminal. What still holds is the narrower property the old
# sentence was really protecting — **no row here starts an agent, stops one, or
# answers a permission prompt**, which is why none of them needs the
# confirm-before-acting step PRD #802 D5 is about. `dictate_to_agent` is the one
# to weigh against that, and it earns its place on two counts: it types into a
# VISIBLE input the user can edit, and it submits only behind a countdown the
# user can cancel by speaking. `close_agent_view` closes a VIEW rather than a
# terminal pane — see the comment above that row, because the two are one word
# apart in speech.

[[commands]]
id          = "open_agent"
description = """Open one agent's pane over the current screen, so the user can watch that one
agent's terminal. Use when the user asks to focus on, enlarge, zoom, open, show or look at ONE
named agent. The agent is named the way the deck shows it — a role like "tester" or
"orchestrator", or a name the user gave it."""
invoke      = "openAgent"
screens     = ["deck", "overview"]
unavailable_hint = "opening an agent works from the deck or the agent overview"
report      = "Opening {agent}."

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "open_overview"
description = """Leave the deck and show the agent overview: every agent across every connected
deck in one list, with each one's status and activity. Use when the user asks to see everything,
all the agents, the whole fleet, or asks which agents are running or what needs attention."""
invoke      = "openOverview"
screens     = ["deck"]
unavailable_hint = "the agent overview opens from the deck"
report      = "Opening the agent overview."

[[commands]]
id          = "open_deck"
description = """Go back to the deck — the screen with the terminals on it — leaving the agent
overview. On the agent overview a bare "go back" or "back" means THIS one, because the deck is
the screen the overview was opened from. Also use for return to the deck, take me back, or show
the terminals or panes again."""
invoke      = "openDeck"
screens     = ["overview"]
unavailable_hint = "returning to the deck works from the agent overview"
report      = "Back to the deck."

# NOT the destructive "close a pane" the PRD puts out of scope. This closes the
# VIEW — `closeAgent` in `desktop/src/App.tsx`, which is `setView({ kind: from })`
# and nothing else. The agent keeps running, its terminal pane is untouched, and
# the description says so because the two are one word apart in speech.
[[commands]]
id          = "close_agent_view"
description = """Close the agent view that is open over the screen and return to the screen it
was opened from. While one agent's view is open a bare "go back" or "back" means THIS one. Also
use for close this, close it, leave this agent, or stop looking at one agent. This only closes
the view — it does NOT stop the agent and does NOT close its terminal pane."""
invoke      = "closeAgentView"
screens     = ["agent"]
unavailable_hint = "closing an agent view needs one open"
report      = "Closing the agent view."

# PRD #802 M8 — the cost-of-a-row proof: the first command added after the
# plumbing existed. It cost SEVEN files, five of them test-only and none of them
# implementation — the nine tests that pin the shipped row set by value are what
# the other five are. PRD #802's M8 milestone has the file-by-file accounting.
#
# `screens = ["deck"]` rather than `["deck", "overview"]`, and the
# narrowing is the rule rather than caution: the Settings overlay is reachable
# only from the DECK rail — the overview's rail holds Deck and Overview and
# nothing else — so listing `overview` would let voice open a surface no click
# can reach from that screen, which makes voice a second control surface with
# capabilities the first lacks. A row does not define behaviour; it exposes
# behaviour that already exists.
[[commands]]
id          = "open_settings"
description = """Open the app's Settings sheet: appearance, the decks this app connects to, voice,
and zoom. Use when the user asks for settings, preferences, options, configuration, or asks where
to change how the app looks, where to add or edit a deck, or where to put an API key. This only
opens the sheet — it changes no setting by itself."""
invoke      = "openSettings"
screens     = ["deck"]
unavailable_hint = "settings open from the deck"
report      = "Opening settings."

# PRD #802 — the first row with NO `screens` key, which means callable
# everywhere, and that is the requirement rather than an oversight: stopping
# must never be unavailable. Every other row narrows because the behaviour it
# exposes is reachable only from some screens; this one exposes the Voice
# button, which is a peer of the screen switch and is mounted on all three.
#
# `unavailable_hint` is still required and is the one column here nothing
# renders today: `Unavailable` is produced only by a row the current screen
# cannot run, and this row has no such screen. The column stays required rather
# than becoming conditional on `screens` — a second rule in the parser for one
# row shape — and the fragment below is what would render if the row were ever
# narrowed. `voice_table_rows_callable_everywhere_are_the_deliberate_set` pins
# which rows are in this position so it stays a decision.
#
# It is `stopVoice` and not `toggleVoice`: the table cannot see which way a
# toggle is pointing (the same reason `toggleEvidenceDrawer` carries a
# `no_voice`), and "voice on" is a thing nothing could hear anyway.
[[commands]]
id          = "voice_off"
description = """Turn voice control off — close the microphone and stop listening, so nothing
further is heard until the Voice button is pressed again. Use for voice off, turn off the voice,
turn voice off, stop listening, stop voice control, stop voice, or any request to stop LISTENING.
This stops the microphone and nothing else: it changes no screen, closes no view, and stops no
agent."""
invoke      = "stopVoice"
unavailable_hint = "turning voice off works anywhere"
report      = "Voice control off."

# PRD #802 D7 — discovery, and the second row with no `screens` key.
#
# The product owner asked the feature what it could do and was told that is not
# a command. This is the row that answers. It is callable everywhere for the
# same reason `voice_off` is: a user who does not know what to say cannot be
# told to go to another screen first.
#
# The overlay it opens is GENERATED from this table — every row's id, its
# description and whether this screen can run it — so a row added below appears
# in it with no edit anywhere. There is deliberately no user-facing wording
# column feeding it: the `description` a reader sees there IS this prompt, which
# reads as one, and that is the accepted cost of not keeping two wordings in
# step. `desktop_voice_commands` in `lib.rs` has the argument.
[[commands]]
id          = "list_commands"
description = """List everything the user can say right now: an overlay naming every spoken
command and what each one does. Use when the user asks what they can say, what commands there
are, what you can do, how this works, for help, for the options, or for a list. This only shows
the list — it runs none of the commands on it."""
invoke      = "showVoiceCommands"
unavailable_hint = "the list of commands opens anywhere"
report      = "Here is what you can say."

# PRD #802 D6 — modal dictation, and the feature's own point in the owner's
# words: *"see what's going on in any of the agents and interact with any of
# them."*
#
# **The only row here that is not supervision.** What it does is aim the
# microphone: while it is aimed, an utterance is no longer resolved against
# this table at all — it is typed into that agent's visible input. That is an
# interaction MODE rather than a command, which is why D6 was deferred past the
# navigation slice and why this row costs more than a row (PRD #802 M8's
# accounting is about commands, and this is the case it does not cover).
#
# It opens the agent's pane as well as aiming at it, and the two are one action
# rather than a convenience: the requirement is that the words land in a
# VISIBLE input the user can edit, and on the overview no terminal is mounted
# at all. A command that typed into a terminal nobody could see would be the
# hidden buffer this feature is defined against.
#
# No `screens`, so callable everywhere — including from the `agent` screen,
# which is where a user most often is when they decide to say something to the
# agent they are watching. `open_agent` is narrower (`deck`, `overview`) and
# that difference is deliberate rather than an oversight: that row's whole
# effect is the navigation, which from the agent screen means swapping one pane
# for another, while this row's effect is where the microphone points.
[[commands]]
id          = "dictate_to_agent"
description = """Aim the microphone at ONE agent and type what the user says into that agent's
prompt, instead of treating it as a command. Use when the user asks to type, talk, write, dictate,
say something or send a message TO a named agent — "type to the tester", "talk to the coder",
"tell the reviewer that ...". The agent is named the way the deck shows it: a role like "tester"
or "orchestrator", or a name the user gave it. Do NOT use this for a request to LOOK at an agent
or open its pane, which is `open_agent`."""
invoke      = "dictateToAgent"
unavailable_hint = "typing to an agent works anywhere"
report      = "Typing to {agent}. Say “stop dictation” when you are done."

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"
