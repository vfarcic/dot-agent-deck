user's words for the agent."""
invoke      = "openCardPullRequest"
screens     = ["overview"]
unavailable_hint = "a card's pull request opens from the agent dashboard's cards"
report      = "Opening the pull request on {agent}'s card."
asks_to     = "open the pull request an agent reported on its card"
try_saying  = "open the pull request on {agent}'s card"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "open_card_issue"
description = """Open, in the app's GitHub browser, the issue an agent reported on its CARD, as the
deck checked it. Use for open the issue on the coder's card, show the tester's issue, which issue
is the dispatcher's unit working on. Set `agent` to the user's words for the agent."""
invoke      = "openCardIssue"
screens     = ["overview"]
unavailable_hint = "a card's issue opens from the agent dashboard's cards"
report      = "Opening the issue on {agent}'s card."
asks_to     = "open the issue an agent reported on its card"
try_saying  = "open the issue on {agent}'s card"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "run_card_action"
description = """Press one of the buttons on an agent's card: an action the agent or the deck
offers (such as "Merge it", "Go ahead", "Close") or an answer to a question the agent asked on
its card. Use when the user names both the action and the agent — "send merge it to the coder",
"press go ahead on the tester's card", "answer main to the coder". Set `agent` to the user's
words for the agent and `action` to the button's label alone, as the user said it, without the verb in
front of it: `main` for "answer main to the coder", `go ahead` for "press go ahead". A catalog action is
sent to that agent; an answer to the agent's question, an action whose text the agent wrote, one
that asks for confirmation, and closing an agent, only open a review showing exactly what it does,
where the user presses Send. Stopping an agent is `stop_agent`; with an agent's pane open, typing
the user's own words to it ("tell it …") is `dictate_to_agent`."""
invoke      = "runCardAction"
screens     = ["overview", "agent"]
unavailable_hint = "a card's actions are pressed on the agent dashboard"
report      = "Pressed {action} on {agent}'s card."
asks_to     = "press one of the actions on an agent's card"
try_saying  = "press {action} on {agent}'s card"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

  [[commands.params]]
  name = "action"
  kind = "card_action"

# Issue #2399 — a batch: one card action sent to an agent and every agent
# under it (a dispatcher's units, an orchestrator's roles). Like every batch it
# only OPENS the confirmation, which lists who gets what and who is skipped and
# why; the user presses Send by hand (PRD #802 D5).
[[commands]]
id          = "run_card_action_batch"
description = """Send one of the card actions to an agent AND every agent under it on the agent
dashboard — a dispatcher and all its units, an orchestrator and all its roles — after the user
reviews it. Use when the user names an action and a group: "go ahead on everything under the
dispatcher", "send go ahead to the whole orchestration", "close every agent under the planner".
Set `agent` to the user's words for the agent at the top and `action` to the button's label as the
user said it. It only opens a confirmation listing each agent, the exact text it gets and which are
skipped; nothing is sent until the user presses Send. One agent's own button is
`run_card_action`."""
invoke      = "runCardActionBatch"
screens     = ["overview"]
unavailable_hint = "a card action is sent to a group from the agent dashboard's cards"
report      = "Review {action} for {agent} and every agent under it, then press Send."
asks_to     = "send one card action to an agent and every agent under it"
try_saying  = "{action} on everything under {agent}"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

  [[commands.params]]
  name = "action"
  kind = "card_action"

# Issue #2399 review — the Cards view's selection by voice: select and
# unselect named agents (a closed card takes everything under it along, as its
# checkbox does), then send one action to the selection. Selecting sends
# nothing; the action, like every batch, only OPENS the confirmation.
[[commands]]
id          = "select_agent_card"
description = """Select one agent's card on the agent dashboard for a batch, so a later action can be
sent to every selected agent at once. A card whose tree is closed takes every agent under it along.
Use only when the user says card, selection or batch — "select the coder's card", "add the tester
to the selection", "select the reviewer for the batch". A bare "select the coder" opens that agent
and is `open_agent`. Set `agent` to the user's words for the agent. It sends nothing. Sending an
action to the selection is `run_card_action_on_selection`; to an agent and everything under it in
one go, `run_card_action_batch`."""
invoke      = "selectAgentCard"
screens     = ["overview"]
unavailable_hint = "cards are selected on the agent dashboard's cards"
report      = "Selected {agent}'s card."
asks_to     = "select an agent's card for a batch"
try_saying  = "select {agent}'s card"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "unselect_agent_card"
description = """Take one agent's card out of the batch selection on the agent dashboard; a card
whose tree is closed takes every agent under it out too. Use for unselect the coder's card,
deselect the tester's card, remove the reviewer from the selection. Set `agent` to the user's words
for the agent. It sends nothing."""
invoke      = "unselectAgentCard"
screens     = ["overview"]
unavailable_hint = "cards are unselected on the agent dashboard's cards"
report      = "Took {agent}'s card out of the selection."
asks_to     = "take an agent's card out of the batch selection"
try_saying  = "unselect {agent}'s card"

  [[commands.params]]
  name = "agent"
  kind = "agent_ref"

[[commands]]
id          = "clear_card_selection"
description = """Clear the batch selection on the agent dashboard, so no agent's card is selected any more.
Use for clear the selection, unselect everything, deselect all the cards, start the selection over.
To take ONE agent's card out of the selection, use `unselect_agent_card`. It sends nothing."""
invoke      = "clearCardSelection"
screens     = ["overview"]
unavailable_hint = "the selection is cleared on the agent dashboard's cards"
report      = "Cleared the selection."
asks_to     = "clear the batch selection"
try_saying  = "clear the selection"

[[commands]]
id          = "run_card_action_on_selection"
description = """Send one of the card actions to every SELECTED agent on the agent dashboard, after
the user reviews it. Use when the user names an action and the selection: "go ahead on the
selected agents", "send go ahead to the selection", "close the selected ones". Set `action` to the
button's label as the user said it. It only opens a confirmation listing each agent, the exact text
it gets and which are skipped; nothing is sent until the user presses Send. Selecting agents is
`select_agent_card`; an agent and everything under it is `run_card_action_batch`."""
invoke      = "runSelectionBatch"
screens     = ["overview"]
unavailable_hint = "an action is sent to the selected cards from the agent dashboard's cards"
report      = "Review {action} for the selected agents, then press Send."
asks_to     = "send one card action to every selected agent"
try_saying  = "{action} on the selected agents"

  [[commands.params]]
  name = "action"
  kind = "card_action"

# PRD #2374 decision 2026-11-24 — the Card actions editor, where the user adds,
# changes, hides and removes the actions agents offer on their cards (CLAUDE.md
# rule 23). Voice OPENS: the editor, its form for a new action, one action's
# form, and the confirmation of a removal; the rows after these choose and set
# what writes nothing. Nothing said here writes the daemon's config — the form's Save, the removal's Remove, Hide and Restore
# are presses by hand — so a misheard word never becomes text an agent is sent
# or takes an action off the cards.
#
# PR #2491 review T1 (2026-11-25): the Card panel's Edit (since 2026-11-26 the Card tab's) opens the editor over
# an agent's pane opened from the dashboard, so the editor's rows run on the
# agent screen too. There an opening naming no daemon means the PANE's daemon,
# never a selection behind the pane; a pane the Daemons screen opened, and one
# whose daemon has no editor, are refused in words by the app.
#
# PR #2491 decision 2026-11-25: the editor belongs to one daemon (each
# daemon's ⋯ menu on the dashboard opens it bound to that daemon, and it has no
# Daemon picker), so this row names the daemon with an optional `deck`. With
# one daemon showing cards a bare "open card actions" opens it; with several,
# the app asks which, as a bare "show host" does. `choose_card_actions_daemon`,
# the picker's row, is retired with the picker.
[[commands]]
id          = "open_card_actions_editor"
description = """Open one daemon's Card actions editor on the agent dashboard: the list of actions
agents can offer on their cards (such as Go ahead and Merge it), where the user adds, changes, hides
and removes them. It is what Card actions in a daemon's ⋯ (More) menu opens, and what Edit beside Actions
in an agent pane's Card tab opens: over an agent's pane, naming no daemon means that agent's. Use for open card
actions, open the card actions editor, edit card actions, manage card actions, show the card actions,
and, naming the daemon (which a user may also call a deck; speech-to-text often writes daemon as
demon), open card actions on the build box, the build box daemon's card actions, edit the local
daemon's card actions. When the user names the daemon, set `deck` to the daemon they meant, exactly
as listed in `decks`; otherwise leave `deck` out. It only OPENS the editor and changes nothing.
Pressing an action on an agent's card is `run_card_action`; changing which daemon the dashboard shows
is `switch_deck`."""
invoke      = "openCardActionsEditor"
screens     = ["overview", "agent"]
unavailable_hint = "the Card actions editor opens from a daemon's ⋯ menu on the agent dashboard or over an agent's pane opened from it"
report      = "Opened the Card actions editor."
asks_to     = "open a daemon's Card actions editor"
try_saying  = "open card actions"

  [[commands.params]]
  name     = "deck"
  kind     = "deck_ref"
  optional = true

[[commands]]
id          = "add_card_action"
description = """Open the Card actions editor's form for a NEW card action, empty, for the user to fill
in and save by hand. Use for add a card action, new card action, create a card action. It opens the
editor first when it is closed. It saves nothing: the user types the fields and presses Save.
Changing an action that is already listed is `edit_card_action`."""
invoke      = "addCardAction"
screens     = ["overview", "agent"]
unavailable_hint = "card actions are added in the Card actions editor, from the agent dashboard or over an agent's pane opened from it"
report      = "The form for a new card action is open: fill it in and press Save."
asks_to     = "add a new card action"
try_saying  = "add a card action"

[[commands]]
id          = "edit_card_action"
description = """Open the Card actions editor's form for one listed card action, to change its text,
label, icon or settings by hand. Use for edit the merge it action, change the go ahead action, open
the ship it action. Set `action` to the action's label as the user said it. It saves nothing: the user
changes the fields and presses Save. A new action is `add_card_action`; pressing an action on an
agent's card is `run_card_action`."""
invoke      = "editCardAction"
screens     = ["overview", "agent"]
unavailable_hint = "card actions are changed in the Card actions editor, from the agent dashboard or over an agent's pane opened from it"
report      = "The form for {action} is open: change it and press Save."
asks_to     = "change one of the card actions"
try_saying  = "edit the {action} action"

  [[commands.params]]
  name = "action"
  kind = "card_action"

[[commands]]
id          = "remove_card_action"
description = """Ask to remove one of the user's OWN card actions in the Card actions editor. Set
`action` to the action's label as the user said it. It only opens the editor's confirmation, which
names the action; nothing is removed until the user presses Remove by hand. A deck default (Go ahead,
Merge it) cannot be removed, only hidden, and hiding is done by hand in the editor."""
invoke      = "removeCardAction"
screens     = ["overview", "agent"]
unavailable_hint = "card actions are removed in the Card actions editor, from the agent dashboard or over an agent's pane opened from it"
report      = "Confirm removing {action} in the Card actions editor: press Remove."
asks_to     = "remove one of my card actions"
try_saying  = "remove the {action} action"

  [[commands.params]]
  name = "action"
  kind = "card_action"

# Issue #2399 review 12 — the rest of the Card actions editor's choices that
# write nothing: reading the list again, the form's icon (by the icon's name,
# held to the user's words as the directory filter is) and its two checkboxes,
# one row per state so a spoken "ask before sending" never unticks a box that
# was ticked. The form's Save still writes, by hand. Which daemon's actions the
# editor shows is `open_card_actions_editor`'s `deck` since PR #2491 decision
# 2026-11-25 retired the Daemon picker and its row.
[[commands]]
id          = "refresh_card_actions"
description = """Read the open Card actions editor's list again from its daemon, keeping whatever the
form holds. Use for refresh the card actions, reload the card actions, read the card actions again,
check the card actions list. It writes nothing."""
invoke      = "refreshCardActions"
screens     = ["overview", "agent"]
unavailable_hint = "the Card actions editor's list is read again while the editor is open, on the agent dashboard or over an agent's pane opened from it"
report      = "Reading the card actions again."
asks_to     = "read the Card actions editor's list again"
try_saying  = "refresh the card actions"

[[commands]]
id          = "choose_card_action_icon"
description = """In the Card actions editor's form, choose the action's icon by its name, such as rocket,
git merge, play, bug or ship. Set `icon` to the icon's name as the user said it. It only sets the
form's icon; nothing is saved until the user presses Save."""
invoke      = "chooseCardActionIcon"
screens     = ["overview", "agent"]
unavailable_hint = "a card action's icon is chosen in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Icon: {icon}. Press Save to keep it."
asks_to     = "choose the icon of the card action I am editing"
try_saying  = "icon rocket"

  [[commands.params]]
  name = "icon"
  kind = "filter_text"

[[commands]]
id          = "ask_before_sending_card_action"
description = """In the Card actions editor's form, tick Ask before sending, so pressing the action asks
the user to confirm before its text is sent. Use for ask before sending, ask first, confirm before
sending. It only sets the form's checkbox; nothing is saved until the user presses Save."""
invoke      = "askBeforeSendingCardAction"
screens     = ["overview", "agent"]
unavailable_hint = "the Ask before sending box is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Ask before sending is ticked. Press Save to keep it."
asks_to     = "make the card action I am editing ask before sending"
try_saying  = "ask before sending"

[[commands]]
id          = "send_card_action_without_asking"
description = """In the Card actions editor's form, untick Ask before sending, so pressing the action
sends its text at once. Use for don't ask before sending, send without asking, no confirmation. It
only sets the form's checkbox; nothing is saved until the user presses Save."""
invoke      = "sendCardActionWithoutAsking"
screens     = ["overview", "agent"]
unavailable_hint = "the Ask before sending box is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Ask before sending is unticked. Press Save to keep it."
asks_to     = "make the card action I am editing send without asking"
try_saying  = "send without asking"

[[commands]]
id          = "offer_card_action_on_every_card"
description = """In the Card actions editor's form, tick Offer on every card, so every agent's card offers
the action whether or not the agent suggests it. Use for offer on every card, show it on every card,
always offer it. It only sets the form's checkbox; nothing is saved until the user presses Save."""
invoke      = "offerCardActionOnEveryCard"
screens     = ["overview", "agent"]
unavailable_hint = "the Offer on every card box is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Offer on every card is ticked. Press Save to keep it."
asks_to     = "offer the card action I am editing on every card"
try_saying  = "offer on every card"

[[commands]]
id          = "offer_card_action_when_agents_choose"
description = """In the Card actions editor's form, untick Offer on every card, so the action is offered
only when an agent suggests it. Use for don't offer on every card, only when agents suggest it, not on
every card. It only sets the form's checkbox; nothing is saved until the user presses Save."""
invoke      = "offerCardActionWhenAgentsChoose"
screens     = ["overview", "agent"]
unavailable_hint = "the Offer on every card box is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Offer on every card is unticked. Press Save to keep it."
asks_to     = "offer the card action I am editing only when agents suggest it"
try_saying  = "only when agents suggest it"

[[commands]]
id          = "show_card_action_on_the_card"
description = """In the Card actions editor's form, set Placement to Show on the card, so the action is an
icon on each card that offers it. Use for show it on the card, put it on the card, as an icon on the
card. It only sets the form's choice; nothing is saved until the user presses Save."""
invoke      = "showCardActionOnCard"
screens     = ["overview", "agent"]
unavailable_hint = "the Placement choice is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Placement is Show on the card. Press Save to keep it."
asks_to     = "show the card action I am editing on the card"
try_saying  = "show it on the card"

[[commands]]
id          = "show_card_action_only_in_the_card_tab"
description = """In the Card actions editor's form, set Placement to Only in the Card tab, so the action
draws no icon on the card and is offered only in the Card tab of the agent's pane. Use for only in
the Card tab, only in the card, not on the card, no icon on the card. It only sets the form's choice; nothing is saved until the user
presses Save."""
invoke      = "showCardActionOnlyInCardTab"
screens     = ["overview", "agent"]
unavailable_hint = "the Placement choice is set in the Card actions editor's form, on the agent dashboard or over an agent's pane opened from it"
report      = "Placement is Only in the Card tab. Press Save to keep it."
asks_to     = "offer the card action I am editing only in the Card tab"
try_saying  = "only in the Card tab"
