orchestrator. Set `agent` to the user's words for the agent whose tree to open. Opening the agent
with its card is `show_agent_card`; opening an agent's terminal pane is `open_agent`."""
invoke      = "openCardTree"
screens     = ["overview"]
unavailable_hint = "a card's tree opens on the agent dashboard's cards"
report      = "Opened {agent}'s tree."
asks_to     = "show the agents under one agent's card"
try_saying  = "open {agent}'s tree"

  [[commands.params]]
