# PRD #1401 — an agent's pull request in the app's own browser. `open_pr` is
# the agent dashboard's and the agent screen's, and names its agent the way
# `open_agent` does; `open_pr_in_browser` and the page's scrolls are the
# browser's own screen's (`pull_request`); `close` closes the browser first.
# On the dashboard with no agent named it asks which of the planted fleet's
# four, each offered as a choice (`open-pr-on-the-dashboard-asks-which-agent`,
