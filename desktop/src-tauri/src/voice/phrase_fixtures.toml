# `submit_prompt` through the model rather than through the local phrase list,
# for the reason above: `end`, `send it` and `submit` never reach a backend.
# The model's path is held to the WHOLE utterance too (PRD #1223, closing audit
# G1), so these are the command said on its own in words the local list does
# not hold — "send it" wrapped in an edge "okay" / "please". They replaced
# "okay that's the whole prompt, send it off", which a sentence containing
# "send" now cannot ground. A bare "go ahead" on the agent screen is NOT here:
