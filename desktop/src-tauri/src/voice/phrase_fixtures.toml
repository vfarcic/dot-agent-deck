# The dictation pair, and the collision that matters most in this whole
# manifest: a request to LOOK at an agent must not type into it, and a request
# to have something typed must not merely open a pane. `open-agent-zoom` and
# `open-agent-by-state` above are the other half of that pair and are
# deliberately left untouched, so a `description` that blurs the two goes red on
# one side or the other.
#
# **Every dictation fixture here uses an opener the LOCAL fast path does not
# know**, which is the whole point of having them: `type`, `write`, `say` and
# `dictate` never reach a model at all, so a fixture built on one of them would
# prove nothing about the row's description. These are the fallback — the model
# marking a boundary in words no list contains.
#
# The `dictate_prefix` column is the app's half of the bargain. It is the
# introducing words the model must return, and the runner checks the resolved
# param against it rather than against a free-text content: what gets typed is
# taken from the transcript by `voice::dictation::strip_opening`, and a model
# that marked the wrong boundary is a fixture failure rather than a silent
# paraphrase.

[[fixtures]]
name = "dictate-lets-write-a-prompt"
utterance = "let's write a prompt run the login tests"
screen = "agent"
action = "dictate_to_agent"
outcome = "dispatch"
dictate_prefix = "let's write a prompt"

[[fixtures]]
name = "dictate-tell-it-to"
utterance = "tell it to rebase onto main"
screen = "agent"
action = "dictate_to_agent"
outcome = "dispatch"
dictate_prefix = "tell it to"

[[fixtures]]
name = "dictate-ask-it-to"
utterance = "ask it to summarise what it just did"
screen = "agent"
action = "dictate_to_agent"
outcome = "dispatch"
dictate_prefix = "ask it to"

[[fixtures]]
name = "dictate-unavailable"
utterance = "let's write a prompt run the login tests"
screen = "deck"
action = "dictate_to_agent"
outcome = "unavailable"

# `submit_prompt` through the model rather than through the local phrase list,
