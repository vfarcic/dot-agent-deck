# PRD #802 M9 — utterances the reference intent backend must keep routing.
#
# These are model-facing compatibility fixtures, not examples for a keyword
# matcher. Each shipped action has deliberately different phrasings, and one
# representative phrase is repeated on a screen where that action is not
# callable so a typo in `commands.toml`'s `screens` column is observable.

[[fixtures]]
name = "open-agent-zoom"
utterance = "zoom the tester"
screen = "deck"
action = "open_agent"
outcome = "dispatch"
resolved_agent = "agent-tester"

