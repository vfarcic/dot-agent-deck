[package]
name = "dot-agent-deck-desktop"
version = "0.1.0"
description = "Opt-in desktop control surface for dot-agent-deck"
edition = "2024"

[lib]
name = "dot_agent_deck_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dot-agent-deck = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# PRD #803: the desktop app's own settings document is TOML, a sibling of
# the TUI's config.toml. Same version pin as the root package.
toml = "1.0"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
# The `#[tokio::test]` attribute needs `macros` + `rt`, and the scripted-socket
# handshake tests in `daemon_bridge.rs` need `net`. All three have always been
# reachable here through feature unification with the root crate — which is a
# property of what ANOTHER crate happens to enable, not a declaration this crate
# makes. Declaring them means a change over there cannot silently take this
# crate's tests out.
#
# PRD #742 M14 adds `test-util`, which is NOT in the root crate's `full` and so
# was never reachable by unification at all. It is what lets the bound on a
# daemon reply be asserted without spending it: `start_paused` advances the
# clock whenever the runtime has nothing ready to poll, so a test that parks on
# a silent socket proves a fifteen-second timeout fires in milliseconds of wall
# clock. Dev-only — nothing under `src/` may depend on a paused clock.
#
# Issue #1028's regression test writes a PARTIAL frame header by hand — the
# protocol crate's `write_frame` can only write whole frames — so it needs
# `AsyncWriteExt`, which lives behind `io-util`.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "test-util",
] }
# PRD #803: every settings test drives an explicit path inside a temp dir so
# none of them can touch the developer's real ~/.config/dot-agent-deck.
tempfile = "3"
# PRD #741 M4(b): `AgentEvent::timestamp` is a `chrono::DateTime<Utc>`, so the
# fold tests in `agent_view.rs` have to build one. Tests only — nothing under
# `src/` names chrono, and the same version the root package resolves.
chrono = "0.4"

# PRD #803: the settings-path guard rejects a FIFO, and `mkfifo(3)` is the only
# way to build one to prove it. Tests only — nothing under `src/` uses libc.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Issue #845: `tauri::test::MockRuntime`, which the two appearance tests that
# need a concrete `Runtime` name instead of `Wry`. The feature is `test = []` —
# no dependency, one gated item (`pub mod test`) — and it is a dev dependency,
# so it is off for a normal build of the app.
#
# NOT on Windows, and that is measured rather than cautious. Naming ANY concrete
# `Runtime` from a reachable test path puts imports in this crate's test binary
# that the Windows runner's loader cannot resolve, and the binary then fails to
# START: `cargo nextest run --workspace` dies at `--list --format terse aborted
# with code 0xc0000139: The specified procedure could not be found` before a
# single test in the whole workspace runs. Two CI rounds established that the
# runtime is the variable and the feature is not — `Wry` without this feature
# and `MockRuntime` with it fail identically. See `src/appearance.rs`.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

