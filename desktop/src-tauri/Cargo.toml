[package]
name = "dot-agent-deck-desktop"
version = "0.1.0"
description = "Opt-in desktop control surface for dot-agent-deck"
edition = "2024"
rust-version.workspace = true

[lib]
name = "dot_agent_deck_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dot-agent-deck = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# PRD #803: the desktop app's own settings document is TOML, a sibling of
# the TUI's config.toml. Same version pin as the root package.
#
# Issue #825 REPLACED `toml` with `toml_edit` here rather than adding it
# beside, and the replacement is the point: two TOML libraries in one crate
# means two parsers that can disagree about the same file, so `settings.rs`
# names exactly one. `toml_edit` is a strict superset of what this crate used
# — `de::from_str` and `ser::to_string_pretty` cover every call site, and the
# rendering is byte-identical (pinned by `default_document_shape_is_pinned`).
#
# It is also not a new dependency in any sense that costs anything. The root
# package already declares `toml_edit = "0.25"` for the same reason (a
# format-preserving edit of the user's `~/.codex/config.toml`), this crate
# already links the root package, and the lockfile already carries exactly one
# `toml_edit`. Turning on its `serde` feature adds `serde_core` and
# `serde_spanned`, both of which the graph already had; dropping `toml` takes
# `toml_parser`/`toml_writer` nowhere, since `toml_edit` uses those too.
#
# What it buys: the save path merges into a format-preserving DOM, so a user's
# comments, inline-array/inline-table spelling, key order and blank-line
# grouping survive a write. `toml::Table` models DATA, so it could not.
toml_edit = { version = "0.25", features = ["serde"] }
# PRD #802 M5 added `process` and `rt` to what was `["sync", "time"]`, and its
# provider work took `process` back out.
#
# `process` was the agent-CLI intent backend spawning `claude`, which is the
# one thing in this crate that ever launched a child. That backend is deleted
# — Commands is API-only — and `grep -rn 'tokio::process' desktop/src-tauri/`
# is now empty, so the feature goes with it rather than sitting here as a
# capability nothing uses.
#
# `rt` is `spawn_blocking`. Three callers, none of them voice: the two endpoint
# probes in `endpoint_test.rs` and the tunnel open in `endpoint_tunnels.rs`,
# all of which are blocking by nature and must not run on a runtime thread.
#
# It adds no dependency and no line of new code to the workspace build: the
# root package already declares `tokio` with `full`, so this was reachable here
# by feature unification. Declaring it is the same discipline the
# dev-dependency block below states — a change over there cannot silently take
# this crate's backends out.
tokio = { version = "1", features = ["rt", "sync", "time"] }
# PRD #802 M5: the keyed remote intent backend's one HTTPS request
# (`voice/remote.rs`). The CSP leaves no alternative to making it here —
# `tauri.conf.json`'s `connect-src` names `ipc:` and `http://ipc.localhost` and
# nothing else, so the webview cannot reach a network origin and read the reply
# — and the credential is already Rust-side anyway.
#
# NOT A NEW DEPENDENCY, in the sense that costs anything: the root package
# declares reqwest 0.13 with this exact spec, this crate already links the root
# package, and the lockfile carries exactly one `reqwest`. The version, the
# `default-features = false` and the two features are copied verbatim from
# there so cargo resolves one build of it rather than two feature sets of one.
#
# `rustls` rather than a native-TLS feature, and no roots feature named, for the
# root package's stated reason: 0.13 renamed 0.12's `rustls-tls` and brought its
# own root-certificate source, and 0.13.4 removed the `webpki-roots` /
# `rustls-native-certs` names 0.13.1 offered — so pinning one breaks on the next
# patch bump. `rustls` is the one name stable across 0.13.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
# PRD #802 M4: the OS keychain behind `secrets.rs`'s `SecretStore`, which is the
# seam PRD #803 M5 named and deliberately did not build. Genuinely new — no
# crate here declares `keyring`, `secret-service`, `security-framework` or
# `stronghold`, and what exists is credential *detection* in the e2e harness,
# which reads and never writes — so it is a cost rather than an incidental, and
# this is the accounting.
#
# Narrower than PRD #802's own wording, which says those four are "at zero
# matches workspace-wide". That holds for what a crate DECLARES and not for the
# lockfile: `security-framework 3.7.0` is already in it, reaching the graph on
# macOS through `reqwest` -> `rustls-platform-verifier`. It changes nothing
# about this being a new dependency; it is worth saying because the Apple
# backend below is a second consumer of a crate already there rather than a new
# tree.
#
# WHY A DEPENDENCY AT ALL. #803's rule is that a secret never goes in
# `desktop.toml` and never in `localStorage`, and
# `xtask/linkage-check`'s ALLOWED_FIELD_TYPES enforces the first half by
# refusing a `String` in the settings schema. That leaves the credential
# somewhere else by construction, and the OS keychain is where #803 said it
# goes. The alternative it named — an owner-only file in the config directory —
# stays available as a fallback and is not what this PR builds.
#
# DEFAULT FEATURES, DELIBERATELY. `default = ["v1"]` selects one store per
# target and none of them needs a system dev package, which is the property that
# made this acceptable: `apple-native-keyring-store` (the Security framework) on
# macOS, `windows-native-keyring-store` (`windows-sys`) on Windows, and
# `zbus-secret-service-keyring-store` on Linux and the other unixes. Each is
# target-gated in `keyring`'s own manifest, so Windows never compiles the zbus
# tree and Linux never compiles the Apple one.
#
# How much of that was verified, because the three are not equal: the Linux one
# BUILT here with nothing added, and the Windows one TYPE-CHECKED through
# `scripts/windows-cross-check.sh`. The macOS one is read from the manifest and
# from its dependency `security-framework`, which was already in this
# workspace's lockfile before this change; `build-macos` is what proves it.
#
# The two Linux alternatives were each worse in a stated way: the
# `dbus-secret-service` backend binds `libdbus` and would need `libdbus-1-dev`
# in `tauri-deps/flake.nix` and both `apt-get` blocks in `ci.yml` — the
# three-file shape M7's `alsa-lib` will take — while `linux-keyutils` needs no
# package and keeps its keys in the kernel, where they do not survive a reboot,
# which a user experiences as the app forgetting their key overnight.
#
# WHAT IT COSTS. 59 new lockfile entries, dominated by zbus and by
# `secret-service`'s pure-Rust crypto (`aes`, `cbc`, `hkdf`, `hmac`, `sha2`,
# `num-bigint` for the session key exchange). Measured on this branch, 16 cores:
# building all 59 from a clean slate took 13.9s wall / 66s CPU and produced
# 210 MiB of artifacts; warm it is a no-op, and neither `cargo test-fast` nor
# rule 2's clippy command moved. `crypto-rust` is what `keyring` pins for both
# secret-service backends, so no `openssl` and no `vendored` C build enters the
# graph.
keyring = "4"
# PRD #802 M7: microphone capture (`voice/capture.rs`). THE one native
# dependency this PRD takes, and the accounting is the PRD's own.
#
# WHY RUST-SIDE AT ALL. The webview cannot do it on the platforms this app
# ships to. Read from `wry` 0.55.1: WKWebView grants capture unconditionally,
# WebView2's permission handler is wired only for the clipboard, and the
# WebKitGTK backend connects no `permission-request` signal and never sets
# `enable-media-stream` — so a `getUserMedia` path would ship a macOS-only
# feature. Capturing here also removes the AudioWorklet, the CSP question and
# the three-engine matrix at once, and the audio has to reach this process
# anyway because the CSP forces every network hop Rust-side.
#
# WHY NOT BEHIND A CARGO FEATURE, which is the tempting way to keep it out of
# the workspace gate: that reproduces the hole class this repo has closed three
# times (#407, #436, #502) — code behind a feature nobody's gate enables is
# type-checked by nothing and lints clean by compiling nothing. Rule 2's clippy
# command names `e2e,e2e-live` for exactly that reason.
#
# DEFAULT FEATURES, which is `default = []` — cpal declares no default feature
# content at all, so `jack` and `asio` (the two that would drag in a system
# library or a vendored SDK) stay off. What it resolves to per platform:
# `alsa` + `libc` + `dasp_sample` on Linux, the `objc2-*`/`coreaudio-rs`
# CoreAudio tree on Apple, `windows`/`windows-core` on Windows.
#
# WHAT IT COSTS ON LINUX, and this is the whole reason M7 is last: `alsa-sys`
# resolves `alsa` through pkg-config, so the dev headers have to be declared
# everywhere this repo declares system dependencies — `tauri-deps/flake.nix`
# (which is what a `devbox shell` reads), both `apt-get` blocks in
# `.github/workflows/ci.yml`, and the bundle job's block in `release.yml`.
# macOS needs nothing for CoreAudio and Windows nothing for WASAPI, so the edit
# is Linux-shaped. No CMake, no bundled C++ tree, no model and no new build
# toolchain — a Rust binding to a library the platform already has, which is
# why this dependency is acceptable where an inference engine is not.
cpal = "0.18"
# PRD #802 M7: the multipart boundary for one transcription upload
# (`voice/transcribe.rs`). NOT a new dependency in any sense that costs
# anything — the root package declares `getrandom = "0.3"` for the hook
# capability token, this crate already links the root package, and the lockfile
# carries exactly one of it. Declaring it is the discipline the `tokio` entry
# above states: a change over there cannot silently take this crate's uploads
# out.
#
# Randomness rather than a counter because the boundary has to be a byte
# sequence the BODY cannot contain, and the body is a WAV whose samples are
# arbitrary. Deliberately `getrandom` and not `rand`, for the root package's
# reason: the whole requirement is "N bytes from the operating system".
getrandom = "0.4"

[dev-dependencies]
# The `#[tokio::test]` attribute needs `macros` + `rt`, and the scripted-socket
# handshake tests in `daemon_bridge.rs` need `net`. All three have always been
# reachable here through feature unification with the root crate — which is a
# property of what ANOTHER crate happens to enable, not a declaration this crate
# makes. Declaring them means a change over there cannot silently take this
# crate's tests out.
#
# PRD #742 M14 adds `test-util`, which is NOT in the root crate's `full` and so
# was never reachable by unification at all. It is what lets the bound on a
# daemon reply be asserted without spending it: `start_paused` advances the
# clock whenever the runtime has nothing ready to poll, so a test that parks on
# a silent socket proves a fifteen-second timeout fires in milliseconds of wall
# clock. Dev-only — nothing under `src/` may depend on a paused clock.
#
# Issue #1028's regression test writes a PARTIAL frame header by hand — the
# protocol crate's `write_frame` can only write whole frames — so it needs
# `AsyncWriteExt`, which lives behind `io-util`.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "test-util",
] }
# PRD #803: every settings test drives an explicit path inside a temp dir so
# none of them can touch the developer's real ~/.config/dot-agent-deck.
tempfile = "3"
# PRD #741 M4(b): `AgentEvent::timestamp` is a `chrono::DateTime<Utc>`, so the
# fold tests in `agent_view.rs` have to build one. Tests only — nothing under
# `src/` names chrono, and the same version the root package resolves.
chrono = "0.4"
# PRD #802's landed-work security audit: `voice/http.rs`'s body cap has to be
# driven with real `reqwest::Response` values, and `From<http::Response<T>> for
# Response` is the one way to build one WITHOUT opening a socket — which is the
# rule every test in this feature already follows. Tests only, and the same
# `http` the lockfile already carries for reqwest, so the `From` impl applies.
http = "1"

# One caller, Unix-only, and a TEST.
#
# PRD #803's settings-path guard rejects a FIFO, and `mkfifo(3)` is the only way
# to build one to prove it.
#
# It was a production dependency between PRD #802's landed-work security audit
# and its provider work: the agent-CLI intent backend put its child in a process
# group so a timeout tore down the whole containment unit rather than the direct
# child, and `libc::killpg` is what took it down. That backend is gone, so this
# is back where it was — a dev-dependency under the same spec, which is also
# what it was before the audit.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Issue #845: `tauri::test::MockRuntime`, which the two appearance tests that
# need a concrete `Runtime` name instead of `Wry`. The feature is `test = []` —
# no dependency, one gated item (`pub mod test`) — and it is a dev dependency,
# so it is off for a normal build of the app.
#
# NOT on Windows, and that is measured rather than cautious. Naming ANY concrete
# `Runtime` from a reachable test path puts imports in this crate's test binary
# that the Windows runner's loader cannot resolve, and the binary then fails to
# START: `cargo nextest run --workspace` dies at `--list --format terse aborted
# with code 0xc0000139: The specified procedure could not be found` before a
# single test in the whole workspace runs. Two CI rounds established that the
# runtime is the variable and the feature is not — `Wry` without this feature
# and `MockRuntime` with it fail identically. See `src/appearance.rs`.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }


# PRD #802's sleep work: the Linux half of `voice/wake.rs` — one
# `org.freedesktop.login1.Manager.Inhibit("idle", …, "block")` call on the
# system bus, whose reply is the file descriptor that IS the inhibit.
#
# NOT A NEW DEPENDENCY in any sense that costs a build second or a lockfile
# entry: `keyring`'s `zbus-secret-service-keyring-store` backend — the one that
# is already selected on Linux by the `keyring = "4"` entry above — pulls
# exactly this `zbus` in, and the lockfile carries one of it. Default features,
# which is `async-io` + `blocking-api`, is what that backend already resolves,
# so declaring it here adds no feature either. Declaring it at all is the
# discipline the `tokio` and `getrandom` entries above state: a change over
# there cannot silently take this crate's sleep inhibit out.
#
# `zbus::blocking` rather than the async API because every call site is already
# on a blocking thread — opening the audio device and asking the machine to
# stay awake happen in the same `spawn_blocking` closure — and an async D-Bus
# connection would need a runtime of its own driven from there anyway.
#
# Target-gated to Linux because that is where logind is. macOS and Windows get
# hand-written FFI to a framework and a DLL their target already links (see
# `voice/wake.rs`), so neither needs a crate, and this one is never compiled
# for them.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# PRD #802's sleep work: the Windows half of `voice/wake.rs` —
# `SetThreadExecutionState(ES_CONTINUOUS | ES_SYSTEM_REQUIRED)`, which is the
# system-stays-awake request that leaves the display free to blank.
#
# NOT A NEW DEPENDENCY, same accounting as `zbus` above: the root package
# declares `windows-sys = "0.61"` for its named pipes and Job Objects, this
# crate already links the root package, `keyring`'s Windows backend resolves it
# too, and the lockfile carries one 0.61. `Win32_System_Power` is the only
# feature named here and it adds no crate — windows-sys features select which
# of its own bindings are compiled, and the whole of `Win32_System_Power` is
# three constants and one `link!`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
