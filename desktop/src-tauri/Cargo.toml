[package]
name = "dot-agent-deck-desktop"
version = "0.1.0"
description = "Opt-in desktop control surface for dot-agent-deck"
edition = "2024"

[lib]
name = "dot_agent_deck_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dot-agent-deck = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# PRD #803: the desktop app's own settings document is TOML, a sibling of
# the TUI's config.toml. Same version pin as the root package.
toml = "1.0"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
# The `#[tokio::test]` attribute needs `macros` + `rt`, and the scripted-socket
# handshake tests in `daemon_bridge.rs` need `net`. All three have always been
# reachable here through feature unification with the root crate — which is a
# property of what ANOTHER crate happens to enable, not a declaration this crate
# makes. Declaring them means a change over there cannot silently take this
# crate's tests out.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
# PRD #803: every settings test drives an explicit path inside a temp dir so
# none of them can touch the developer's real ~/.config/dot-agent-deck.
tempfile = "3"

# PRD #803: the settings-path guard rejects a FIFO, and `mkfifo(3)` is the only
# way to build one to prove it. Tests only — nothing under `src/` uses libc.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
