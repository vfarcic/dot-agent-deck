default_job = "test-fast"

# These three mirror the `test-fast` / `test-e2e` / `test-e2e-live` aliases in
# .cargo/config.toml and must keep doing so — a watch loop that runs a narrower
# tier than the per-task gate is worse than no watch loop. `--workspace` in
# particular (issue #489): without it cargo selects the root package alone and
# the `xtask/*` members' tests never run.
#
# `test-fast` is the per-task gate (CLAUDE.md rule 5) and is the default job
# above. The other two are the e2e tier's lanes: `test-e2e` is lane 1, the 47
# `tests/e2e_*.rs` files needing no agent credential, and `test-e2e-live` is the
# SUPERSET — all 71, so it needs a working agent credential. Since issue #502
# neither is a pre-PR obligation; CI runs lane 1 on every PR and lane 2
# per-merge on `main`. In a watch loop you almost always want one of these with
# a filter appended (`bacon test-e2e -- lifecycle_001`), which is rule 6.
[jobs.test-fast]
command = ["cargo", "nextest", "run", "--workspace"]
need_stdout = true

[jobs.test-e2e]
command = ["cargo", "nextest", "run", "--workspace", "--features", "e2e"]
need_stdout = true

[jobs.test-e2e-live]
command = ["cargo", "nextest", "run", "--workspace", "--features", "e2e,e2e-live"]
need_stdout = true

[jobs.clippy]
command = ["cargo", "clippy", "--", "-D", "warnings"]
need_stdout = false

[jobs.fmt]
command = ["cargo", "fmt", "--check"]
need_stdout = false
