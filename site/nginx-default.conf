server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Every URL the Docusaurus site served, redirected to its Markdown
    # successor. Generated from docs/published.toml by `cargo xtask site
    # --nginx-redirects`; exact-match locations, so they outrank everything
    # below.
    include /etc/nginx/site-redirects.conf;

    # The published docs are Markdown, served readable (PRD #1419): a browser
    # shows the text instead of downloading it, and a fetching agent gets a
    # type it recognises. `types {}` empties the extension map here so
    # `default_type` is what every match is served as.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    location ~ ^/(llms|llms-full|robots)\.txt$ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # Generated from docs/published.toml by `cargo xtask site`, like
    # robots.txt above, which names it.
    location = /sitemap.xml {
        types { }
        default_type "application/xml; charset=utf-8";
    }

    # Netlify's config files ride along in the same output; nginx has no use
    # for them.
    location ~ ^/_(redirects|headers)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
