version: "3"

tasks:
  docs-install:
    desc: Install documentation site dependencies
    dir: site
    cmds:
      - npm install

  docs-dev:
    desc: Start documentation site in dev mode with live reload
    dir: site
    cmds:
      - npm start

  docs-build:
    desc: Build documentation site for production
    dir: site
    cmds:
      - npm run build

  docs-serve:
    desc: Serve the built documentation site locally
    dir: site
    cmds:
      - npm run serve

  run:
    desc: >-
      Build this checkout and start the TUI against an ISOLATED sandbox daemon, so
      trying a branch build never bounces your everyday deck. Run it from the
      directory holding your .dot-agent-deck.toml. Vars: DIR (config dir, default
      the dir you invoke from), SANDBOX (isolation state dir, default DIR/.dad-sandbox),
      PROFILE (release|debug, default release).
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      PROFILE: '{{.PROFILE | default "release"}}'
    cmds:
      # Build from the Taskfile's own checkout, so the binary always matches the
      # branch you are sitting on rather than whatever is installed on PATH.
      - cargo build {{if eq .PROFILE "release"}}--release{{end}}
      - |
        set -eu
        dir="{{.DIR}}"
        sandbox="${SANDBOX:-$dir/.dad-sandbox}"
        bin="{{.TASKFILE_DIR}}/target/{{.PROFILE}}/dot-agent-deck"

        if [ ! -f "$dir/.dot-agent-deck.toml" ]; then
          echo "note: no .dot-agent-deck.toml in $dir — the deck will start with no" >&2
          echo "      modes/orchestrations configured. Pass DIR=<dir> to point elsewhere." >&2
        fi
        mkdir -p "$sandbox"

        # Isolation. Without these, a branch build's build-version handshake
        # (PRD #103/#161) SIGTERMs the daemon your installed build is using —
        # silently when no agents are live — and switching back bounces it again.
        # These four are the documented production overrides (src/config.rs).
        export DOT_AGENT_DECK_ATTACH_SOCKET="$sandbox/attach.sock"
        export DOT_AGENT_DECK_SOCKET="$sandbox/hook.sock"
        export DOT_AGENT_DECK_STATE_DIR="$sandbox/state"
        export DOT_AGENT_DECK_SESSION="$sandbox/session.toml"

        # Panes inherit this PATH, so an agent inside the sandbox that types a
        # bare `dot-agent-deck` must reach the branch build — not whatever is
        # installed. Without this the release binary on PATH wins and the miss is
        # SILENT for every verb that exists in both builds, so a pane can "test
        # the branch" while actually exercising the installed release.
        export PATH="$(dirname "$bin"):$PATH"

        # ...and the PATH prepend above is NOT enough on its own. Agents here are
        # launched through `devbox run <script>` (see .dot-agent-deck.toml's role
        # commands), and a NESTED devbox re-derives PATH from its own environment:
        # the prepend above is DISCARDED, and devbox.json's init_hook then puts
        # $HOME/.local/bin first — so a bare `dot-agent-deck` in a pane reaches the
        # INSTALLED RELEASE. Measured: level-1 PATH starts with the build dir,
        # level-2 (the agent) starts with $HOME/.local/bin and has no build dir at
        # all. Ordinary env vars DO survive that nesting, so hand the dir over as
        # one and let init_hook re-prepend it inside every devbox layer.
        export DAD_DEV_BIN="$(dirname "$bin")"

        echo "deck:    $bin"
        echo "config:  $dir"
        echo "sandbox: $sandbox   (task run-stop to shut its daemon down)"
        cd "$dir" && exec "$bin"

  run-stop:
    desc: Stop the sandbox daemon started by `task run` (leaves your real daemon alone). Same DIR/SANDBOX vars.
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      PROFILE: '{{.PROFILE | default "release"}}'
    cmds:
      - |
        set -eu
        dir="{{.DIR}}"
        sandbox="${SANDBOX:-$dir/.dad-sandbox}"
        export DOT_AGENT_DECK_ATTACH_SOCKET="$sandbox/attach.sock"
        export DOT_AGENT_DECK_SOCKET="$sandbox/hook.sock"
        export DOT_AGENT_DECK_STATE_DIR="$sandbox/state"
        export DOT_AGENT_DECK_SESSION="$sandbox/session.toml"
        "{{.TASKFILE_DIR}}/target/{{.PROFILE}}/dot-agent-deck" daemon stop "$@"

  reel-smoke:
    desc: Build a demo reel from a tiny fixture and assert the stitched MP4 with ffprobe (local-only; no network, no upload)
    cmds:
      - .claude/skills/demo-reel/tests/smoke.sh

  reel-adapter-test:
    desc: Assert the demo-reel adapter builds manifest.json in catalog order, excludes L1 (cast-less) and unmarked tests, and clean-skips with the right reason for each cause (no agg/ffmpeg, no network; the reel-path cases use git in a throwaway repo; CI-safe)
    cmds:
      - .claude/skills/demo-reel-adapter/tests/adapter_test.sh

  checksums:
    desc: Generate SHA256 checksums for release binaries
    dir: dist
    cmds:
      - shasum -a 256 dot-agent-deck-* > checksums.txt

  homebrew-formula:
    desc: Generate Homebrew formula from release binaries (NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to publish a parallel pre-release formula)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
      CLASS_NAME:
        sh: echo "{{.NAME | default "dot-agent-deck"}}" | awk -F'-' '{for(i=1;i<=NF;i++) printf "%s", toupper(substr($i,1,1)) substr($i,2)}'
      # Each channel declares conflicts_with the other channel's formula name
      # so a user installing one is forced to uninstall the other. The invoked
      # binary is always `dot-agent-deck` regardless of channel — no CLI surface
      # divergence between stable and beta.
      CONFLICTS_WITH: '{{if eq .NAME "dot-agent-deck-beta"}}dot-agent-deck{{else}}dot-agent-deck-beta{{end}}'
      VERSION_NO_V:
        sh: echo "{{.VERSION}}" | sed 's/^v//'
      BASE_URL: https://github.com/vfarcic/dot-agent-deck/releases/download/{{.VERSION}}
      SHA_DARWIN_ARM64:
        sh: grep 'dot-agent-deck-darwin-arm64$' dist/checksums.txt | awk '{print $1}'
      SHA_DARWIN_AMD64:
        sh: grep 'dot-agent-deck-darwin-amd64$' dist/checksums.txt | awk '{print $1}'
      SHA_LINUX_ARM64:
        sh: grep 'dot-agent-deck-linux-arm64$' dist/checksums.txt | awk '{print $1}'
      SHA_LINUX_AMD64:
        sh: grep 'dot-agent-deck-linux-amd64$' dist/checksums.txt | awk '{print $1}'
    cmds:
      - |
        for var in "SHA_DARWIN_ARM64:{{.SHA_DARWIN_ARM64}}" "SHA_DARWIN_AMD64:{{.SHA_DARWIN_AMD64}}" "SHA_LINUX_ARM64:{{.SHA_LINUX_ARM64}}" "SHA_LINUX_AMD64:{{.SHA_LINUX_AMD64}}"; do
          name="${var%%:*}"
          value="${var#*:}"
          if [ -z "$value" ]; then
            echo "Error: $name is empty — check dist/checksums.txt" >&2
            exit 1
          fi
        done
        cat > dist/{{.NAME}}.rb << 'FORMULA'
        class {{.CLASS_NAME}} < Formula
          desc "TUI dashboard for monitoring AI agent sessions"
          homepage "https://github.com/vfarcic/dot-agent-deck"
          version "{{.VERSION_NO_V}}"
          license "MIT"

          conflicts_with "{{.CONFLICTS_WITH}}",
            because: "both install a `dot-agent-deck` binary; only one channel can be active at a time"

          on_macos do
            if Hardware::CPU.arm?
              url "{{.BASE_URL}}/dot-agent-deck-darwin-arm64"
              sha256 "{{.SHA_DARWIN_ARM64}}"
            else
              url "{{.BASE_URL}}/dot-agent-deck-darwin-amd64"
              sha256 "{{.SHA_DARWIN_AMD64}}"
            end
          end

          on_linux do
            if Hardware::CPU.arm?
              url "{{.BASE_URL}}/dot-agent-deck-linux-arm64"
              sha256 "{{.SHA_LINUX_ARM64}}"
            else
              url "{{.BASE_URL}}/dot-agent-deck-linux-amd64"
              sha256 "{{.SHA_LINUX_AMD64}}"
            end
          end

          def install
            bin.install Dir["dot-agent-deck-*"].first => "dot-agent-deck"
          end

          test do
            assert_match "dot-agent-deck", shell_output("#{bin}/dot-agent-deck --help")
          end
        end
        FORMULA
        sed -i.bak -e 's/^        //' dist/{{.NAME}}.rb && rm -f dist/{{.NAME}}.rb.bak

  homebrew-publish:
    desc: Push Homebrew formula to the tap repository (NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to update the parallel pre-release formula)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    cmds:
      - |
        if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
          echo "Error: HOMEBREW_TAP_TOKEN environment variable is required"
          exit 1
        fi
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT
        cd "$WORK_DIR"
        git clone --quiet "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/vfarcic/homebrew-tap.git" .
        mkdir -p Formula
        cp {{.TASKFILE_DIR}}/dist/{{.NAME}}.rb Formula/{{.NAME}}.rb
        git add Formula/{{.NAME}}.rb
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --cached --quiet || git commit -m "Update {{.NAME}} formula to {{.VERSION}}"
        git push origin main

  scoop-manifest:
    desc: Generate Scoop manifest from release binaries (NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to publish a parallel pre-release manifest)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
      VERSION_NO_V:
        sh: echo "{{.VERSION}}" | sed 's/^v//'
      BASE_URL: https://github.com/vfarcic/dot-agent-deck/releases/download/{{.VERSION}}
      SHA_WINDOWS_AMD64:
        sh: grep 'dot-agent-deck-windows-amd64.exe$' dist/checksums.txt | awk '{print $1}'
    cmds:
      - |
        cat > dist/{{.NAME}}.json << MANIFEST
        {
            "version": "{{.VERSION_NO_V}}",
            "description": "TUI dashboard for monitoring AI agent sessions",
            "homepage": "https://github.com/vfarcic/dot-agent-deck",
            "license": "MIT",
            "architecture": {
                "64bit": {
                    "url": "{{.BASE_URL}}/dot-agent-deck-windows-amd64.exe",
                    "hash": "{{.SHA_WINDOWS_AMD64}}"
                }
            },
            "bin": [["dot-agent-deck-windows-amd64.exe", "dot-agent-deck"]],
            "checkver": "github",
            "autoupdate": {
                "architecture": {
                    "64bit": {
                        "url": "https://github.com/vfarcic/dot-agent-deck/releases/download/v\$version/dot-agent-deck-windows-amd64.exe"
                    }
                }
            }
        }
        MANIFEST
        sed -i.bak -e 's/^        //' dist/{{.NAME}}.json && rm -f dist/{{.NAME}}.json.bak

  scoop-publish:
    desc: Push Scoop manifest to the bucket repository (NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to update the parallel pre-release manifest)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    cmds:
      - |
        if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
          echo "Error: SCOOP_BUCKET_TOKEN environment variable is required"
          exit 1
        fi
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT
        cd "$WORK_DIR"
        git clone --quiet "https://x-access-token:$SCOOP_BUCKET_TOKEN@github.com/vfarcic/scoop-bucket.git" .
        cp {{.TASKFILE_DIR}}/dist/{{.NAME}}.json {{.NAME}}.json
        git add {{.NAME}}.json
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --cached --quiet || git commit -m "Update {{.NAME}} manifest to {{.VERSION}}"
        git push origin main
