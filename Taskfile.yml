version: "3"

tasks:
  docs-install:
    desc: Install documentation site dependencies
    dir: site
    cmds:
      - npm install

  docs-dev:
    desc: Start documentation site in dev mode with live reload
    dir: site
    cmds:
      - npm start

  docs-build:
    desc: Build documentation site for production
    dir: site
    cmds:
      - npm run build

  docs-serve:
    desc: Serve the built documentation site locally
    dir: site
    cmds:
      - npm run serve

  run:
    desc: >-
      Build this checkout and start the TUI against an ISOLATED sandbox daemon, so
      trying a branch build never bounces your everyday deck. Run it from the
      directory holding your .dot-agent-deck.toml. Vars: DIR (config dir, default
      the dir you invoke from), SANDBOX (isolation state dir, default DIR/.dad-sandbox),
      PROFILE (release|debug, default release). See docs/develop/local-run.md.
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      SANDBOX: '{{.SANDBOX | default ""}}'
      PROFILE: '{{.PROFILE | default "release"}}'
    env:
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
      DAD_RUN_DIR: '{{.DIR}}'
      DAD_RUN_SANDBOX: '{{.SANDBOX}}'
      DAD_RUN_PROFILE: '{{.PROFILE}}'
    cmds:
      # Build from the Taskfile's own checkout, so the binary always matches the
      # branch you are sitting on rather than whatever is installed on PATH.
      - cargo build {{if eq .PROFILE "release"}}--release{{end}}
      # The isolation itself — every override, and why — lives in the script, so
      # run, run-desktop, run-all and run-stop cannot drift apart on it.
      - bash "$DAD_TASKFILE_DIR/scripts/sandbox-run.sh" tui "$DAD_TASKFILE_DIR" "$DAD_RUN_DIR" "$DAD_RUN_SANDBOX" "$DAD_RUN_PROFILE"

  run-desktop:
    desc: >-
      Build this checkout and start the desktop GUI (pnpm tauri dev, from THIS
      checkout's desktop/) against the same isolated sandbox as `task run`, with
      its own desktop.toml. Its Start deck launches the sandbox daemon. Same
      DIR/SANDBOX vars; PROFILE defaults to debug, the profile tauri dev builds.
      Do not run it from a worktree agents are editing — vite reloads the window
      on every save.
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      SANDBOX: '{{.SANDBOX | default ""}}'
      PROFILE: '{{.PROFILE | default "debug"}}'
    env:
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
      DAD_RUN_DIR: '{{.DIR}}'
      DAD_RUN_SANDBOX: '{{.SANDBOX}}'
      DAD_RUN_PROFILE: '{{.PROFILE}}'
    cmds:
      - cargo build {{if eq .PROFILE "release"}}--release{{end}}
      - bash "$DAD_TASKFILE_DIR/scripts/sandbox-run.sh" desktop "$DAD_TASKFILE_DIR" "$DAD_RUN_DIR" "$DAD_RUN_SANDBOX" "$DAD_RUN_PROFILE"

  run-all:
    desc: >-
      Build this checkout and run the TUI AND the desktop GUI against ONE isolated
      sandbox daemon — the TUI in this terminal, the desktop in the background with
      its output in SANDBOX/desktop.log, and the desktop stopped when the TUI exits.
      Same DIR/SANDBOX vars as `task run`; PROFILE defaults to debug, the profile
      tauri dev builds. Do not run it from a worktree agents are editing — vite
      reloads the window on every save. See docs/develop/local-run.md.
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      SANDBOX: '{{.SANDBOX | default ""}}'
      PROFILE: '{{.PROFILE | default "debug"}}'
    env:
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
      DAD_RUN_DIR: '{{.DIR}}'
      DAD_RUN_SANDBOX: '{{.SANDBOX}}'
      DAD_RUN_PROFILE: '{{.PROFILE}}'
    cmds:
      - cargo build {{if eq .PROFILE "release"}}--release{{end}}
      - bash "$DAD_TASKFILE_DIR/scripts/sandbox-run.sh" all "$DAD_TASKFILE_DIR" "$DAD_RUN_DIR" "$DAD_RUN_SANDBOX" "$DAD_RUN_PROFILE"

  run-stop:
    desc: >-
      Stop what `task run`, `task run-desktop` or `task run-all` started in the
      sandbox — a background desktop, then the sandbox daemon — and leave your real
      daemon alone. Same DIR/SANDBOX vars; PROFILE defaults to the build that
      started the sandbox. Arguments after -- go to `daemon stop`, e.g.
      `task run-stop -- --force` to stop a sandbox daemon that still has agents.
    vars:
      DIR: '{{.DIR | default .USER_WORKING_DIR}}'
      SANDBOX: '{{.SANDBOX | default ""}}'
      PROFILE: '{{.PROFILE | default ""}}'
    env:
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
      DAD_RUN_DIR: '{{.DIR}}'
      DAD_RUN_SANDBOX: '{{.SANDBOX}}'
      DAD_RUN_PROFILE: '{{.PROFILE}}'
    cmds:
      - bash "$DAD_TASKFILE_DIR/scripts/sandbox-run.sh" stop "$DAD_TASKFILE_DIR" "$DAD_RUN_DIR" "$DAD_RUN_SANDBOX" "$DAD_RUN_PROFILE" {{.CLI_ARGS}}

  reel-smoke:
    desc: Build a demo reel from a tiny fixture and assert the stitched MP4 with ffprobe (local-only; no network, no upload)
    cmds:
      - .claude/skills/demo-reel/tests/smoke.sh

  reel-adapter-test:
    desc: Assert the demo-reel adapter builds manifest.json in catalog order, excludes L1 (cast-less) and unmarked tests, refuses a cast whose provenance sidecar does not record a passing run at the current commit, and clean-skips with the right reason for each cause (no agg/ffmpeg, no network; the reel-path cases use git in a throwaway repo; CI-safe)
    cmds:
      - .claude/skills/demo-reel-adapter/tests/adapter_test.sh

  checksums:
    desc: Generate SHA256 checksums for release binaries
    dir: dist
    cmds:
      - shasum -a 256 dot-agent-deck-* > checksums.txt

  # The four release tasks below run in release.yml's `finalize` job, two of
  # them holding cross-repo tokens. None of them splices a task variable into
  # its shell text (issue #324): go-task substitutes `{{.VAR}}` before the shell
  # parses the command, so a crafted value would run as code. Each binds its
  # values through `env:` instead, and scripts/release-channel-vars.sh
  # validates them before any is used and derives the rest.
  homebrew-formula:
    desc: Generate Homebrew formula from release binaries (VERSION is the v-prefixed release tag; NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to publish a parallel pre-release formula)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    env:
      DAD_RELEASE_VERSION: '{{.VERSION}}'
      DAD_CHANNEL_NAME: '{{.NAME}}'
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        . "$DAD_TASKFILE_DIR/scripts/release-channel-vars.sh"
        SHA_DARWIN_ARM64=$(dad_checksum dot-agent-deck-darwin-arm64) || exit 1
        SHA_DARWIN_AMD64=$(dad_checksum dot-agent-deck-darwin-amd64) || exit 1
        SHA_LINUX_ARM64=$(dad_checksum dot-agent-deck-linux-arm64) || exit 1
        SHA_LINUX_AMD64=$(dad_checksum dot-agent-deck-linux-amd64) || exit 1
        # Each channel declares conflicts_with the other channel's formula name
        # so a user installing one is forced to uninstall the other. The invoked
        # binary is always `dot-agent-deck` regardless of channel — no CLI surface
        # divergence between stable and beta.
        cat > "dist/${DAD_CHANNEL_NAME}.rb" << FORMULA
        class ${CLASS_NAME} < Formula
          desc "TUI dashboard for monitoring AI agent sessions"
          homepage "https://github.com/vfarcic/dot-agent-deck"
          version "${VERSION_NO_V}"
          license "MIT"

          conflicts_with "${CONFLICTS_WITH}",
            because: "both install a \`dot-agent-deck\` binary; only one channel can be active at a time"

          on_macos do
            if Hardware::CPU.arm?
              url "${BASE_URL}/dot-agent-deck-darwin-arm64"
              sha256 "${SHA_DARWIN_ARM64}"
            else
              url "${BASE_URL}/dot-agent-deck-darwin-amd64"
              sha256 "${SHA_DARWIN_AMD64}"
            end
          end

          on_linux do
            if Hardware::CPU.arm?
              url "${BASE_URL}/dot-agent-deck-linux-arm64"
              sha256 "${SHA_LINUX_ARM64}"
            else
              url "${BASE_URL}/dot-agent-deck-linux-amd64"
              sha256 "${SHA_LINUX_AMD64}"
            end
          end

          def install
            bin.install Dir["dot-agent-deck-*"].first => "dot-agent-deck"
          end

          test do
            assert_match "dot-agent-deck", shell_output("#{bin}/dot-agent-deck --help")
          end
        end
        FORMULA
        sed -i.bak -e 's/^        //' "dist/${DAD_CHANNEL_NAME}.rb" && rm -f "dist/${DAD_CHANNEL_NAME}.rb.bak"

  homebrew-publish:
    desc: Push Homebrew formula to the tap repository (VERSION is the v-prefixed release tag; NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to update the parallel pre-release formula)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    env:
      DAD_RELEASE_VERSION: '{{.VERSION}}'
      DAD_CHANNEL_NAME: '{{.NAME}}'
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        . "$DAD_TASKFILE_DIR/scripts/release-channel-vars.sh"
        if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
          echo "Error: HOMEBREW_TAP_TOKEN environment variable is required"
          exit 1
        fi
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT
        cd "$WORK_DIR"
        git clone --quiet "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/vfarcic/homebrew-tap.git" .
        mkdir -p Formula
        cp "$DAD_TASKFILE_DIR/dist/${DAD_CHANNEL_NAME}.rb" "Formula/${DAD_CHANNEL_NAME}.rb"
        git add "Formula/${DAD_CHANNEL_NAME}.rb"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --cached --quiet || git commit -m "Update ${DAD_CHANNEL_NAME} formula to ${DAD_RELEASE_VERSION}"
        git push origin main

  scoop-manifest:
    desc: Generate Scoop manifest from release binaries (VERSION is the v-prefixed release tag; NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to publish a parallel pre-release manifest)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    env:
      DAD_RELEASE_VERSION: '{{.VERSION}}'
      DAD_CHANNEL_NAME: '{{.NAME}}'
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        . "$DAD_TASKFILE_DIR/scripts/release-channel-vars.sh"
        # Optional: no release builds a Windows binary yet, and the manifest has
        # always been written with an empty hash in that case (see the helper).
        SHA_WINDOWS_AMD64=$(dad_checksum dot-agent-deck-windows-amd64.exe optional) || exit 1
        cat > "dist/${DAD_CHANNEL_NAME}.json" << MANIFEST
        {
            "version": "${VERSION_NO_V}",
            "description": "TUI dashboard for monitoring AI agent sessions",
            "homepage": "https://github.com/vfarcic/dot-agent-deck",
            "license": "MIT",
            "architecture": {
                "64bit": {
                    "url": "${BASE_URL}/dot-agent-deck-windows-amd64.exe",
                    "hash": "${SHA_WINDOWS_AMD64}"
                }
            },
            "bin": [["dot-agent-deck-windows-amd64.exe", "dot-agent-deck"]],
            "checkver": "github",
            "autoupdate": {
                "architecture": {
                    "64bit": {
                        "url": "https://github.com/vfarcic/dot-agent-deck/releases/download/v\$version/dot-agent-deck-windows-amd64.exe"
                    }
                }
            }
        }
        MANIFEST
        sed -i.bak -e 's/^        //' "dist/${DAD_CHANNEL_NAME}.json" && rm -f "dist/${DAD_CHANNEL_NAME}.json.bak"

  scoop-publish:
    desc: Push Scoop manifest to the bucket repository (VERSION is the v-prefixed release tag; NAME defaults to dot-agent-deck; pass NAME=dot-agent-deck-beta to update the parallel pre-release manifest)
    requires:
      vars: [VERSION]
    vars:
      NAME: '{{.NAME | default "dot-agent-deck"}}'
    env:
      DAD_RELEASE_VERSION: '{{.VERSION}}'
      DAD_CHANNEL_NAME: '{{.NAME}}'
      DAD_TASKFILE_DIR: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        . "$DAD_TASKFILE_DIR/scripts/release-channel-vars.sh"
        if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
          echo "Error: SCOOP_BUCKET_TOKEN environment variable is required"
          exit 1
        fi
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT
        cd "$WORK_DIR"
        git clone --quiet "https://x-access-token:$SCOOP_BUCKET_TOKEN@github.com/vfarcic/scoop-bucket.git" .
        cp "$DAD_TASKFILE_DIR/dist/${DAD_CHANNEL_NAME}.json" "${DAD_CHANNEL_NAME}.json"
        git add "${DAD_CHANNEL_NAME}.json"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --cached --quiet || git commit -m "Update ${DAD_CHANNEL_NAME} manifest to ${DAD_RELEASE_VERSION}"
        git push origin main
