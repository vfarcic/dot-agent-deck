# Issue #1701 — linkage-check rule 14's control-site ratchet
# (`xtask/linkage-check/src/voice_control_sites.rs`).
#
# Every desktop control wired with an `onClick`-family handler in production
# `.tsx` under `desktop/src` that is NOT a single `VOICE_ACTIONS` dispatch is
# listed here, with a sentence saying what it is and why it is not a voice
# capability. A new site fails the build until it goes through the registry or
# is added here with a reason; an entry that matches no site fails it too, so
# this list only shrinks.
#
# Before adding an entry, answer CLAUDE.md rule 23: a new desktop control is
# reachable by voice through the registry, or its registry entry carries a
# `no_voice` reason. An entry here is for what is not a capability at all — a
# dismissal, a keystroke into a field, a control that forwards a prop the host
# already wires through the registry — or for a control kept off voice on
# purpose, with the purpose written down.
#
# `Gap:` marks a capability that has no voice path and no reason to keep it
# off voice: the voice-reachability backlog as of when this list was written.
# `grep -c '^reason = "Gap:' xtask/linkage-check/voice-control-sites.toml` counts it.
#
# Keys: `file` and `handler` name the site, `code` is the whole handler
# expression with whitespace collapsed. Identical sites in one file are listed
# once each. The failure message prints the stanza for
# a new site; paste it and write the reason.

