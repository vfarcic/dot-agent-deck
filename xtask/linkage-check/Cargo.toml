[package]
name = "xtask-linkage-check"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

# PRD #77 Decision 7: enforces the catalog↔test linkage and Decision 21's
# no-raw-sleep rule. Invoked as `cargo xtask linkage-check` via the
# alias defined in `.cargo/config.toml`.

[[bin]]
name = "xtask-linkage-check"
path = "src/main.rs"

[dependencies]
# `span-locations` (issue #688, rule 17) so a finding can name the line syn
# parsed a `fn` at, rather than re-finding it by text. A feature of a crate
# already in Cargo.lock, on the normal-dependency instance only — proc-macro
# builds get their own resolution and are untouched.
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
# PRD #819 M7 (rule 12) walks the desktop crate's AST, so it needs `visit`
# on top of what the `#[spec]` binding already uses. Pure feature — it pulls no
# new crate into Cargo.lock.
syn = { version = "3", features = ["full", "parsing", "visit"] }
# PRD #802 M3 (rule 14) reads `desktop/src-tauri/src/voice/commands.toml`. The
# same library `voice/table.rs` parses it with, deliberately: two readers of one
# file is two answers about what the file says, and the lenient one always wins
# by accepting what the strict one rejected. No new crate in Cargo.lock — the
# root package and the desktop crate both already declare toml_edit 0.25, and
# this needs the DOM only, so no feature is turned on.
toml_edit = "0.25"
xtask-docs = { path = "../docs" }

# `clean-e2e-tmp` needs two libc calls that have no std equivalent:
#
# - `geteuid(2)` (issue #322) scopes the harness's private `/var/tmp` parent to
#   the effective UID, and proves that parent is really this user's before
#   anything under it is deleted.
# - `kill(pid, 0)` (issue #461) decides ownership by liveness — the only call
#   that distinguishes "no such process" (ESRCH, dead) from "not yours" (EPERM,
#   alive).
#
# `libc` is already a workspace dependency at the same version and gating (the
# root package declares it under `[target.'cfg(unix)'.dependencies]`), so this
# pulls no new crate into Cargo.lock. Unix-only: every `libc::` reference is
# behind `#[cfg(unix)]`, the whole `/var/tmp` rung is `cfg(unix)`-gated to match
# the harness, and non-Unix targets fall back to the age rule.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Already a root-package dependency at the same version, so this pulls no new
# crate into Cargo.lock. Used by `issue_labeler_policy` to read back the
# `label-policy.json` the labeler's setup step writes.
serde_json = "1"
tempfile = "3"
# Issue #1061: `skill_frontmatter` has to decide whether a `SKILL.md`
# frontmatter block is really valid YAML, and the whole defect it guards is
# that a LENIENT reader accepted what a spec-correct one rejected — so
# hand-rolling a parser here would reproduce the bug rather than catch it.
# `yaml-rust2` is a fully YAML 1.2 compliant pure-Rust parser. This is the one
# place in the workspace that pulls a YAML crate, and it is a DEV-dependency of
# a `publish = false` xtask crate, so it reaches no shipped binary.
# `default-features = false` drops the `encoding` feature and with it
# `encoding_rs`: these files are read as UTF-8 `String`s, so the added closure
# is just `yaml-rust2`, `hashlink` and `arraydeque`.
yaml-rust2 = { version = "0.13", default-features = false }
