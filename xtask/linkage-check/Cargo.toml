[package]
name = "xtask-linkage-check"
version = "0.0.0"
edition = "2024"
publish = false

# PRD #77 Decision 7: enforces the catalog↔test linkage and Decision 21's
# no-raw-sleep rule. Invoked as `cargo xtask linkage-check` via the
# alias defined in `.cargo/config.toml`.

[[bin]]
name = "xtask-linkage-check"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1"
regex = "1"
syn = { version = "3", features = ["full", "parsing"] }
xtask-docs = { path = "../docs" }

# `clean-e2e-tmp` scopes the harness's private `/var/tmp` parent to the
# effective UID (issue #322), and `geteuid(2)` has no std equivalent. Unix-only:
# the whole `/var/tmp` rung is `cfg(unix)`-gated, matching the harness.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
